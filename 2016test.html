<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2016: A Trilogy — Book Two: The Winter of Discontent — by inky</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #c9c5b8;
            --dim: #666;
            --red: #cc3333;
            --white: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;
            line-height: 1.75;
            color: var(--text);
            background: var(--bg);
            max-width: 640px;
            margin: 0 auto;
            padding: 5rem 2rem 10rem;
            -webkit-font-smoothing: antialiased;
        }
        h1 {
            font-size: 1.1em;
            font-weight: normal;
            text-align: center;
            margin-bottom: 5rem;
            letter-spacing: 0.15em;
            color: var(--dim);
            text-transform: uppercase;
        }
        .book-title {
            font-size: 0.9em;
            color: var(--red);
            text-align: center;
            margin: 6rem 0 3rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        h2 {
            font-size: 0.85em;
            font-weight: normal;
            text-align: center;
            margin: 4rem 0 2.5rem;
            letter-spacing: 0.08em;
            color: var(--dim);
            text-transform: uppercase;
        }
        p {
            margin-bottom: 1.4em;
            text-align: justify;
            hyphens: auto;
            text-indent: 0;
        }
        h2 + p, .book-title + p, h1 + p { text-indent: 0; }
        hr {
            border: none;
            text-align: center;
            margin: 3.5rem 0;
        }
        hr::after {
            content: "—";
            color: var(--dim);
            letter-spacing: 1em;
        }
        .colophon {
            margin-top: 10rem;
            text-align: center;
            font-size: 0.7em;
            color: var(--dim);
            line-height: 2.5;
            letter-spacing: 0.05em;
        }
        .colophon a {
            color: var(--dim);
            text-decoration: none;
            border-bottom: 1px solid #333;
            transition: color 0.3s, border-color 0.3s;
        }
        .colophon a:hover {
            color: var(--white);
            border-bottom-color: var(--red);
        }
        .back-to-top {
            display: inline-block;
            margin-top: 3rem;
            color: var(--red);
            text-decoration: none;
            font-size: 1.2em;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .back-to-top:hover { opacity: 1; }
        @media (max-width: 600px) {
            body { font-size: 16px; padding: 3rem 1.5rem 6rem; max-width: 100%; }
        }
        ::selection { background: var(--red); color: var(--bg); }
    </style>
</head>
<body id="top">

    <h1>2016: A Trilogy</h1>

    <div class="book-title">Book Two: The Winter of Discontent</div>

    </div>

</body>
</html>
