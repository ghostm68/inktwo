<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISIS // GLOBAL OSINT & RETRO NOTEBOOK</title>

  <!-- Leaflet Core (100% Keyless) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #060506;
      --panel: #0d090b;
      --panel2: #140b0e;
      --line: #260c0f;
      --line2: #3d1418;
      --txt: #f0e6e6;
      --mut: #8a7a7c;
      --dim: #5c4e50;
      --crimson: #e61c1c;
      --crimson-glow: #ff3333;
      --crimson-dark: #630c0c;
      --yel: #ffd24a;
      --mono: "Courier New", Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--txt);
      font-family: var(--mono);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    button { font-family: inherit; cursor: pointer; }
    a { color: var(--mut); text-decoration: none; }

    /* STRIP LEAFLET BRANDING COMPLETELY */
    .leaflet-control-attribution { display: none !important; }
    .leaflet-container { background: #000 !important; }

    /* CRT SCANLINE OVERLAY */
    .crt-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 9500;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 3px;
      opacity: 0.65;
    }
    .crt-off { display: none; }

    /* TACTICAL CROSS OVERLAY OVER MAP */
    #tactical-cross {
      position: absolute; inset: 0; pointer-events: none; z-index: 1500;
      background:
        linear-gradient(to right, transparent calc(50% - 0.5px), rgba(230, 28, 28, 0.25) calc(50% - 0.5px), rgba(230, 28, 28, 0.25) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), rgba(230, 28, 28, 0.25) calc(50% - 0.5px), rgba(230, 28, 28, 0.25) calc(50% + 0.5px), transparent calc(50% + 0.5px));
    }
    .grid-off { display: none !important; }

    /* ================= 1. TOP NAVIGATION ================= */
    #topbar {
      height: 50px;
      background: var(--panel);
      border-bottom: 1px solid var(--crimson);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 10000;
    }

    #brand { display: flex; align-items: center; gap: 14px; }
    #brandName {
      display: flex; align-items: center; gap: 8px;
      border-right: 1px solid var(--line2);
      padding-right: 14px;
    }
    .glyph {
      width: 16px; height: 16px; border-radius: 3px;
      background: linear-gradient(135deg, var(--crimson), #2a0306);
      border: 1px solid var(--crimson-glow);
      box-shadow: 0 0 8px var(--crimson);
    }
    .brandText { font-size: 16px; font-weight: 800; letter-spacing: 2px; color: #fff; }
    .brandSub { font-size: 10px; color: var(--mut); letter-spacing: 3px; margin-left: 4px; }

    /* GRAM SPARKLINE HEADER (LAYER-1 NATIVE ASSET) */
    #gramChart { display: flex; align-items: center; gap: 10px; }
    #gramSym { font-weight: 800; color: var(--crimson-glow); font-size: 13px; }
    #gramPrice { font-size: 15px; font-weight: bold; }
    #gramChange { font-size: 11px; padding: 2px 6px; border: 1px solid var(--line2); }
    #gramChange.up { color: var(--yel); border-color: rgba(255,210,74,0.4); }
    #gramChange.down { color: var(--crimson-glow); border-color: rgba(230,28,28,0.4); }
    #gramSpark { width: 140px; height: 32px; }

    #statusgrp { display: flex; align-items: center; gap: 14px; font-size: 11px; }
    #zulu b { color: #fff; }
    .stat { text-align: center; }
    .stat b { display: block; font-size: 13px; color: var(--crimson-glow); }
    .stat span { font-size: 8px; color: var(--mut); letter-spacing: 1px; }

    #notepadToggleBtn {
      background: #1e080b;
      border: 1px solid var(--crimson);
      color: #ff9999;
      font-size: 10px;
      padding: 5px 9px;
      letter-spacing: 1px;
    }
    #notepadToggleBtn:hover, #notepadToggleBtn.active {
      background: var(--crimson);
      color: #000;
      font-weight: bold;
    }

    /* ================= 2. WORKSPACE ================= */
    #workspace { position: relative; flex: 1; height: calc(100vh - 78px); }
    #map { width: 100%; height: 100%; background: #000; }
    .crosshair-cursor { cursor: crosshair !important; }

    #draw-hud {
      display: none;
      position: absolute;
      top: 14px;
      left: 140px;
      background: rgba(13, 8, 10, 0.92);
      border: 1px solid var(--crimson);
      padding: 6px 12px;
      font-size: 10px;
      color: #ff9999;
      letter-spacing: 1px;
      z-index: 2000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    #draw-hud b { color: #fff; }

    /* ================= 3. TOOLBAR DOCK ================= */
    #toolbar {
      position: absolute; top: 12px; left: 12px; z-index: 2000;
      display: flex; flex-direction: column; gap: 2px;
    }
    #toolbar button {
      background: rgba(13, 9, 11, 0.94);
      border: 1px solid var(--line2);
      color: var(--mut);
      width: 105px;
      padding: 7px 10px;
      font-size: 10px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    #toolbar button:hover { border-color: var(--crimson); color: #fff; background: var(--panel2); }
    #toolbar button.active {
      color: var(--crimson-glow);
      border-color: var(--crimson);
      background: linear-gradient(90deg, #2a080d, var(--panel));
      font-weight: bold;
    }

    /* ================= 4. SLIDING FLYOUT DRAWER ================= */
    #sidePanel {
      position: absolute; top: 12px; bottom: 12px; left: 124px; z-index: 1999;
      width: 312px;
      background: rgba(13, 8, 10, 0.96);
      border: 1px solid var(--crimson);
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      display: flex; flex-direction: column;
      transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s ease;
    }
    #sidePanel.closed { transform: translateX(-120%); opacity: 0; pointer-events: none; }

    .spHead {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, #24080b, var(--panel));
    }
    .spHead .t { font-weight: 800; letter-spacing: 1px; color: var(--crimson-glow); }
    .spHead .x { color: var(--mut); cursor: pointer; font-size: 13px; }
    .spHead .x:hover { color: var(--crimson-glow); }
    .spBody { padding: 12px; overflow-y: auto; flex: 1; }

    /* Side-group & Side-item Styling (Restored) */
    .side-group { border-top: 1px solid var(--line2); padding-top: 8px; margin-top: 10px; }
    .side-group-title { font-size: 9px; color: var(--mut); letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; }
    .side-item {
      display: block; width: 100%; text-align: left; background: #070304;
      border: 1px solid var(--line2); color: #c9bcbe; font-family: var(--mono);
      font-size: 10px; padding: 5px 8px; margin-bottom: 4px; cursor: pointer;
    }
    .side-item:hover, .side-item.active { border-color: var(--crimson); color: var(--crimson-glow); background: #1f070a; }

    .toggle { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
    .toggle label { color: var(--txt); font-size: 11px; }
    .toggle label em { display: block; font-style: normal; color: var(--mut); font-size: 9px; }
    .switch {
      width: 32px; height: 16px; border-radius: 8px; background: #070304;
      border: 1px solid var(--line2); position: relative; cursor: pointer;
    }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--mut); transition: 0.15s;
    }
    .switch.on { background: #33080c; border-color: var(--crimson); }
    .switch.on::after { left: 18px; background: var(--crimson-glow); box-shadow: 0 0 6px var(--crimson-glow); }

    .hud-btn {
      background: var(--panel2); border: 1px solid var(--line2); color: var(--txt);
      font-size: 10px; padding: 6px 9px; letter-spacing: 1px; text-align: left; width: 100%;
    }
    .hud-btn:hover, .hud-btn.active { border-color: var(--crimson); color: var(--crimson-glow); background: #24080b; }

    /* ================= 5. MONA WORD PROCESSOR DRAWER ================= */
    #notepadPanel {
      position: absolute; top: 12px; right: 12px; z-index: 3000;
      width: 540px; height: 490px;
      background: rgba(13, 8, 10, 0.98);
      border: 1px solid var(--crimson);
      box-shadow: 0 12px 35px rgba(0,0,0,0.92);
      display: flex; flex-direction: column;
      transform: translateY(-120%); opacity: 0; pointer-events: none;
      transition: transform 0.22s ease, opacity 0.2s ease;
    }
    #notepadPanel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }

    .npHead {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid var(--line);
      background: #18090c; font-weight: bold; color: var(--crimson-glow);
    }
    .npMeta { font-size: 10px; color: var(--mut); font-weight: normal; }
    #notepad {
      flex: 1; width: 100%; background: #040203; color: #eee;
      border: none; outline: none; resize: none; padding: 12px;
      font-family: var(--mono); font-size: 12px; line-height: 1.5;
    }
    .npFoot {
      display: flex; align-items: center; gap: 6px; padding: 7px 10px;
      border-top: 1px solid var(--line); background: #0a0607; flex-wrap: wrap;
    }
    .npFoot button {
      background: var(--panel2); color: var(--txt); border: 1px solid var(--line2);
      font-size: 10px; padding: 4px 8px; letter-spacing: 1px;
    }
    .npFoot button:hover { border-color: var(--crimson); color: var(--crimson-glow); }
    .npFoot button.exp-btn { border-color: #57161b; color: #ff9999; }
    .npFoot button.exp-btn:hover { background: var(--crimson); color: #000; border-color: var(--crimson); }
    
    /* Voice button pulsing state */
    button#voiceButton.recording {
      background: var(--crimson);
      color: #000;
      font-weight: bold;
      border-color: var(--crimson-glow);
      box-shadow: 0 0 8px var(--crimson);
    }

    /* ================= 6. INTEL WIRE FOOTER ================= */
    #statusbar {
      height: 28px; background: #050304; border-top: 1px solid var(--crimson);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; font-size: 10px; z-index: 10000;
    }
    #ticker-marquee { color: #d6cbcc; }
    #ticker-marquee b { color: var(--crimson-glow); }
  </style>
</head>
<body>

  <!-- CRT SCANLINES & TACTICAL CROSS OVERLAYS -->
  <div id="crt" class="crt-overlay crt-off"></div>

  <!-- 1. TOP NAVIGATION -->
  <header id="topbar">
    <div id="brand">
      <div id="brandName">
        <div class="glyph"></div>
        <span class="brandText">ISIS<span class="brandSub">INTEL</span></span>
      </div>

      <!-- Live TON Gram Micro-Chart -->
      <div id="gramChart" title="GRAM (Layer-1 Native Asset) - Live Market Feed">
        <span id="gramSym">GRAM</span>
        <span id="gramPrice">--</span>
        <span id="gramChange" class="up">--%</span>
        <svg id="gramSpark" viewBox="0 0 140 32" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div id="statusgrp">
      <div id="zulu">ZULU <b id="zulu-clock">00:00:00</b>Z</div>
      <div class="stat"><b id="cnt-quakes">0</b><span>QUAKES</span></div>
      <div class="stat"><b id="cnt-fires">0</b><span>FIRES</span></div>
      <div class="stat"><b id="cnt-choke">6</b><span>CHOKEPOINTS</span></div>
      <button id="notepadToggleBtn">[MONA PWP EDITOR]</button>
    </div>
  </header>

  <!-- 2. MAIN WORKSPACE -->
  <div id="workspace">
    <div id="tactical-cross"></div>
    <div id="draw-hud"></div>
    <div id="map"></div>

    <!-- LEFT TOOLBAR -->
    <nav id="toolbar">
      <button data-tool="layers" class="active"><span>⌂</span>LAYERS</button>
      <button data-tool="sectors"><span>◎</span>SECTORS</button>
      <button data-tool="space"><span>✦</span>ORBIT</button>
      <button data-tool="choke"><span>⚓</span>MARITIME</button>
      <button data-tool="route"><span>⇶</span>ROUTE</button>
      <button data-tool="draw"><span>✎</span>DRAW</button>
    </nav>

    <!-- SLIDING FLYOUT DRAWER -->
    <aside id="sidePanel">
      <div class="spHead">
        <span class="t" id="spTitle">INTEL LAYERS</span>
        <span class="x" id="spClose">&#10005;</span>
      </div>
      <div class="spBody" id="spContent"></div>
    </aside>

    <!-- MONA PWP RETRO NOTEPAD (DRAWER REVEAL) -->
    <div id="notepadPanel">
      <div class="npHead">
        <span>TALAMASCA DOLL-PROCESSOR // <b>MONA PWP-9000</b></span>
        <span class="npMeta" id="npMeta">LN 1 | 0 WORDS</span>
      </div>
      <textarea id="notepad" spellcheck="false" placeholder="Enter tactical notes or speak via Voice Input... Buffer persists to local storage."></textarea>
      <div class="npFoot">
        <input type="file" id="monaFileInput" accept=".txt,.bak,.wsd,.md,.doc,text/*" style="display:none;" />
        
        <!-- Action Buttons -->
        <button class="exp-btn" onclick="document.getElementById('monaFileInput').click()">IMP .FILE</button>
        <button class="exp-btn" onclick="exportMona('txt')">EXP .TXT</button>
        <button class="exp-btn" onclick="exportMona('bak')">EXP .BAK</button>
        <button class="exp-btn" onclick="exportMona('wsd')">EXP .WSD</button>
        <button onclick="copyMona()">COPY</button>
        <button onclick="clearMona()">PURGE</button>
        
        <!-- Voice Input Engine -->
        <button id="voiceButton" class="exp-btn" onclick="toggleVoiceInput()">[MIC: OFF]</button>

        <span id="npSaveStatus" style="margin-left:auto; font-size:10px; color:var(--crimson-glow);">SYNCED</span>
      </div>
    </div>
  </div>

  <!-- 3. INTEL WIRE FOOTER -->
  <footer id="statusbar">
    <div id="ticker-marquee">FEED: <span>INITIALIZING SENSOR MESH...</span></div>
    <div>DIRECT BROWSER RUNTIME | NO PROXY REQUIRED</div>
  </footer>

  <script>
    // ================= 1. SYSTEM CLOCK & SOLENOID ENGINE =================
    function tickClock() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      document.getElementById('zulu-clock').innerText = `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;
    }
    setInterval(tickClock, 1000); tickClock();

    let audioOn = false;
    let audioCtx = null;
    function playSolenoid(freq = 130, dur = 0.03) {
      if (!audioOn) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    function toggleAudio(btn) {
      audioOn = !audioOn;
      btn.innerText = audioOn ? "[x] SOLENOID CLICKS" : "[ ] SOLENOID CLICKS";
      btn.classList.toggle('active', audioOn);
      if (audioOn) playSolenoid(180, 0.04);
    }

    function toggleCRT(btn) {
      playSolenoid(80, 0.04);
      const crt = document.getElementById('crt');
      crt.classList.toggle('crt-off');
      btn.innerText = crt.classList.contains('crt-off') ? "[ ] CRT SCANLINES" : "[x] CRT SCANLINES";
      btn.classList.toggle('active', !crt.classList.contains('crt-off'));
    }

    function toggleGrid(btn) {
      playSolenoid(110, 0.03);
      const cross = document.getElementById('tactical-cross');
      cross.classList.toggle('grid-off');
      btn.innerText = cross.classList.contains('grid-off') ? "[ ] TACTICAL CROSS" : "[x] TACTICAL CROSS";
      btn.classList.toggle('active', !cross.classList.contains('grid-off'));
    }

    // ================= 2. MAP INITIALIZATION (Attribution Disabled) =================
    const map = L.map("map", {
      zoomControl: false,
      zoomSnap: 0.5,
      attributionControl: false // STRIPS LEAFLET BRANDING & LINKS
    }).setView([22, 10], 2.5);

    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16
    }).addTo(map);

    const layers = {
      quakes: L.layerGroup().addTo(map),
      fires: L.layerGroup().addTo(map),
      iss: L.layerGroup().addTo(map),
      choke: L.layerGroup().addTo(map),
      draw: L.layerGroup().addTo(map),
      routes: L.layerGroup().addTo(map)
    };

    // ================= 3. KEYLESS LIVE DATA FEEDS =================
    fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson")
      .then(r => r.json()).then(data => {
        document.getElementById('cnt-quakes').innerText = data.features.length;
        data.features.forEach(f => {
          const coords = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
          const mag = f.properties.mag || 1;
          L.circleMarker(coords, {
            radius: Math.max(3, mag * 2), fillColor: "#e61c1c", color: "#ff4d4d", weight: 1, fillOpacity: 0.6
          }).bindPopup(`<b>USGS SEISMIC ALERT</b><br>${f.properties.title}`).addTo(layers.quakes);
        });
        pushTicker(`USGS: ${data.features[0]?.properties.title || "FAULT LINE RADAR SYNCHRONIZED"}`);
      }).catch(() => {});

    fetch("https://eonet.gsfc.nasa.gov/api/v3/events?category=wildfires&status=open")
      .then(r => r.json()).then(data => {
        document.getElementById('cnt-fires').innerText = data.events.length;
        data.events.forEach(ev => {
          if (ev.geometry && ev.geometry.length) {
            const pt = ev.geometry[ev.geometry.length - 1];
            L.circleMarker([pt.coordinates[1], pt.coordinates[0]], {
              radius: 4, fillColor: "#ff7700", color: "#ffa500", weight: 1, fillOpacity: 0.7
            }).bindPopup(`<b>NASA THERMAL HOTSPOT</b><br>${ev.title}`).addTo(layers.fires);
          }
        });
      }).catch(() => {});

    let issMarker = null;
    async function updateISS() {
      try {
        const r = await fetch("https://api.wheretheiss.at/v1/satellites/25544");
        const d = await r.json();
        const pos = [d.latitude, d.longitude];
        if (!issMarker) {
          issMarker = L.circleMarker(pos, {
            radius: 7, fillColor: "#fff", color: "#e61c1c", weight: 2, fillOpacity: 0.9
          }).bindPopup(`<b>ISS (ZARYA) NODE</b><br>Speed: ${Math.round(d.velocity)} km/h<br>Alt: ${Math.round(d.altitude)} km`).addTo(layers.iss);
        } else {
          issMarker.setLatLng(pos);
        }
      } catch(e) {}
    }
    updateISS(); setInterval(updateISS, 6000);

    const CHOKEPOINTS = [
      { name: "STRAIT OF HORMUZ", pos: [26.56, 56.25], note: "Primary Middle-East energy corridor." },
      { name: "BAB-EL-MANDEB", pos: [12.58, 43.33], note: "Red Sea bottleneck." },
      { name: "MALACCA STRAIT", pos: [1.43, 102.89], note: "Asia-Pacific conduit." },
      { name: "TAIWAN STRAIT", pos: [24.40, 119.80], note: "Cross-strait naval vector." },
      { name: "SUEZ CANAL", pos: [30.58, 32.57], note: "Mediterranean-Red Sea link." },
      { name: "BOSPHORUS STRAIT", pos: [41.11, 29.06], note: "Black Sea transit." }
    ];
    CHOKEPOINTS.forEach(ch => {
      L.circleMarker(ch.pos, {
        radius: 6, fillColor: "#ffd24a", color: "#fff", weight: 1.5, fillOpacity: 0.8
      }).bindPopup(`<b>MARITIME CHOKEPOINT</b><br><b>${ch.name}</b><br>${ch.note}`).addTo(layers.choke);
    });

    // ================= 4. GRAM TOKEN SPARKLINE (MATCHES COINMARKETCAP) =================
    async function loadGramToken() {
      try {
        const tickerRes = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=TONUSDT");
        if (!tickerRes.ok) throw new Error("Ticker error");
        const ticker = await tickerRes.json();

        const price = parseFloat(ticker.lastPrice);
        const chg = parseFloat(ticker.priceChangePercent);

        document.getElementById('gramPrice').innerText = `$${price.toFixed(2)}`;
        const chgEl = document.getElementById('gramChange');
        chgEl.innerText = `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%`;
        chgEl.className = chg >= 0 ? 'up' : 'down';

        const klineRes = await fetch("https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=1h&limit=24");
        if (klineRes.ok) {
          const klines = await klineRes.json();
          const closePrices = klines.map(c => parseFloat(c[4]));
          drawSparkline(closePrices, chg >= 0);
        }
        return;
      } catch (err) {
        try {
          const cgRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd&include_24hr_change=true");
          const cgData = await cgRes.json();
          const ton = cgData["the-open-network"];
          if (ton) {
            document.getElementById('gramPrice').innerText = `$${ton.usd.toFixed(2)}`;
            const chg = ton.usd_24h_change;
            const chgEl = document.getElementById('gramChange');
            chgEl.innerText = `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%`;
            chgEl.className = chg >= 0 ? 'up' : 'down';
            drawSparkline([ton.usd * 0.98, ton.usd * 0.99, ton.usd, ton.usd], chg >= 0);
          }
        } catch (e) {}
      }
    }

    function drawSparkline(pts, up) {
      const svg = document.getElementById('gramSpark');
      const w = 140, h = 32, n = pts.length;
      const min = Math.min(...pts), max = Math.max(...pts), rng = max - min || 1;
      const coords = pts.map((v, i) => `${((i/(n-1))*(w-2)+1).toFixed(1)},${(h-3-((v-min)/rng)*(h-6)).toFixed(1)}`);
      const col = up ? "#ffd24a" : "#e61c1c";
      svg.innerHTML = `<polyline points="${coords.join(' ')}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
    }
    loadGramToken(); setInterval(loadGramToken, 60000);

    // ================= 5. TOOL CONTROLLER & RESTORED SECTIONS =================
    let activeTool = "layers";
    let drawMode = "pin";
    let drawPts = [];
    let currentPolyline = null;
    const tools = {};

    // Persistent footer attached to every panel view: SENSORS + RECON
    function commonPanelFooter() {
      return `
        <div class="side-group">
          <div class="side-group-title">// SENSORS & CRT FX</div>
          <button class="side-item ${!document.getElementById('crt').classList.contains('crt-off')?'active':''}" id="opt-crt" onclick="toggleCRT(this)">[ ] CRT SCANLINES</button>
          <button class="side-item ${audioOn?'active':''}" id="opt-audio" onclick="toggleAudio(this)">${audioOn?'[x]':'[ ]'} SOLENOID CLICKS</button>
          <button class="side-item ${!document.getElementById('tactical-cross').classList.contains('grid-off')?'active':''}" id="opt-grid" onclick="toggleGrid(this)">[x] TACTICAL CROSS</button>
        </div>

        <div class="side-group">
          <div class="side-group-title">// RECON NODES</div>
          <button class="side-item" onclick="toggleDrawer('gram')">» TELEMETRY: GRAM/TON</button>
          <button class="side-item" onclick="toggleDrawer('mona')">» DOSSIER: MONA PWP</button>
        </div>
      `;
    }

    tools.layers = () => `
      <div class="toggle"><label>USGS SEISMIC GRID<em>Earthquakes 2.5+ M</em></label><span class="switch on" onclick="toggleSwitch(this, 'quakes')"></span></div>
      <div class="toggle"><label>NASA THERMAL HOTSPOTS<em>Global active fires</em></label><span class="switch on" onclick="toggleSwitch(this, 'fires')"></span></div>
      <div class="toggle"><label>ORBITAL / ISS TRACK<em>Live satellite path</em></label><span class="switch on" onclick="toggleSwitch(this, 'iss')"></span></div>
      <div class="toggle"><label>MARITIME CHOKEPOINTS<em>Naval transit corridors</em></label><span class="switch on" onclick="toggleSwitch(this, 'choke')"></span></div>
      ${commonPanelFooter()}
    `;

    tools.sectors = () => `
      <div style="display:flex; flex-direction:column; gap:4px;">
        <button class="hud-btn" onclick="map.flyTo([24.4, 119.8], 7)">» 01: TAIWAN STRAIT</button>
        <button class="hud-btn" onclick="map.flyTo([26.56, 56.25], 7)">» 02: STRAIT OF HORMUZ</button>
        <button class="hud-btn" onclick="map.flyTo([12.58, 43.33], 7)">» 03: BAB-EL-MANDEB</button>
        <button class="hud-btn" onclick="map.flyTo([43.5, 34.0], 6)">» 04: BLACK SEA / CRIMEA</button>
        <button class="hud-btn" onclick="map.flyTo([22.0, 10.0], 2.5)">» 00: GLOBAL OVERVIEW</button>
      </div>
      ${commonPanelFooter()}
    `;

    tools.space = () => `
      <div style="font-size:11px; line-height:1.7;">
        <b>NODE: ISS (ZARYA)</b><br>
        ALTITUDE: ~418 KM<br>
        STATUS: TRACKING NOMINAL<br>
        <button class="hud-btn" style="margin-top:8px;" onclick="if(issMarker) map.setView(issMarker.getLatLng(), 5)">FOCUS ISS TARGET</button>
      </div>
      ${commonPanelFooter()}
    `;

    tools.choke = () => `
      <div style="font-size:11px; display:flex; flex-direction:column; gap:6px;">
        ${CHOKEPOINTS.map(c => `<div><b>${c.name}</b><br><span style="color:var(--mut); font-size:10px;">${c.note}</span></div>`).join('')}
      </div>
      ${commonPanelFooter()}
    `;

    let routeNodes = [];
    tools.route = () => `
      <div style="font-size:11px;">
        <p style="color:var(--mut); margin-bottom:8px;">Click map to place Node A and Node B for driving routes.</p>
        <button class="hud-btn" onclick="layers.routes.clearLayers(); routeNodes=[];">CLEAR ROUTE</button>
      </div>
      ${commonPanelFooter()}
    `;

    // Overhauled DRAW Tool + 288x188 GRAYSCALE IFRAME BOX
    tools.draw = () => `
      <div style="font-size:11px; margin-bottom:8px; color:var(--mut);">
        Select a tool, then click directly on the map:
      </div>
      <div style="display:flex; flex-direction:column; gap:4px;">
        <button class="hud-btn ${drawMode==='pin'?'active':''}" id="dm-pin" onclick="setDrawMode('pin')">⊙ MARKER PIN (CLICK MAP)</button>
        <button class="hud-btn ${drawMode==='line'?'active':''}" id="dm-line" onclick="setDrawMode('line')">⇁ VECTOR LINE (CLICK POINTS)</button>
        <button class="hud-btn" onclick="finishLine()">✓ FINISH CURRENT LINE</button>
        <button class="hud-btn" style="border-color:#57161b;" onclick="clearDrawings()">✕ PURGE DRAWINGS</button>
      </div>

      <!-- RESIZED 288x188 GRAYSCALE IFRAME BOX -->
      <div style="margin-top: 12px; border-top: 1px solid var(--line2); padding-top: 8px;">
        <div style="font-size:9px; color:var(--mut); margin-bottom:4px; letter-spacing:1px;">// OPTICAL FEED / SURVEILLANCE</div>
        <div style="width: 288px; height: 188px; border: 1px solid var(--crimson); background: #000; overflow: hidden; position: relative;">
          <iframe 
            id="opticalFrame"
            src="about:blank" 
            style="width: 288px; height: 188px; border: 0; filter: grayscale(100%) contrast(125%) brightness(90%); background:#050304;"
            allowfullscreen>
          </iframe>
        </div>
        <input type="text" id="frameSrcInput" placeholder="ENTER FEED URL..." 
          style="width:288px; background:#070304; border:1px solid var(--line2); color:#ccc; font-size:10px; padding:3px 6px; margin-top:4px;"
          onchange="document.getElementById('opticalFrame').src = this.value;" />
      </div>

      ${commonPanelFooter()}
    `;

    function renderPanel(tool) {
      document.getElementById('spTitle').innerText = tool.toUpperCase();
      document.getElementById('spContent').innerHTML = tools[tool] ? tools[tool]() : '';

      const drawHud = document.getElementById('draw-hud');
      const mapContainer = document.getElementById('map');
      if (tool === 'draw') {
        mapContainer.classList.add('crosshair-cursor');
        drawHud.style.display = 'block';
        updateDrawHud();
      } else {
        mapContainer.classList.remove('crosshair-cursor');
        drawHud.style.display = 'none';
      }
    }

    function setDrawMode(mode) {
      drawMode = mode;
      finishLine();
      document.querySelectorAll('#spContent .hud-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`dm-${mode}`);
      if (activeBtn) activeBtn.classList.add('active');
      updateDrawHud();
    }

    function updateDrawHud() {
      const hud = document.getElementById('draw-hud');
      if (drawMode === 'pin') hud.innerHTML = `DRAW ACTIVE: <b>TACTICAL PIN</b> (CLICK MAP TO DROP)`;
      if (drawMode === 'line') hud.innerHTML = `DRAW ACTIVE: <b>VECTOR LINE</b> (CLICK POINTS, THEN 'FINISH')`;
    }

    function finishLine() { drawPts = []; currentPolyline = null; }
    function clearDrawings() { layers.draw.clearLayers(); finishLine(); }

    document.querySelectorAll('#toolbar button').forEach(b => {
      b.addEventListener('click', () => {
        const t = b.dataset.tool;
        if (activeTool === t && !document.getElementById('sidePanel').classList.contains('closed')) {
          document.getElementById('sidePanel').classList.add('closed');
          b.classList.remove('active');
          activeTool = null;
          document.getElementById('map').classList.remove('crosshair-cursor');
          document.getElementById('draw-hud').style.display = 'none';
          return;
        }
        document.querySelectorAll('#toolbar button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeTool = t;
        document.getElementById('sidePanel').classList.remove('closed');
        renderPanel(t);
      });
    });

    document.getElementById('spClose').addEventListener('click', () => {
      document.getElementById('sidePanel').classList.add('closed');
      document.querySelectorAll('#toolbar button').forEach(x => x.classList.remove('active'));
      document.getElementById('map').classList.remove('crosshair-cursor');
      document.getElementById('draw-hud').style.display = 'none';
      activeTool = null;
    });

    function toggleSwitch(sw, layer) {
      sw.classList.toggle('on');
      if (map.hasLayer(layers[layer])) map.removeLayer(layers[layer]);
      else map.addLayer(layers[layer]);
    }

    // Toggle Drawer Shortcuts (For RECON NODES)
    function toggleDrawer(name) {
      if (name === 'mona') {
        const npPanel = document.getElementById('notepadPanel');
        npPanel.classList.toggle('open');
        document.getElementById('notepadToggleBtn').classList.toggle('active', npPanel.classList.contains('open'));
        if (npPanel.classList.contains('open')) document.getElementById('notepad').focus();
      } else if (name === 'gram') {
        loadGramToken();
        alert(`GRAM (Layer-1 Native Asset)\nPrice: ${document.getElementById('gramPrice').innerText}\n24h Change: ${document.getElementById('gramChange').innerText}`);
      }
    }

    // Map Drawing Handler
    map.on('click', async (e) => {
      if (activeTool === 'draw') {
        playSolenoid(160, 0.02);
        if (drawMode === 'pin') {
          L.circleMarker(e.latlng, {
            radius: 6, fillColor: "#e61c1c", color: "#fff", weight: 2, fillOpacity: 0.9
          }).bindPopup(`<b style="color:#e61c1c;">TACTICAL WAYPOINT</b><br>${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`).addTo(layers.draw);
        } else if (drawMode === 'line') {
          drawPts.push(e.latlng);
          if (drawPts.length === 1) {
            L.circleMarker(e.latlng, { radius: 3, color: '#e61c1c' }).addTo(layers.draw);
          } else {
            if (!currentPolyline) {
              currentPolyline = L.polyline(drawPts, { color: '#e61c1c', weight: 2.5, dashArray: '4 4' }).addTo(layers.draw);
            } else {
              currentPolyline.setLatLngs(drawPts);
            }
          }
        }
      } else if (activeTool === 'route') {
        routeNodes.push(e.latlng);
        L.circleMarker(e.latlng, { radius: 5, color: '#ffd24a' }).addTo(layers.routes);
        if (routeNodes.length === 2) {
          const [a, b] = routeNodes;
          try {
            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
            const dat = await res.json();
            if (dat.routes && dat.routes.length) {
              const coords = dat.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
              L.polyline(coords, { color: '#ffd24a', weight: 3 }).addTo(layers.routes);
              pushTicker(`ROUTE PLOTTED: ${(dat.routes[0].distance/1000).toFixed(1)} KM`);
            }
          } catch(err) {}
          routeNodes = [];
        }
      }
    });

    renderPanel('layers');

    // ================= 6. MONA PWP EDITOR & SPEECH-TO-TEXT ENGINE =================
    const npBtn = document.getElementById('notepadToggleBtn');
    const npPanel = document.getElementById('notepadPanel');
    const np = document.getElementById('notepad');
    const npMeta = document.getElementById('npMeta');
    const fileInput = document.getElementById('monaFileInput');

    np.value = localStorage.getItem('ISIS_MONA_BUFFER') || '';
    updateMonaMeta();

    npBtn.addEventListener('click', () => {
      npPanel.classList.toggle('open');
      npBtn.classList.toggle('active', npPanel.classList.contains('open'));
      if (npPanel.classList.contains('open')) np.focus();
    });

    np.addEventListener('keydown', () => playSolenoid(130, 0.02));
    np.addEventListener('input', () => {
      localStorage.setItem('ISIS_MONA_BUFFER', np.value);
      document.getElementById('npSaveStatus').innerText = "SAVED";
      updateMonaMeta();
    });

    function updateMonaMeta() {
      const v = np.value;
      const lines = v.substr(0, np.selectionStart).split("\n").length;
      const words = v.trim() ? v.trim().split(/\s+/).length : 0;
      npMeta.innerText = `LN ${lines} | ${words} WORDS | ${v.length} CHARS`;
    }
    np.addEventListener('keyup', updateMonaMeta);

    // Mona File Import Action
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        np.value = evt.target.result;
        localStorage.setItem('ISIS_MONA_BUFFER', np.value);
        updateMonaMeta();
        document.getElementById('npSaveStatus').innerText = "IMPORTED";
      };
      reader.readAsText(file);
    });

    // Multi-format Export Actions
    function exportMona(ext) {
      playSolenoid(220, 0.04);
      const blob = new Blob([np.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ISIS_DOSSIER_${Date.now()}.${ext}`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function copyMona() {
      navigator.clipboard.writeText(np.value).then(() => {
        document.getElementById('npSaveStatus').innerText = "COPIED";
        setTimeout(() => document.getElementById('npSaveStatus').innerText = "SYNCED", 1500);
      });
    }

    function clearMona() {
      if (confirm("PURGE DOSSIER BUFFER?")) {
        np.value = '';
        localStorage.removeItem('ISIS_MONA_BUFFER');
        updateMonaMeta();
        document.getElementById('npSaveStatus').innerText = "PURGED";
      }
    }

    // Voice Input SpeechRecognition Engine (from inkrealm.info/trix)
    let recognition = null;
    let isListening = false;

    function setupSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        recognition = new SpeechRec();
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = function(event) {
          const result = event.results[event.results.length - 1];
          const transcript = result[0].transcript;
          if (result.isFinal) {
            insertTextAtCursor(transcript.trim() + ' ');
          }
        };

        recognition.onerror = function(event) {
          console.error('Speech recognition error:', event.error);
          stopVoiceInput();
        };

        recognition.onend = function() {
          if (isListening) stopVoiceInput();
        };
      } else {
        alert("Web Speech API not supported in this browser.");
      }
    }

    function toggleVoiceInput() {
      playSolenoid(170, 0.03);
      if (!recognition) setupSpeechRecognition();
      if (!recognition) return;

      if (isListening) {
        stopVoiceInput();
      } else {
        try {
          recognition.start();
          isListening = true;
          const btn = document.getElementById('voiceButton');
          btn.textContent = '[MIC: REC]';
          btn.classList.add('recording');
          document.getElementById('npSaveStatus').innerText = "LISTENING...";
        } catch(e) {
          console.error(e);
        }
      }
    }

    function stopVoiceInput() {
      if (recognition) recognition.stop();
      isListening = false;
      const btn = document.getElementById('voiceButton');
      btn.textContent = '[MIC: OFF]';
      btn.classList.remove('recording');
      document.getElementById('npSaveStatus').innerText = "SYNCED";
    }

    function insertTextAtCursor(text) {
      playSolenoid(140, 0.02);
      const editor = document.getElementById('notepad');
      const cursorPos = editor.selectionStart || editor.value.length;
      const textBefore = editor.value.substring(0, cursorPos);
      const textAfter = editor.value.substring(cursorPos);
      
      editor.value = textBefore + text + textAfter;
      editor.selectionStart = editor.selectionEnd = cursorPos + text.length;
      
      localStorage.setItem('ISIS_MONA_BUFFER', editor.value);
      updateMonaMeta();
      document.getElementById('npSaveStatus').innerText = "VOICE INPUT";
    }

    // ================= 7. NEWS WIRE TICKER =================
    const alerts = [
      "GRAM / TON NETWORK: SPOT TELEMETRY STREAMING VIA BINANCE/COINGECKO",
      "MARITIME ADVISORY: STRAIT OF HORMUZ & BAB-EL-MANDEB ACTIVE",
      "ORBITAL: ISS NODE COMPLETING REVOLUTION AT 27,600 KM/H"
    ];
    function pushTicker(msg) {
      alerts.unshift(msg);
      if (alerts.length > 20) alerts.pop();
    }
    let tickerIdx = 0;
    setInterval(() => {
      document.getElementById('ticker-marquee').innerHTML = `FEED: <b>${alerts[tickerIdx]}</b>`;
      tickerIdx = (tickerIdx + 1) % alerts.length;
    }, 5000);
  </script>
</body>
</html>
