<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NOVA_2741</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nova+Mono&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root { --red: #ff3333; --black: #050505; --dark-grey: #121212; --white: #e0e0e0; }
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { overflow-x: hidden; width: 100%; max-width: 100vw; margin: 0; height: 100%; }
body { 
  background: var(--black); color: var(--white); font-family: 'Nova Mono', monospace; 
  overflow: hidden; height: 100vh; width: 100vw;
}
body::after {
  content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.18) 50%);
  z-index: 999; background-size: 100% 3px; pointer-events: none; opacity: 0.35;
}
.app-grid { 
  display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 48px 1fr 280px 28px; 
  height: 100vh; width: 100%; max-width: 100vw;
}
header { grid-column: span 2; border-bottom: 1px solid var(--red); background: #000; z-index: 50; }
.sidebar { background: #080808; border-right: 1px solid #222; overflow-y: auto; padding: 16px; }
#viewport { background: #000; position: relative; border-bottom: 1px solid var(--red); overflow: hidden; }
.bottom-shelf { 
  grid-row: 3; grid-column: span 2; 
  display: grid; grid-template-columns: 1fr 320px; 
  height: 280px; overflow: hidden;
}
.editor-section { background: var(--dark-grey); display: flex; flex-direction: column; overflow: hidden; border-top: 1px solid var(--red); }
#editor { 
  flex-grow: 1; padding: 16px; font-family: 'Special Elite', serif; font-size: 1.05rem; 
  line-height: 1.55; outline: none; overflow-y: auto; color: var(--white); 
  caret-color: var(--red); background: var(--dark-grey); white-space: pre-wrap; word-wrap: break-word;
}
.comms-console { background: #000; border-left: 1px solid var(--red); display: flex; flex-direction: column; overflow: hidden; }
#chat-container { flex-grow: 1; overflow-y: auto; padding: 8px; font-size: 11px; }
.chat-bubble { margin-bottom: 8px; padding: 7px; border: 1px solid #222; line-height: 1.35; cursor: pointer; }
.user-message { border-left: 3px solid #555; color: #888; cursor: default; }
.bot-message { border-left: 3px solid var(--red); color: var(--white); background: #0a0000; }
.bot-message:hover { background: #1a0505; border-color: var(--red); }
.chat-input-area { display: flex; border-top: 1px solid #222; padding: 4px; background: #080808; }
#chat-input { background: #000; color: var(--red); border: 1px solid #333; flex-grow: 1; padding: 6px; font-size: 11px; outline: none; }
footer { grid-column: span 2; background: #000; border-top: 1px solid #222; font-size: 9px; color: #444; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
.node-center { fill: var(--red); filter: drop-shadow(0 0 4px var(--red)); }
.node-orbit { fill: #000; stroke: var(--red); stroke-width: 1.2px; }
.node-dict { stroke: #ff6666; }
.node-ai { stroke: #ffaa00; }
.node-manual { stroke: #66ff66; }
.label { fill: #fff; font-size: 10px; text-transform: uppercase; pointer-events: none; opacity: 0.75; }
::selection { background: var(--red); color: var(--black); }
@media (max-width: 768px) {
  .app-grid { grid-template-columns: 1fr; grid-template-rows: 46px auto 280px 240px 180px 32px; height: auto; min-height: 100vh; overflow-y: auto; }
  header { position: sticky; top: 0; }
  .sidebar { max-height: 140px; }
  #viewport { height: 280px; }
  .bottom-shelf { grid-template-columns: 1fr; grid-template-rows: 240px 180px; height: auto; }
  .comms-console { border-left: none; border-top: 1px solid var(--red); }
  #editor { font-size: 1rem; padding: 12px; }
}
.cutup-bar { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 8px; background: #0a0a0a; border-bottom: 1px solid #333; font-size: 9px; }
.cutup-bar button { background: #111; border: 1px solid #333; color: #aaa; padding: 3px 6px; cursor: pointer; }
.cutup-bar button:hover { border-color: var(--red); color: var(--red); }
#splash { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.6s; }
</style>
</head>
<body>
<div id="splash">
  <h1 class="text-red-600 font-bold text-3xl tracking-tighter">NOVA_2741</h1>
  <p class="text-zinc-500 text-xs tracking-widest mt-2">MOUNTING ARCHIVES...</p>
</div>

<div class="app-grid" style="display:none">
  <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 flex items-center justify-between px-3 py-1.5">
    <div class="flex items-center gap-2">
      <div id="power-light" class="w-2 h-2 bg-zinc-800 rounded-full"></div>
      <h1 class="text-white font-bold tracking-tighter text-xs uppercase">SELECTRIC_2741</h1>
      <button id="power-toggle" class="text-[9px] border border-zinc-800 px-2 py-1 text-zinc-500 hover:bg-zinc-900 font-bold">ENABLE LINK</button>
      <button id="cancel-llm" class="text-[9px] border border-zinc-800 px-2 py-1 text-zinc-600 hidden">CANCEL</button>
      <div id="llm-progress-container" class="hidden ml-2 flex-grow max-w-[140px] bg-zinc-900 h-2 border border-zinc-700 relative">
        <div id="llm-progress" class="h-full bg-red-600 transition-all" style="width:0%"></div>
        <div id="llm-label" class="absolute -top-3.5 left-0 text-[8px] text-red-600 whitespace-nowrap">...</div>
      </div>
    </div>
    <div class="flex gap-1">
      <button onclick="window.clearChat()" class="text-[9px] border border-zinc-800 px-2 py-1">CLR</button>
      <button onclick="window.exportDraft()" class="text-[9px] border border-zinc-800 px-2 py-1 text-red-600 font-bold">EXTRACT</button>
      <button onclick="window.toggleSettings()" class="text-[9px] border border-zinc-800 px-2 py-1">SET</button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="text-[10px] text-zinc-600 mb-1 uppercase tracking-widest">Path</div>
    <div id="path-log" class="mb-6 text-[11px]"></div>
    <div class="text-[10px] text-red-900 mb-1 uppercase font-bold tracking-widest">Nodes</div>
    <div id="word-menu" class="text-[11px]"></div>
    <div class="mt-4">
      <button onclick="window.pushSelectionToGraph()" class="text-[9px] border border-red-900 text-red-500 px-2 py-1 w-full">PUSH SELECTION → GRAPH</button>
    </div>
  </aside>

  <main id="viewport">
    <svg id="canvas" class="w-full h-full"></svg>
  </main>

  <div class="bottom-shelf">
    <section class="editor-section">
      <div class="cutup-bar">
        <button onclick="window.cutup('shuffle')">SHUFFLE</button>
        <button onclick="window.cutup('reverse')">REVERSE</button>
        <button onclick="window.cutup('fold')">FOLD-IN</button>
        <button onclick="window.cutup('nova')">NOVA SHIFT</button>
        <button onclick="window.undoEditor()">UNDO</button>
        <span id="word-count" class="ml-auto text-zinc-600">0W</span>
      </div>
      <div class="bg-red-600 text-white px-3 py-0.5 flex justify-between font-serif text-[10px]">
        <div class="teletype-text" id="teletype">>> AWAITING...</div>
        <div id="ai-temp" class="text-[9px]">TEMP 0.8</div>
      </div>
      <div id="editor" contenteditable="true" spellcheck="false"></div>
    </section>

    <aside class="comms-console">
      <div class="bg-zinc-900 text-[9px] p-1.5 text-zinc-500 uppercase flex justify-between border-b border-red-900">
        <span>Terminal</span>
        <span id="ai-status" class="text-zinc-600 font-bold">ARCHIVE</span>
      </div>
      <div id="chat-container">
        <div class="chat-bubble bot-message">Archives mounting. Neural net standby.</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Query archive..." >
        <button id="send-btn" class="bg-zinc-800 text-zinc-500 px-2 text-[9px] ml-1">QUERY</button>
      </div>
    </aside>
  </div>

  <footer>
    <div id="dict-status">LOADING...</div>
    <div class="flex gap-3 uppercase"><span>Nova Construct</span><span id="footer-status">STABLE</span></div>
  </footer>
</div>

<div id="settings-panel" class="hidden fixed inset-0 bg-black/80 z-100 flex items-center justify-center p-4">
  <div class="bg-zinc-950 border border-red-900 p-4 max-w-sm w-full text-xs">
    <div class="text-red-600 font-bold mb-3">SETTINGS</div>
    <label class="block mb-2">Temperature <input type="range" id="temp-slider" min="0.2" max="1.4" step="0.1" value="0.8" class="w-full"></label>
    <div id="temp-val" class="text-zinc-500 mb-3">0.8</div>
    <label class="block mb-2">System style
      <select id="persona-select" class="w-full bg-black border border-zinc-800 mt-1 p-1">
        <option value="nova">Nova / Paranoid cut-up</option>
        <option value="neutral">Neutral generative</option>
        <option value="dict">Dictionary expander</option>
      </select>
    </label>
    <button onclick="window.toggleSettings()" class="mt-4 border border-red-600 text-red-500 px-3 py-1">CLOSE</button>
  </div>
</div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";
const SELECTED_MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
let engine, isAiLoading = false, isAiReady = false, abortController = null;

window.engageAI = async function() {
  if (isAiReady || isAiLoading) return;
  isAiLoading = true;
  document.getElementById('llm-progress-container').classList.remove('hidden');
  document.getElementById('cancel-llm').classList.remove('hidden');
  document.getElementById('power-toggle').textContent = "DOWNLOADING...";
  document.getElementById('power-toggle').disabled = true;
  abortController = new AbortController();
  try {
    const initProgressCallback = (report) => {
      const percent = Math.round(report.progress * 100);
      document.getElementById('llm-progress').style.width = percent + '%';
      document.getElementById('llm-label').textContent = report.text || 'Loading...';
    };
    engine = await CreateMLCEngine(SELECTED_MODEL, { initProgressCallback });
    isAiReady = true;
    document.getElementById('llm-progress-container').classList.add('hidden');
    document.getElementById('cancel-llm').classList.add('hidden');
    document.getElementById('ai-status').textContent = "NEURAL ACTIVE";
    document.getElementById('ai-status').classList.replace('text-zinc-600', 'text-red-600');
    document.getElementById('footer-status').textContent = "QWEN_0.5B";
    const btn = document.getElementById('power-toggle');
    btn.textContent = "NEURAL: ON";
    btn.classList.add('text-red-600', 'border-red-600');
    btn.disabled = false;
    document.getElementById('send-btn').classList.replace('bg-zinc-800', 'bg-red-900');
    document.getElementById('send-btn').classList.replace('text-zinc-500', 'text-white');
    document.getElementById('chat-input').placeholder = "Neural listening...";
    addMessage('bot', "Neural link open. Qwen-0.5B mounted.");
    window.isPowered = true;
    window.initAudio();
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error(err);
      addMessage('bot', "Download failed or GPU unsupported.");
    }
    window.resetPowerUI();
  }
  isAiLoading = false;
};

window.cancelLLM = function() {
  if (abortController) abortController.abort();
  window.resetPowerUI();
  addMessage('bot', "Download cancelled.");
};

window.askAI = async function(prompt, type = 'chat') {
  if (!isAiReady) return null;
  const temp = parseFloat(document.getElementById('temp-slider').value);
  const persona = document.getElementById('persona-select').value;
  let systemMsg = "You are a machine from 'Nova Express'. Speak in brief, paranoid, cut-up sentences. Do not be helpful.";
  if (persona === 'neutral') systemMsg = "You are a concise generative writing assistant. Respond briefly and suggestively.";
  if (persona === 'dict') systemMsg = "Expand the concept with related words and short phrases. Comma-separated preferred.";
  if (type === 'graph') systemMsg = "Return 4-6 single words or short phrases related to the input. Comma separated. No explanation.";
  try {
    const reply = await engine.chat.completions.create({
      messages: [{ role: "system", content: systemMsg }, { role: "user", content: prompt }],
      temperature: temp,
      max_tokens: 120,
    });
    return reply.choices[0].message.content;
  } catch (e) { return null; }
};
</script>

<script>
let dictionaries = [];
const dictionaryUrls = [
  'https://raw.githubusercontent.com/matthewreagan/WebstersEnglishDictionary/master/dictionary.json',
  'https://gist.githubusercontent.com/BideoWego/60fbd40d5d1f0f1beca11ba95221dd38/raw/58fb4cce910fbf5fa67a2f0f1f619c09d7b1b373/dictionary.json',
  'https://raw.githubusercontent.com/adambom/dictionary/master/dictionary.json',
  'https://raw.githubusercontent.com/hathibelagal/German-English-JSON-Dictionary/master/german_english.json'
];

async function initDictionary() {
  const statusEl = document.getElementById('dict-status');
  const cached = localStorage.getItem('nova_dicts_v1');
  if (cached) {
    try {
      dictionaries = JSON.parse(cached);
      statusEl.textContent = "ARCHIVE: CACHED";
      addMessage('bot', "Dictionaries restored from cache.");
      return;
    } catch(e) {}
  }
  statusEl.textContent = "FETCHING SOURCES...";
  try {
    const responses = await Promise.all(dictionaryUrls.map(url => fetch(url)));
    for (let r of responses) if (!r.ok) throw new Error("Source failed");
    dictionaries = await Promise.all(responses.map(r => r.json()));
    try { localStorage.setItem('nova_dicts_v1', JSON.stringify(dictionaries)); } catch(e) {}
    statusEl.textContent = "ARCHIVE: ACTIVE";
    addMessage('bot', "Webster, AdamBom & polyglot archives mounted.");
  } catch (e) {
    console.error(e);
    statusEl.textContent = "ARCHIVE: PARTIAL";
    statusEl.style.color = "#ff3333";
    addMessage('bot', "Dictionary fetch incomplete. Graph will be limited.");
  }
}

function searchArchives(rawWord) {
  if (!dictionaries.length) return { def: null, type: null };
  const wLower = rawWord.toLowerCase();
  const wUpper = rawWord.toUpperCase();
  for (let i = 0; i < 3; i++) {
    const dict = dictionaries[i];
    if (dict[wLower]) return { def: dict[wLower], type: 'EN' };
    if (dict[wUpper]) return { def: dict[wUpper], type: 'EN' };
  }
  const gerDict = dictionaries[3];
  if (gerDict && (gerDict[wLower] || gerDict[wUpper])) return { def: gerDict[wLower] || gerDict[wUpper], type: 'DE->EN' };
  if (gerDict) {
    const entry = Object.entries(gerDict).find(([ger, eng]) => String(eng).toLowerCase().includes(wLower));
    if (entry) return { def: entry[0], type: 'EN->DE' };
  }
  return { def: null, type: null };
}

function addMessage(role, text) {
  const c = document.getElementById('chat-container');
  const div = document.createElement('div');
  div.className = `chat-bubble ${role === 'user' ? 'user-message' : 'bot-message'}`;
  div.innerHTML = text;
  if (role !== 'user') {
    div.title = "Click to inject into editor";
    div.onclick = function() {
      this.style.backgroundColor = "var(--red)";
      this.style.color = "black";
      setTimeout(() => { this.style.backgroundColor = ""; this.style.color = ""; }, 140);
      let clean = text.replace(/^(ARCHIVE|POLYGLOT|DATA|GERMAN.*):/i, "").trim();
      const editor = document.getElementById('editor');
      editor.innerHTML += ` <span style="color:#555">[REC]</span> ${clean} `;
      saveAll();
      pushUndo();
    };
  }
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}

window.resetPowerUI = function() {
  const btn = document.getElementById('power-toggle');
  btn.textContent = "ENABLE LINK";
  btn.classList.remove("text-red-600", "border-red-600");
  btn.disabled = false;
  document.getElementById('cancel-llm').classList.add('hidden');
  document.getElementById('llm-progress-container').classList.add('hidden');
  window.isPowered = false;
  document.getElementById('ai-status').textContent = "ARCHIVE";
  document.getElementById('ai-status').classList.replace("text-red-600", "text-zinc-600");
};

window.sendChat = async function() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  addMessage('user', ">> " + msg);
  input.value = '';
  const archiveResult = searchArchives(msg);
  let found = false;
  if (archiveResult.def) {
    found = true;
    const prefix = archiveResult.type === 'EN' ? "ARCHIVE" : (archiveResult.type.includes('DE') ? "POLYGLOT" : "DATA");
    setTimeout(() => addMessage('bot', `${prefix}: ${archiveResult.def}`), 180);
  }
  if (document.getElementById('ai-status').textContent.includes('ACTIVE')) {
    const typing = document.createElement('div');
    typing.className = 'chat-bubble bot-message';
    typing.textContent = '...';
    document.getElementById('chat-container').appendChild(typing);
    const response = await window.askAI(msg, 'chat');
    typing.remove();
    addMessage('bot', response || "Signal lost.");
  } else if (!found) {
    addMessage('bot', "Not in archives. Enable neural link for generative response.");
  }
};

document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') window.sendChat(); });
document.getElementById('send-btn').onclick = window.sendChat;
document.getElementById('power-toggle').onclick = window.togglePower;
document.getElementById('cancel-llm').onclick = window.cancelLLM;

window.isPowered = false;
let audioCtx, humOsc, gainNode;
window.togglePower = function() {
  if (window.isPowered) {
    window.isPowered = false;
    window.resetPowerUI();
    if (gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
    addMessage('bot', "Neural link severed.");
  } else {
    if (window.engageAI) window.engageAI();
  }
};
window.initAudio = function() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    humOsc = audioCtx.createOscillator(); gainNode = audioCtx.createGain();
    humOsc.type = 'sawtooth'; humOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.setValueAtTime(110, audioCtx.currentTime);
    humOsc.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination); humOsc.start();
  }
  gainNode.gain.setTargetAtTime(0.035, audioCtx.currentTime, 0.4);
};

const lexicon = { name: "Silence", children: [], origin: "root" };
let currentNode = lexicon, history = [];
const svg = d3.select("#canvas");
let width = 0, height = 0;
function resizeGraph() {
  const vp = document.getElementById('viewport');
  width = vp.clientWidth;
  height = vp.clientHeight;
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  simulation.force("center", d3.forceCenter(width / 2, height / 2));
  simulation.alpha(0.3).restart();
}
const simulation = d3.forceSimulation()
  .force("link", d3.forceLink().id(d => d.name).distance(90))
  .force("charge", d3.forceManyBody().strength(-450))
  .force("center", d3.forceCenter(300, 200))
  .force("collision", d3.forceCollide().radius(28));

const zoom = d3.zoom().scaleExtent([0.4, 3]).on("zoom", (e) => {
  svg.selectAll("g").attr("transform", e.transform);
});
svg.call(zoom);

window.update = function() {
  const nodes = currentNode.children || [];
  if (nodes.length === 0 && currentNode.name === "Silence") {
    ["Virus", "Control", "Nova", "Machine"].forEach(w => nodes.push({name: w, origin: "seed"}));
    currentNode.children = nodes;
  }
  const links = nodes.map(d => ({ source: currentNode.name, target: d.name }));
  const displayNodes = [{ name: currentNode.name, isParent: true, origin: currentNode.origin || "root" }, ...nodes];
  document.getElementById('path-log').innerHTML = history.map((h, i) => 
    `<div onclick="jumpTo(${i})" style="cursor:pointer;opacity:0.7">>> ${h.name}</div>`).join('');
  document.getElementById('word-menu').innerHTML = nodes.map(n => 
    `<div onclick="handleNodeClick('${n.name.replace(/'/g,"\\'")}')" style="cursor:pointer;color:#aaa;margin-bottom:3px">${n.name}</div>`).join('');

  const link = svg.selectAll(".link").data(links, d => d.target).join("line")
    .attr("stroke", "#333").attr("class", "link");
  const node = svg.selectAll(".node-group").data(displayNodes, d => d.name).join("g")
    .attr("class", "node-group")
    .on("click", (e, d) => handleNodeClick(d.name))
    .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended));
  node.selectAll("circle").data(d => [d]).join("circle")
    .attr("r", d => d.isParent ? 11 : 5.5)
    .attr("class", d => {
      let cls = d.isParent ? "node-center" : "node-orbit";
      if (d.origin === "dict") cls += " node-dict";
      else if (d.origin === "ai") cls += " node-ai";
      else if (d.origin === "manual") cls += " node-manual";
      return cls;
    });
  node.selectAll("text").data(d => [d]).join("text")
    .attr("class", "label").attr("dy", 18).attr("text-anchor", "middle").text(d => d.name);

  simulation.nodes(displayNodes);
  simulation.force("link").links(links);
  simulation.alpha(0.8).restart();
  simulation.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => {
      const x = Math.max(20, Math.min(width - 20, d.x));
      const y = Math.max(20, Math.min(height - 20, d.y));
      return `translate(${x},${y})`;
    });
  });
};

window.handleNodeClick = async function(name) {
  if (name === currentNode.name) return;
  const target = currentNode.children?.find(c => c.name === name);
  if (target && target.children) {
    history.push(currentNode);
    currentNode = target;
    window.update();
    return;
  }
  insertText(name);
  let newWords = [];
  const result = searchArchives(name);
  if (result.def) {
    const stop = new Set(["the","and","that","with","from","have","this","which","being","used","noun","verb","for","are","was"]);
    const clean = String(result.def);
    const candidates = clean.split(/[\s,.;()]+/)
      .map(w => w.replace(/[^a-zA-Z]/g, '').toUpperCase())
      .filter(w => w.length > 4 && !stop.has(w.toLowerCase()));
    const shuffled = [...new Set(candidates)].sort(() => 0.5 - Math.random()).slice(0, 4);
    newWords = shuffled.map(w => ({name: w, origin: "dict"}));
    if (result.type === 'EN->DE') newWords.push({name: String(result.def).toUpperCase(), origin: "dict"});
  }
  if (document.getElementById('ai-status').textContent.includes('ACTIVE')) {
    const aiRaw = await window.askAI(name, 'graph');
    if (aiRaw) {
      const aiSplit = aiRaw.split(',').map(w => ({
        name: w.trim().replace(/[."']/g, '').toUpperCase(),
        origin: "ai"
      })).filter(w => w.name.length > 2);
      newWords = [...newWords, ...aiSplit].slice(0, 7);
    }
  }
  if (newWords.length > 0) {
    let newNode = currentNode.children.find(n => n.name === name);
    if (!newNode) newNode = { name: name, origin: "manual" };
    newNode.children = newWords;
    history.push(currentNode);
    currentNode = newNode;
    window.update();
  } else {
    addMessage('bot', `[${name}] not found. Enable neural link or push selection.`);
  }
};

function insertText(w) {
  document.getElementById('editor').innerHTML += ` <span style="color:red">${w}</span> `;
  saveAll();
  pushUndo();
}

window.jumpTo = function(index) {
  currentNode = history[index];
  history = history.slice(0, index);
  window.update();
};

function dragstarted(e, d) { if (!e.active) simulation.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragended(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

let undoStack = [];
function pushUndo() {
  const html = document.getElementById('editor').innerHTML;
  if (undoStack[undoStack.length-1] !== html) undoStack.push(html);
  if (undoStack.length > 40) undoStack.shift();
}
window.undoEditor = function() {
  if (undoStack.length > 1) {
    undoStack.pop();
    document.getElementById('editor').innerHTML = undoStack[undoStack.length-1] || "";
    saveAll();
  }
};

window.cutup = function(mode) {
  const editor = document.getElementById('editor');
  const sel = window.getSelection();
  let text = "";
  if (sel.rangeCount && !sel.isCollapsed) {
    text = sel.toString();
  } else {
    text = editor.innerText;
  }
  if (!text.trim()) return;
  let words = text.split(/\s+/).filter(Boolean);
  let result = "";
  if (mode === 'shuffle') {
    for (let i = words.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [words[i], words[j]] = [words[j], words[i]];
    }
    result = words.join(' ');
  } else if (mode === 'reverse') {
    result = words.reverse().join(' ');
  } else if (mode === 'fold') {
    const mid = Math.floor(words.length / 2);
    const a = words.slice(0, mid), b = words.slice(mid);
    const out = [];
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      if (a[i]) out.push(a[i]);
      if (b[i]) out.push(b[i]);
    }
    result = out.join(' ');
  } else if (mode === 'nova') {
    result = words.filter((_, i) => i % 3 !== 1).join(' ');
  }
  if (sel.rangeCount && !sel.isCollapsed) {
    document.execCommand('insertText', false, result);
  } else {
    editor.innerHTML = result;
  }
  saveAll();
  pushUndo();
};

window.pushSelectionToGraph = function() {
  const sel = window.getSelection().toString().trim();
  if (!sel) { addMessage('bot', "Select text first."); return; }
  const words = [...new Set(sel.toUpperCase().split(/\s+/).filter(w => w.length > 3))].slice(0, 8);
  if (!words.length) return;
  const newChildren = words.map(w => ({name: w, origin: "manual"}));
  if (!currentNode.children) currentNode.children = [];
  currentNode.children.push(...newChildren);
  window.update();
  addMessage('bot', `Pushed ${words.length} nodes from selection.`);
};

function saveAll() {
  localStorage.setItem('nova_editor', document.getElementById('editor').innerHTML);
  const txt = document.getElementById('editor').innerText.trim();
  document.getElementById('word-count').textContent = (txt.length ? txt.split(/\s+/).length : 0) + "W";
}

function loadAll() {
  const saved = localStorage.getItem('nova_editor');
  const editor = document.getElementById('editor');
  if (saved && saved.trim().length > 40) {
    editor.innerHTML = saved;
  } else {
    editor.innerHTML = 
      "<span style='color:var(--red)'>MINRAUD_ARCHIVE_SEQ_001:</span><br><br>" +
      "Metal cities controlled by The Elders who are heads in bottles — Fastest brains preserved forever — Only form of immortality open to the Insect People of Minraud.<br><br>" +
      "An intricate bureaucracy wired to the control brains directs all movement. Even so there is a devious underground operating through telepathic misdirection and camouflage.<br><br>" +
      "The partisans make <span style='color:var(--red)'>recordings ahead in time</span> and leave the recordings to be picked up by control stations while they are free for a few seconds to organize underground activities...<br><br>" +
      "------------------------------------------<br>" +
      "// INITIATE CUT-UP PROTOCOL VIA GRAPH NODES<br>" +
      "// CLICK TO DISSOCIATE CONTROL LINES<br><br>" +
      "Initiate Inquiry. The future is built on forgotten data...";
  }
  saveAll();
  pushUndo();
}

window.exportDraft = function() {
  const blob = new Blob([document.getElementById('editor').innerText], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nova-log.txt';
  a.click();
};

window.clearChat = function() {
  document.getElementById('chat-container').innerHTML = `<div class="chat-bubble bot-message">Log wiped.</div>`;
};

window.toggleSettings = function() {
  document.getElementById('settings-panel').classList.toggle('hidden');
};

document.getElementById('temp-slider').oninput = function() {
  document.getElementById('temp-val').textContent = this.value;
  document.getElementById('ai-temp').textContent = "TEMP " + this.value;
};

window.addEventListener('resize', resizeGraph);
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); window.undoEditor(); }
});

window.onload = () => {
  loadAll();
  initDictionary();
  setTimeout(() => {
    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
      document.querySelector('.app-grid').style.display = 'grid';
      resizeGraph();
      window.update();
    }, 500);
  }, 900);

  const target = document.getElementById('teletype');
  const txt = ">> REALITY_STUDIO_ACTIVE";
  let i = 0;
  setInterval(() => {
    target.textContent = txt.substring(0, i+1) + (i % 2 ? "|" : "");
    if (i < txt.length) i++;
  }, 80);
};
</script>
