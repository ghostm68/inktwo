<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inkrealm // Nexus TTS</title>
    <script type="module">
        // Using Transformers.js v2 for stability with SpeechT5
        import { pipeline, env, Tensor } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        window.transformers = { pipeline, env, Tensor };
        // Disable local models to ensure it pulls from the hub
        env.allowLocalModels = false;
    </script>

    <style>
        :root { --red: #ff0000; --white: #ffffff; --black: #000000; --dark: #070707; --gray: #333; }
        body { background: var(--black); color: var(--white); font-family: "Georgia", serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        #nexus-module { width: 100%; max-width: 500px; padding: 40px; border: 1px solid #111; background: var(--dark); position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        h1 { color: var(--red); font-size: 0.9rem; letter-spacing: 0.5rem; text-transform: uppercase; border-bottom: 1px dashed var(--red); padding-bottom: 15px; margin: 0 0 30px 0; font-weight: normal; }
        .label-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15rem; color: #666; }
        textarea { width: 100%; height: 100px; background: transparent; border: 1px solid #222; color: var(--white); font-family: "Georgia", serif; padding: 15px; box-sizing: border-box; outline: none; margin-bottom: 20px; resize: none; transition: 0.3s; }
        textarea:focus { border-color: var(--red); }
        #progress-container { margin-bottom: 25px; display: none; }
        #progress-bar { width: 100%; height: 2px; background: #111; }
        #progress-fill { height: 100%; background: var(--red); width: 0%; transition: width 0.2s; }
        #status-text { font-size: 0.6rem; color: var(--red); text-transform: uppercase; margin-top: 8px; display: block; letter-spacing: 1px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .ui-element { background: transparent; border: 1px solid #222; color: #888; padding: 12px; font-family: "Georgia"; font-size: 0.75rem; cursor: pointer; transition: 0.3s; outline: none; }
        .ui-element:hover { border-color: var(--red); color: var(--red); }
        button#execute { width: 100%; padding: 18px; background: transparent; border: 1px solid var(--white); color: var(--white); text-transform: uppercase; letter-spacing: 0.3rem; cursor: pointer; transition: 0.3s; }
        button#execute:hover:not(:disabled) { background: var(--red); border-color: var(--red); }
        button#execute:disabled { border-color: #222; color: #222; cursor: wait; }
        .fine-print { margin-top: 35px; font-size: 0.65rem; color: #222; line-height: 1.6; text-align: justify; border-top: 1px solid #111; padding-top: 20px; }
        audio { width: 100%; margin-top: 25px; filter: invert(1) hue-rotate(180deg) brightness(1.5); }
        #error-msg { color: var(--red); font-size: 0.65rem; text-transform: uppercase; text-align: center; margin-top: 10px; display: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="nexus-module">
    <h1>Nexus // TTS Protocol</h1>
    
    <div id="progress-container">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <span id="status-text">Synchronizing...</span>
    </div>

    <div class="label-group">
        <span class="label">Input Manifest</span>
    </div>
    <textarea id="text-input" maxlength="200" placeholder="Enter text (max 200 chars)..."></textarea>

    <div class="controls">
        <select class="ui-element" id="voice-select">
            <option value="https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/speaker_embeddings.bin">Default Identity</option>
            <option value="https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/speaker_embeddings_2.bin">Alt Identity</option>
        </select>
        <label class="ui-element" id="clone-label">
            <input type="file" id="clone-file" accept="audio/*">
            <span id="clone-status">Clone Audio</span>
        </label>
    </div>

    <button id="execute" disabled>Loading Nexus...</button>
    <div id="error-msg">Protocol Breach: Synthesis Failed</div>
    <audio id="audio-player" controls style="display:none;"></audio>

    <div class="fine-print">
        PROCESS: Client-side synthesis using SpeechT5 (16kHz). CLONING: Audio is analyzed via an encoder model to generate a 512-dim identity vector. All operations remain within the local nexus.
    </div>
</div>

<script type="module">
    let ttsPipeline, encoderPipeline;
    let uploadedEmbedding = null;

    const btn = document.getElementById('execute');
    const statusText = document.getElementById('status-text');
    const progFill = document.getElementById('progress-fill');
    const progContainer = document.getElementById('download-container');
    const errorMsg = document.getElementById('error-msg');
    const player = document.getElementById('audio-player');

    // 1. WAV Encoder (Crucial for playback)
    function encodeWAV(samples) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeString = (o, s) => { for (let i=0; i<s.length; i++) view.setUint8(o+i, s.charCodeAt(i)); };
        writeString(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
        writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, 16000, true); view.setUint32(28, 32000, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        writeString(36, 'data'); view.setUint32(40, samples.length * 2, true);
        for (let i=0, o=44; i<samples.length; i++, o+=2) {
            let s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([buffer], { type: 'audio/wav' });
    }

    // 2. Initialize Models
    async function init() {
        document.getElementById('progress-container').style.display = 'block';
        try {
            // Loading SpeechT5 and the Speaker Encoder for cloning
            statusText.innerText = "Loading Identity Encoder...";
            encoderPipeline = await window.transformers.pipeline('feature-extraction', 'Xenova/wav2vec2-large-xlsr-53-fbank');
            
            statusText.innerText = "Loading Synthesis Engine...";
            ttsPipeline = await window.transformers.pipeline('text-to-speech', 'Xenova/speecht5_tts', {
                progress_callback: (d) => {
                    if (d.status === 'progress') {
                        progFill.style.width = d.progress + '%';
                        statusText.innerText = `Caching Neural Weights: ${Math.round(d.progress)}%`;
                    }
                }
            });

            document.getElementById('progress-container').style.display = 'none';
            btn.disabled = false;
            btn.innerText = "Execute Synthesis";
        } catch (e) {
            statusText.innerText = "Load Failed.";
            console.error(e);
        }
    }

    // 3. Handle Cloning (Generating the 512-dim vector)
    document.getElementById('clone-file').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        btn.disabled = true;
        statusText.innerText = "Extracting Identity...";
        document.getElementById('progress-container').style.display = 'block';
        
        try {
            const ctx = new AudioContext({ sampleRate: 16000 });
            const decoded = await ctx.decodeAudioData(await file.arrayBuffer());
            const audioData = decoded.getChannelData(0);

            // Generate the embedding vector from audio
            const output = await encoderPipeline(audioData);
            // SpeechT5 needs exactly [1, 512], so we average the output
            uploadedEmbedding = output.mean(1); 
            
            document.getElementById('clone-status').innerText = "Identity Captured";
            statusText.innerText = "Ready to Clone";
        } catch (err) {
            alert("Analysis Failed: Use a clean 16kHz WAV if possible.");
        } finally {
            btn.disabled = false;
            setTimeout(() => document.getElementById('progress-container').style.display = 'none', 1000);
        }
    };

    // 4. Synthesis Execution
    btn.onclick = async () => {
        const text = document.getElementById('text-input').value;
        if (!text) return;

        btn.disabled = true;
        btn.innerText = "Manifesting...";
        errorMsg.style.display = 'none';

        try {
            let speaker_embeddings;

            if (uploadedEmbedding) {
                speaker_embeddings = uploadedEmbedding;
            } else {
                // Fetch the .bin embedding for the selected preset
                const url = document.getElementById('voice-select').value;
                const buffer = await (await fetch(url)).arrayBuffer();
                speaker_embeddings = new window.transformers.Tensor('float32', new Float32Array(buffer), [1, 512]);
            }

            const result = await ttsPipeline(text, { speaker_embeddings });
            
            const blob = encodeWAV(result.audio);
            player.src = URL.createObjectURL(blob);
            player.style.display = "block";
            player.play();
            
            btn.innerText = "Synthesis Complete";
        } catch (err) {
            errorMsg.style.display = 'block';
            console.error(err);
        } finally {
            setTimeout(() => { btn.disabled = false; btn.innerText = "Execute Synthesis"; }, 2000);
        }
    };

    init();
</script>
</body>
</html>
