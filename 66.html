<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inkrealm // Nexus TTS</title>
    <!-- Using Transformers.js v3 (Alpha/Latest) for better ONNX 1.20 support -->
    <script type="module">
        import { pipeline, AutoProcessor, RawImage } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        window.transformers = { pipeline };
    </script>

    <style>
        :root { --red: #ff0000; --white: #ffffff; --black: #000000; --dark: #070707; --gray: #333; }
        body { background: var(--black); color: var(--white); font-family: "Georgia", serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        #nexus-module { width: 100%; max-width: 500px; padding: 40px; border: 1px solid #111; background: var(--dark); position: relative; }
        h1 { color: var(--red); font-size: 0.9rem; letter-spacing: 0.5rem; text-transform: uppercase; border-bottom: 1px dashed var(--red); padding-bottom: 15px; margin: 0 0 30px 0; font-weight: normal; }
        
        .label-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15rem; color: #666; }
        #char-count { font-size: 0.6rem; color: #444; }

        textarea { width: 100%; height: 100px; background: transparent; border: 1px solid #222; color: var(--white); font-family: "Georgia", serif; padding: 15px; box-sizing: border-box; outline: none; margin-bottom: 20px; resize: none; transition: 0.3s; }
        textarea:focus { border-color: var(--red); }

        #download-container { margin-bottom: 25px; display: none; }
        #progress-wrapper { width: 100%; height: 2px; background: #111; }
        #progress-fill { height: 100%; background: var(--red); width: 0%; transition: width 0.2s; }
        #status-text { font-size: 0.6rem; color: var(--red); text-transform: uppercase; margin-top: 8px; display: block; letter-spacing: 1px; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .ui-element { background: transparent; border: 1px solid #222; color: #888; padding: 12px; font-family: "Georgia"; font-size: 0.75rem; cursor: pointer; transition: 0.3s; outline: none; }
        .ui-element:hover { border-color: var(--red); color: var(--red); }
        .active-clone { border-color: var(--red); color: var(--white); background: rgba(255,0,0,0.05); }

        button#execute { width: 100%; padding: 18px; background: transparent; border: 1px solid var(--white); color: var(--white); text-transform: uppercase; letter-spacing: 0.3rem; cursor: pointer; transition: 0.3s; }
        button#execute:hover:not(:disabled) { background: var(--red); border-color: var(--red); }
        button#execute:disabled { border-color: #222; color: #222; cursor: wait; }

        .fine-print { margin-top: 35px; font-size: 0.65rem; color: #222; line-height: 1.6; text-align: justify; border-top: 1px solid #111; padding-top: 20px; }
        audio { width: 100%; margin-top: 25px; filter: invert(1) hue-rotate(180deg) brightness(1.5); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="nexus-module">
    <h1>Nexus // TTS Protocol</h1>
    
    <div id="download-container">
        <div id="progress-wrapper"><div id="progress-fill"></div></div>
        <span id="status-text">Connecting...</span>
    </div>

    <div class="label-group">
        <span class="label">Input Manifest</span>
        <span id="char-count">0 / 280</span>
    </div>
    <textarea id="text-input" maxlength="280" placeholder="Enter text..."></textarea>

    <div class="controls">
        <select class="ui-element" id="voice-select">
            <option value="marius">Marius (Default)</option>
            <option value="cosette">Cosette</option>
            <option value="alba">Alba</option>
            <option value="javert">Javert</option>
        </select>
        <label class="ui-element" id="clone-label">
            <input type="file" id="clone-file" accept="audio/*">
            <span id="clone-status">Clone Audio</span>
        </label>
    </div>

    <button id="execute" disabled>Initializing...</button>
    <audio id="audio-player" controls style="display:none;"></audio>

    <div class="fine-print">
        PROCESS: Neural synthesis via client-side ONNX Runtime. CLONING: Analysis requires 5-10s monophonic input. Audio is processed as a Float32 sequence at 24kHz. No data leaves the local nexus.
    </div>
</div>

<script type="module">
    let synthesizer;
    let referenceAudioBuffer = null;
    
    const btn = document.getElementById('execute');
    const statusText = document.getElementById('status-text');
    const progFill = document.getElementById('progress-fill');
    const progContainer = document.getElementById('download-container');
    const textarea = document.getElementById('text-input');
    const charCount = document.getElementById('char-count');
    const cloneInput = document.getElementById('clone-file');
    const cloneLabel = document.getElementById('clone-label');
    const player = document.getElementById('audio-player');

    // 1. WAV Encoding Helper (Fixes the Blob issue)
    function encodeWAV(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeString = (off, s) => { for (let i=0; i<s.length; i++) view.setUint8(off+i, s.charCodeAt(i)); };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true);
        writeString(8, 'WAVE'); writeString(12, 'fmt ');
        view.setUint32(16, 16, true); view.setUint16(20, 1, true);
        view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true);
        view.setUint16(34, 16, true); writeString(36, 'data');
        view.setUint32(40, samples.length * 2, true);
        for (let i=0, off=44; i<samples.length; i++, off+=2) {
            let s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([buffer], { type: 'audio/wav' });
    }

    // 2. Initialize Model
    async function init() {
        progContainer.style.display = 'block';
        try {
            // NOTE: Using a robust community TTS model for the demo logic
            synthesizer = await window.transformers.pipeline('text-to-speech', 'Xenova/speecht5_tts', {
                progress_callback: (d) => {
                    if (d.status === 'progress') {
                        progFill.style.width = d.progress + '%';
                        statusText.innerText = `Loading Nexus Weights: ${Math.round(d.progress)}%`;
                    } else if (d.status === 'ready') {
                        progContainer.style.display = 'none';
                        btn.disabled = false;
                        btn.innerText = "Execute Synthesis";
                    }
                }
            });
        } catch (e) {
            statusText.innerText = "Protocol Error: Check WebGPU/WASM Support";
            console.error(e);
        }
    }

    // 3. Handle Text UX
    textarea.oninput = () => { charCount.innerText = `${textarea.value.length} / 280`; };

    // 4. Handle Voice Cloning Input
    cloneInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        statusText.innerText = "Analyzing Reference...";
        progContainer.style.display = 'block';
        
        try {
            const ctx = new AudioContext();
            const arrayBuffer = await file.arrayBuffer();
            const decoded = await ctx.decodeAudioData(arrayBuffer);
            referenceAudioBuffer = decoded.getChannelData(0); // Float32Array
            
            cloneLabel.classList.add('active-clone');
            document.getElementById('clone-status').innerText = "Voice Captured";
            statusText.innerText = "Clone Ready";
        } catch (err) {
            alert("Audio Decoding Failed");
        } finally {
            setTimeout(() => progContainer.style.display = 'none', 1000);
        }
    };

    // 5. Synthesis Execution
    btn.onclick = async () => {
        const text = textarea.value;
        if (!text) return;

        btn.disabled = true;
        btn.innerText = "Manifesting...";
        player.style.display = "none";

        try {
            const speakerId = document.getElementById('voice-select').value;
            
            // Wiring logic: If clone exists, we pass it. 
            // In SpeechT5/PocketTTS we use the speaker_embeddings or reference audio.
            const result = await synthesizer(text, {
                speaker_embeddings: referenceAudioBuffer ? referenceAudioBuffer : speakerId,
            });

            // result.audio is a Float32Array, result.sampling_rate is likely 16000 or 24000
            const blob = encodeWAV(result.audio, result.sampling_rate || 24000);
            player.src = URL.createObjectURL(blob);
            player.style.display = "block";
            player.play();
            
            btn.innerText = "Synthesis Complete";
        } catch (err) {
            console.error(err);
            btn.innerText = "Protocol Failed";
        } finally {
            setTimeout(() => { btn.disabled = false; btn.innerText = "Execute Synthesis"; }, 2000);
        }
    };

    init();
</script>
</body>
</html>
