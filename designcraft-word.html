<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DesignCraft Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #ff0033;
  --black: #050505;
  --white: #ffffff;
  --grey: #1a1a1a;
  --dark-grey: #0a0a0a;
  --text-main: #ffffff;
  --font-sans: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'Courier New', Courier, monospace;
  --panel: #111111;
  --border: #2a2a2a;
  --hover: #222222;
  --muted: #888888;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--black);
  color: var(--text-main);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--red);
  color: var(--black);
  text-shadow: none;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

/* ── Top bar ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--dark-grey);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 44px;
  overflow-x: auto;
  scrollbar-width: none;
}
.topbar::-webkit-scrollbar { display: none; }

.logo {
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.03em;
  color: var(--red);
  white-space: nowrap;
  margin-right: 6px;
}

.divider {
  width: 1px;
  height: 18px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 2px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 30px;
  height: 30px;
  padding: 0 8px;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: var(--text-main);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--hover); }
.btn.active {
  background: var(--red);
  color: var(--black);
}
.btn svg { width: 15px; height: 15px; fill: currentColor; }

.select {
  height: 30px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--panel);
  color: var(--text-main);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  outline: none;
}
.select:focus { border-color: var(--red); }

/* ── Main layout ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  background: var(--dark-grey);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  transition: transform 0.25s ease;
}
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--dark-grey);
  z-index: 2;
}
.sidebar-close {
  display: none;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-main);
  font-size: 18px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  line-height: 1;
  flex-shrink: 0;
}
.sidebar-close:hover { background: var(--hover); }

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 55;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}
.sidebar-backdrop.visible {
  display: block;
  opacity: 1;
  pointer-events: auto;
}

.sidebar-section {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-section h3 {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 8px;
}

.style-list { display: flex; flex-direction: column; gap: 2px; }
.style-item {
  padding: 6px 10px;
  border-radius: 5px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}
.style-item:hover { background: var(--hover); }
.style-item.active {
  background: var(--red);
  color: var(--black);
  font-weight: 600;
}

.prop-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 12px;
  gap: 8px;
}
.prop-row label { color: var(--muted); flex-shrink: 0; }

.blend-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.blend-btn {
  padding: 6px 4px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
  color: var(--text-main);
  font-size: 11px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.blend-btn:hover { border-color: var(--red); }
.blend-btn.active {
  background: var(--red);
  color: var(--black);
  border-color: var(--red);
  font-weight: 600;
}

/* ── Editor ── */
.editor-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #0d0d0d;
  position: relative;
}

.editor-scroll {
  flex: 1;
  overflow: auto;
  padding: 28px 16px 90px;
  display: flex;
  justify-content: center;
  -webkit-overflow-scrolling: touch;
}

/* The page / canvas */
.page {
  width: 100%;
  max-width: 780px;
  min-height: 980px;
  background: #111;
  border-radius: 3px;
  box-shadow: 0 0 0 1px var(--border), 0 16px 48px rgba(0,0,0,0.55);
  position: relative;
  overflow: hidden;
  transition: max-width 0.25s;
}

/* Editable surface */
#editor {
  outline: none;
  min-height: 980px;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-main);
  caret-color: var(--red);
  padding: 0;
  position: relative;
}

#editor:empty:before {
  content: attr(data-placeholder);
  color: var(--muted);
  pointer-events: none;
  position: absolute;
  top: 40px;
  left: 40px;
}

/* ── Typography inside the page ── */
#editor h1 {
  font-size: 2.6em;
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -0.025em;
  margin: 0 0 0.3em;
  color: #e8e0d8;
}
#editor h2 {
  font-size: 1.35em;
  font-weight: 600;
  line-height: 1.3;
  margin: 1.1em 0 0.35em;
  color: #ddd;
}
#editor h3 {
  font-size: 0.75em;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--red);
  margin: 0 0 0.6em;
}
#editor p {
  margin: 0 0 0.9em;
  color: #ccc;
}
#editor .deck {
  font-size: 1.05em;
  font-weight: 400;
  font-style: italic;
  color: #aaa;
  margin: 0 0 1.2em;
  line-height: 1.45;
}
#editor .pull-quote {
  font-size: 1.45em;
  font-weight: 500;
  line-height: 1.35;
  color: var(--red);
  margin: 1.5em 0;
  padding: 0.9em 0;
  border-top: 2px solid var(--red);
  border-bottom: 2px solid var(--red);
  text-align: center;
}
#editor .caption {
  font-size: 0.78em;
  color: #777;
  margin-top: 0.4em;
  line-height: 1.4;
}
#editor ul, #editor ol {
  margin: 0 0 0.9em 1.3em;
  color: #ccc;
}
#editor a { color: var(--red); }

/* ── Image blocks ── */
.img-block {
  position: relative;
  margin: 0 0 1em;
  display: block;
  max-width: 100%;
  cursor: pointer;
  outline: none;
}
.img-block img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 420px;
  object-fit: cover;
  border-radius: 2px;
}
.img-block.selected {
  outline: 2px solid var(--red);
  outline-offset: 2px;
}
.img-block .img-controls {
  display: none;
  position: absolute;
  top: 8px;
  right: 8px;
  gap: 4px;
  z-index: 5;
}
.img-block.selected .img-controls { display: flex; }
.img-controls button {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 4px;
  background: rgba(0,0,0,0.75);
  color: #fff;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.img-controls button:hover { background: var(--red); color: #000; }

/* Blend modes applied to the image itself */
.img-block img.blend-overlay { mix-blend-mode: overlay; }
.img-block img.blend-multiply { mix-blend-mode: multiply; }
.img-block img.blend-screen { mix-blend-mode: screen; }
.img-block img.blend-soft-light { mix-blend-mode: soft-light; }
.img-block img.blend-hard-light { mix-blend-mode: hard-light; }
.img-block img.blend-color-dodge { mix-blend-mode: color-dodge; }
.img-block img.blend-luminosity { mix-blend-mode: luminosity; }

/* Overlay color wash */
.img-block .overlay-wash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 2px;
  mix-blend-mode: overlay;
  opacity: 0;
  transition: opacity 0.2s;
}
.img-block.has-wash .overlay-wash { opacity: 0.45; }

/* Full-bleed hero image at top of template */
.hero {
  position: relative;
  width: 100%;
  height: 320px;
  overflow: hidden;
  margin: 0;
}
.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hero .hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(17,17,17,0.95) 0%, rgba(17,17,17,0.3) 50%, transparent 100%);
  pointer-events: none;
}
.hero .hero-content {
  position: absolute;
  bottom: 28px;
  left: 36px;
  right: 36px;
  z-index: 2;
}

/* Two-column body layout inside template */
.body-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  padding: 28px 36px 40px;
}
.body-grid.single {
  grid-template-columns: 1fr;
  max-width: 580px;
}

/* Status bar */
.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 14px;
  background: var(--dark-grey);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
  min-height: 26px;
}
.statusbar .sep { margin: 0 7px; opacity: 0.35; }

/* FAB */
.fab {
  display: none;
  position: fixed;
  bottom: 44px;
  right: 14px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--red);
  color: var(--black);
  border: none;
  box-shadow: 0 4px 18px rgba(255,0,51,0.4);
  cursor: pointer;
  z-index: 50;
  align-items: center;
  justify-content: center;
}
.fab svg { width: 20px; height: 20px; fill: currentColor; }

/* Toast */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--grey);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 9px 16px;
  border-radius: 7px;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Drop zone highlight */
.page.drag-over {
  outline: 2px dashed var(--red);
  outline-offset: -4px;
}

/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 60;
    width: 280px;
    max-width: 85vw;
    transform: translateX(-100%);
    box-shadow: 8px 0 28px rgba(0,0,0,0.55);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-close { display: flex; }
  .page { border-radius: 0; box-shadow: none; }
  .editor-scroll { padding: 0 0 70px; }
  .fab { display: flex; }
  .hide-mobile { display: none !important; }
  .body-grid { grid-template-columns: 1fr; gap: 16px; padding: 20px 18px 32px; }
  .hero { height: 220px; }
  .hero .hero-content { left: 18px; right: 18px; bottom: 18px; }
  #editor h1 { font-size: 1.9em; }
}

/* Print / PDF */
@media print {
  .topbar, .sidebar, .statusbar, .fab, .toast, .sidebar-backdrop, .img-controls {
    display: none !important;
  }
  html, body {
    background: #111 !important;
    overflow: visible !important;
    height: auto !important;
  }
  .app, .main, .editor-wrap, .editor-scroll {
    display: block !important;
    overflow: visible !important;
    height: auto !important;
    background: #111 !important;
  }
  .page {
    max-width: 100% !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    margin: 0 !important;
  }
  #editor {
    min-height: 0 !important;
  }
}
</style>
</head>
<body>
<div class="app">
  <!-- Toolbar -->
  <div class="topbar" role="toolbar">
    <button class="btn" id="btnSidebar" title="Panel">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <span class="logo">DesignCraft Writer</span>
    <div class="divider hide-mobile"></div>

    <button class="btn" id="btnNew" title="New">New</button>
    <button class="btn" id="btnOpen" title="Open">Open</button>
    <button class="btn" id="btnSave" title="Save">Save</button>
    <div class="divider"></div>

    <button class="btn" id="btnUndo" title="Undo">
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
    </button>
    <button class="btn" id="btnRedo" title="Redo">
      <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
    </button>
    <div class="divider"></div>

    <button class="btn" data-cmd="bold" title="Bold"><b>B</b></button>
    <button class="btn" data-cmd="italic" title="Italic"><i>I</i></button>
    <button class="btn" data-cmd="underline" title="Underline"><u>U</u></button>
    <div class="divider hide-mobile"></div>

    <button class="btn" data-cmd="justifyLeft" title="Left">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v2H3V5zm0 4h12v2H3V9zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg>
    </button>
    <button class="btn" data-cmd="justifyCenter" title="Center">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v2H3V5zm4 4h10v2H7V9zm-4 4h18v2H3v-2zm4 4h10v2H7v-2z"/></svg>
    </button>
    <button class="btn" data-cmd="justifyRight" title="Right">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v2H3V5zm6 4h12v2H9V9zm-6 4h18v2H3v-2zm6 4h12v2H9v-2z"/></svg>
    </button>
    <div class="divider"></div>

    <button class="btn" id="btnImage" title="Insert image">
      <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      <span class="hide-mobile">Image</span>
    </button>
    <button class="btn" id="btnQuote" title="Pull quote">Quote</button>

    <div style="flex:1"></div>
    <button class="btn" id="btnExport" title="Export PDF">PDF</button>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Design</span>
        <button class="sidebar-close" id="btnCloseSidebar" aria-label="Close panel">✕</button>
      </div>

      <div class="sidebar-section">
        <h3>Styles</h3>
        <div class="style-list" id="paraStyles">
          <div class="style-item" data-style="kicker">Kicker</div>
          <div class="style-item" data-style="h1">Headline</div>
          <div class="style-item" data-style="deck">Deck</div>
          <div class="style-item active" data-style="body">Body</div>
          <div class="style-item" data-style="h2">Subhead</div>
          <div class="style-item" data-style="quote">Pull Quote</div>
          <div class="style-item" data-style="caption">Caption</div>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Image Blend</h3>
        <div class="blend-grid" id="blendModes">
          <button class="blend-btn active" data-blend="normal">Normal</button>
          <button class="blend-btn" data-blend="overlay">Overlay</button>
          <button class="blend-btn" data-blend="multiply">Multiply</button>
          <button class="blend-btn" data-blend="screen">Screen</button>
          <button class="blend-btn" data-blend="soft-light">Soft Light</button>
          <button class="blend-btn" data-blend="hard-light">Hard Light</button>
          <button class="blend-btn" data-blend="color-dodge">Color Dodge</button>
          <button class="blend-btn" data-blend="luminosity">Luminosity</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Overlay Wash</h3>
        <div class="prop-row">
          <label>Color</label>
          <input type="color" id="washColor" value="#ff0033" style="width:36px;height:28px;border:none;background:none;cursor:pointer">
        </div>
        <div class="prop-row">
          <label>Strength</label>
          <input type="range" id="washStrength" min="0" max="80" value="0" style="flex:1;accent-color:var(--red)">
        </div>
        <button class="btn" id="btnApplyWash" style="width:100%;margin-top:4px;background:var(--panel)">Apply to selected</button>
      </div>

      <div class="sidebar-section">
        <h3>Layout</h3>
        <div class="prop-row">
          <label>Columns</label>
          <select class="select" id="colSelect" style="width:90px">
            <option value="1">1 col</option>
            <option value="2" selected>2 col</option>
          </select>
        </div>
        <div class="prop-row">
          <label>Width</label>
          <select class="select" id="widthSelect" style="width:90px">
            <option value="640">Narrow</option>
            <option value="780" selected>Standard</option>
            <option value="960">Wide</option>
          </select>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Document</h3>
        <div class="prop-row"><label>Words</label><span id="wordCount">0</span></div>
        <div class="prop-row"><label>Characters</label><span id="charCount">0</span></div>
      </div>
    </aside>

    <!-- Canvas -->
    <div class="editor-wrap">
      <div class="editor-scroll">
        <div class="page" id="page">
          <div id="editor" contenteditable="true" spellcheck="true"
               data-placeholder="Drop an image or start designing…"
               role="textbox" aria-multiline="true"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div>
      <span id="statusWords">0 words</span>
      <span class="sep">·</span>
      <span id="statusChars">0 characters</span>
    </div>
    <div>
      <span>Select an image, then choose a blend mode</span>
    </div>
  </div>
</div>

<button class="fab" id="fabSidebar" aria-label="Panel">
  <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
</button>

<input type="file" id="fileImage" accept="image/*" multiple hidden>
<input type="file" id="fileOpen" accept=".html,.htm,.txt" hidden>

<div class="toast" id="toast"></div>

<script>
(() => {
  const editor = document.getElementById('editor');
  const page = document.getElementById('page');
  const sidebar = document.getElementById('sidebar');
  const toast = document.getElementById('toast');
  let selectedImgBlock = null;

  function showToast(msg, ms = 2000) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), ms);
  }

  function updateCounts() {
    const text = (editor.innerText || '').trim();
    const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
    const chars = text.length;
    document.getElementById('wordCount').textContent = words;
    document.getElementById('charCount').textContent = chars;
    document.getElementById('statusWords').textContent = words + ' words';
    document.getElementById('statusChars').textContent = chars + ' characters';
  }

  // ── Toolbar commands ──
  document.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.execCommand(btn.dataset.cmd, false, null);
      editor.focus();
    });
  });

  document.getElementById('btnUndo').onclick = () => { document.execCommand('undo'); updateCounts(); };
  document.getElementById('btnRedo').onclick = () => { document.execCommand('redo'); updateCounts(); };

  // ── Styles ──
  document.getElementById('paraStyles').addEventListener('click', e => {
    const item = e.target.closest('.style-item');
    if (!item) return;
    document.querySelectorAll('.style-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    applyStyle(item.dataset.style);
  });

  function applyStyle(style) {
    editor.focus();
    const sel = window.getSelection();
    switch (style) {
      case 'kicker':
        document.execCommand('formatBlock', false, 'h3');
        break;
      case 'h1':
        document.execCommand('formatBlock', false, 'h1');
        break;
      case 'h2':
        document.execCommand('formatBlock', false, 'h2');
        break;
      case 'deck':
        if (sel.rangeCount) {
          const range = sel.getRangeAt(0);
          const text = range.toString() || 'A short deck that sets the tone.';
          range.deleteContents();
          const el = document.createElement('p');
          el.className = 'deck';
          el.textContent = text;
          range.insertNode(el);
        }
        break;
      case 'body':
        document.execCommand('formatBlock', false, 'p');
        break;
      case 'quote':
        if (sel.rangeCount) {
          const range = sel.getRangeAt(0);
          const text = range.toString() || 'The best layouts disappear. What remains is the story.';
          range.deleteContents();
          const el = document.createElement('div');
          el.className = 'pull-quote';
          el.textContent = text;
          range.insertNode(el);
        }
        break;
      case 'caption':
        if (sel.rangeCount) {
          const range = sel.getRangeAt(0);
          const text = range.toString() || 'Caption text';
          range.deleteContents();
          const el = document.createElement('p');
          el.className = 'caption';
          el.textContent = text;
          range.insertNode(el);
        }
        break;
    }
    updateCounts();
  }

  document.getElementById('btnQuote').onclick = () => applyStyle('quote');

  // ── Image insertion ──
  document.getElementById('btnImage').onclick = () => document.getElementById('fileImage').click();

  document.getElementById('fileImage').addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => insertImageFile(file));
    e.target.value = '';
  });

  function insertImageFile(file) {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      const block = createImgBlock(reader.result);
      const sel = window.getSelection();
      if (sel.rangeCount && editor.contains(sel.anchorNode)) {
        const range = sel.getRangeAt(0);
        range.collapse(false);
        range.insertNode(block);
        const p = document.createElement('p');
        p.innerHTML = '<br>';
        block.after(p);
      } else {
        editor.appendChild(block);
        const p = document.createElement('p');
        p.innerHTML = '<br>';
        editor.appendChild(p);
      }
      selectImgBlock(block);
      updateCounts();
      showToast('Image added');
    };
    reader.readAsDataURL(file);
  }

  function createImgBlock(src) {
    const block = document.createElement('div');
    block.className = 'img-block';
    block.contentEditable = 'false';
    block.innerHTML = `
      <img src="${src}" alt="Image" draggable="false">
      <div class="overlay-wash"></div>
      <div class="img-controls">
        <button type="button" data-action="delete" title="Remove">✕</button>
      </div>
    `;
    block.addEventListener('click', ev => {
      ev.stopPropagation();
      selectImgBlock(block);
    });
    block.querySelector('[data-action="delete"]').addEventListener('click', ev => {
      ev.stopPropagation();
      block.remove();
      selectedImgBlock = null;
      updateCounts();
    });
    return block;
  }

  function selectImgBlock(block) {
    document.querySelectorAll('.img-block').forEach(b => b.classList.remove('selected'));
    if (block) {
      block.classList.add('selected');
      selectedImgBlock = block;
      const img = block.querySelector('img');
      const current = [...img.classList].find(c => c.startsWith('blend-'));
      document.querySelectorAll('.blend-btn').forEach(b => {
        b.classList.toggle('active',
          (current && b.dataset.blend === current.replace('blend-', '')) ||
          (!current && b.dataset.blend === 'normal')
        );
      });
    } else {
      selectedImgBlock = null;
    }
  }

  editor.addEventListener('click', e => {
    if (!e.target.closest('.img-block')) selectImgBlock(null);
  });

  // ── Blend modes ──
  document.getElementById('blendModes').addEventListener('click', e => {
    const btn = e.target.closest('.blend-btn');
    if (!btn || !selectedImgBlock) {
      if (btn && !selectedImgBlock) showToast('Select an image first');
      return;
    }
    document.querySelectorAll('.blend-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const img = selectedImgBlock.querySelector('img');
    img.className = img.className.replace(/blend-\S+/g, '').trim();
    if (btn.dataset.blend !== 'normal') {
      img.classList.add('blend-' + btn.dataset.blend);
    }
    showToast('Blend: ' + btn.dataset.blend);
  });

  // ── Overlay wash ──
  document.getElementById('btnApplyWash').onclick = () => {
    if (!selectedImgBlock) {
      showToast('Select an image first');
      return;
    }
    const color = document.getElementById('washColor').value;
    const strength = document.getElementById('washStrength').value / 100;
    const wash = selectedImgBlock.querySelector('.overlay-wash');
    wash.style.background = color;
    wash.style.opacity = strength;
    selectedImgBlock.classList.toggle('has-wash', strength > 0);
    showToast('Overlay wash applied');
  };

  document.getElementById('washStrength').addEventListener('input', e => {
    if (!selectedImgBlock) return;
    const wash = selectedImgBlock.querySelector('.overlay-wash');
    wash.style.background = document.getElementById('washColor').value;
    wash.style.opacity = e.target.value / 100;
    selectedImgBlock.classList.toggle('has-wash', e.target.value > 0);
  });

  // ── Drag & drop images ──
  page.addEventListener('dragover', e => {
    e.preventDefault();
    page.classList.add('drag-over');
  });
  page.addEventListener('dragleave', () => page.classList.remove('drag-over'));
  page.addEventListener('drop', e => {
    e.preventDefault();
    page.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
    files.forEach(f => insertImageFile(f));
  });

  // ── Columns / width ──
  document.getElementById('colSelect').addEventListener('change', e => {
    const grid = editor.querySelector('.body-grid');
    if (grid) {
      grid.classList.toggle('single', e.target.value === '1');
    }
  });
  document.getElementById('widthSelect').addEventListener('change', e => {
    page.style.maxWidth = e.target.value + 'px';
  });

  // ── Sidebar toggle ──
  const backdrop = document.getElementById('sidebarBackdrop');

  function openSidebar() {
    sidebar.classList.add('open');
    backdrop.classList.add('visible');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    backdrop.classList.remove('visible');
    document.body.style.overflow = '';
  }
  function toggleSidebar() {
    if (window.innerWidth <= 768) {
      if (sidebar.classList.contains('open')) closeSidebar();
      else openSidebar();
    } else {
      sidebar.classList.toggle('collapsed');
    }
  }
  document.getElementById('btnSidebar').onclick = toggleSidebar;
  document.getElementById('fabSidebar').onclick = toggleSidebar;
  document.getElementById('btnCloseSidebar').onclick = closeSidebar;
  backdrop.addEventListener('click', closeSidebar);

  // Close on Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
  });

  // ── File ops ──
  document.getElementById('btnNew').onclick = () => {
    if ((editor.innerText || '').trim() && !confirm('Start a new document?')) return;
    loadTemplate();
    showToast('New document');
  };

  // Save still exports HTML for editing later
  document.getElementById('btnSave').onclick = () => {
    const clone = editor.cloneNode(true);
    clone.querySelectorAll('.img-controls').forEach(el => el.remove());
    clone.querySelectorAll('.img-block').forEach(b => {
      b.classList.remove('selected');
      b.removeAttribute('contenteditable');
    });
    const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DesignCraft Export</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font-family: Inter, Helvetica Neue, Arial, sans-serif; }
  .page { max-width: 780px; margin: 0 auto; background: #111; }
  h1 { font-size: 2.6em; font-weight: 700; line-height: 1.12; color: #e8e0d8; letter-spacing: -0.025em; }
  h2 { font-size: 1.35em; font-weight: 600; color: #ddd; }
  h3 { font-size: 0.75em; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #ff0033; }
  p { line-height: 1.6; margin: 0 0 0.9em; }
  .deck { font-size: 1.05em; font-style: italic; color: #aaa; }
  .pull-quote { font-size: 1.45em; color: #ff0033; border-top: 2px solid #ff0033; border-bottom: 2px solid #ff0033; text-align: center; margin: 1.5em 0; padding: 0.9em 0; }
  .caption { font-size: 0.78em; color: #777; }
  .hero { position: relative; height: 320px; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(17,17,17,0.95), transparent); }
  .hero-content { position: absolute; bottom: 28px; left: 36px; right: 36px; }
  .body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 28px 36px 40px; }
  .body-grid.single { grid-template-columns: 1fr; }
  .img-block { margin: 0 0 1em; position: relative; }
  .img-block img { width: 100%; display: block; border-radius: 2px; }
  .overlay-wash { position: absolute; inset: 0; pointer-events: none; }
  img.blend-overlay { mix-blend-mode: overlay; }
  img.blend-multiply { mix-blend-mode: multiply; }
  img.blend-screen { mix-blend-mode: screen; }
  img.blend-soft-light { mix-blend-mode: soft-light; }
  img.blend-hard-light { mix-blend-mode: hard-light; }
  img.blend-color-dodge { mix-blend-mode: color-dodge; }
  img.blend-luminosity { mix-blend-mode: luminosity; }
</style>
</head>
<body>
<div class="page">${clone.innerHTML}</div>
</body>
</html>`;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'designcraft-document.html';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Saved as HTML');
  };

  // Export PDF via print dialog (Save as PDF)
  document.getElementById('btnExport').onclick = () => {
    // Deselect images so controls don't print
    selectImgBlock(null);
    closeSidebar();
    showToast('Opening print dialog — choose “Save as PDF”');
    setTimeout(() => window.print(), 400);
  };

  document.getElementById('btnOpen').onclick = () => document.getElementById('fileOpen').click();
  document.getElementById('fileOpen').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = reader.result;
      if (file.name.match(/\.html?$/i)) {
        const match = text.match(/<div class="page"[^>]*>([\s\S]*)<\/div>\s*<\/body>/i) ||
                      text.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        editor.innerHTML = match ? match[1] : text;
        editor.querySelectorAll('.img-block').forEach(block => {
          block.contentEditable = 'false';
          block.addEventListener('click', ev => {
            ev.stopPropagation();
            selectImgBlock(block);
          });
          const del = block.querySelector('[data-action="delete"]');
          if (del) del.onclick = ev => { ev.stopPropagation(); block.remove(); selectedImgBlock = null; };
        });
      } else {
        editor.innerHTML = '<p>' + text.replace(/\n/g, '</p><p>') + '</p>';
      }
      updateCounts();
      showToast('Opened ' + file.name);
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      document.getElementById('btnSave').click();
    }
  });

  editor.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (file) insertImageFile(file);
        return;
      }
    }
  });

  editor.addEventListener('input', updateCounts);

  // ── Magazine template ──
  function loadTemplate() {
    const heroSvg = `data:image/svg+xml,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a0a2e"/>
            <stop offset="40%" style="stop-color:#ff6b35"/>
            <stop offset="70%" style="stop-color:#f7c59f"/>
            <stop offset="100%" style="stop-color:#2d1b4e"/>
          </linearGradient>
          <radialGradient id="r" cx="70%" cy="40%" r="50%">
            <stop offset="0%" style="stop-color:#ffcc88;stop-opacity:0.9"/>
            <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0"/>
          </radialGradient>
        </defs>
        <rect width="1200" height="640" fill="url(#g)"/>
        <ellipse cx="850" cy="220" rx="280" ry="200" fill="url(#r)"/>
        <rect y="480" width="1200" height="160" fill="#0d0d0d" opacity="0.55"/>
      </svg>
    `)}`;

    editor.innerHTML = `
      <div class="hero" contenteditable="false">
        <img src="${heroSvg}" alt="Hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <h3 contenteditable="true">Feature — Design</h3>
          <h1 contenteditable="true">Notes on the Grid</h1>
        </div>
      </div>
      <div class="body-grid">
        <div>
          <p class="deck">A good layout is invisible. Here is what is going on underneath the page — from the baseline grid to the paragraph composer.</p>
          <p>Every page begins as an empty field of possibility. The grid arrives first: margins that frame the reading area, columns that set the rhythm, and a baseline grid that keeps every line in step from one column to the next. Good layout is quiet. It lets the reader move through a story without noticing the machinery that carries them.</p>
          <p>Typography does the heavy lifting. A paragraph composer weighs every possible line break at once, trading a slightly loose line here for a much better one three lines later. The result is an even texture of type, free of rivers and ragged gaps, where hyphens appear only when they truly help.</p>
        </div>
        <div>
          <div class="pull-quote">The best layouts disappear. What remains is the story.</div>
          <p>Images give a spread its pulse. A strong photograph bleeds off the edge of the page, while smaller pictures sit inside the grid and let the text wrap around them. Captions, pull quotes and running heads add layers that a careful reader can explore at their own pace.</p>
          <p>Color holds it all together. A restrained palette of two or three swatches, applied consistently to headlines, rules and backgrounds, gives a publication its voice. Spot inks, tints and gradients are all just named swatches, so a single change ripples through every page.</p>
        </div>
      </div>
    `;
    updateCounts();
  }

  loadTemplate();
})();
</script>
</body>
</html>
