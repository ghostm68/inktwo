name: Full Ecosystem Health Sweep

on:
  workflow_dispatch: # Run manually from the GitHub Actions tab

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Engine
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Dynamic Sitemap Discovery & Portal Sweep
        run: |
          cat << 'EOF' > sweep.mjs
          import { chromium } from 'playwright';
          import fs from 'fs';

          const SITEMAP_URL = 'https://inkrealm.info/sitemap';
          const BASE_DOMAIN = 'inkrealm.info';

          async function audit() {
            const browser = await chromium.launch();
            const discoveryPage = await browser.newPage();

            console.log(`📡 Connecting to index registry: ${SITEMAP_URL}`);
            
            try {
              // domcontentloaded prevents timeouts on sites with ongoing GSAP/WebGL loops
              await discoveryPage.goto(SITEMAP_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await discoveryPage.waitForTimeout(3000); // Allow GSAP to finish hydrating DOM
            } catch (err) {
              console.error(`🚨 Failed to load sitemap hub: ${err.message}`);
              await browser.close();
              process.exit(1);
            }

            // Scrape links
            const rawLinks = await discoveryPage.evaluate(() => {
              return Array.from(document.querySelectorAll('a[href]'))
                .map(a => a.href.trim())
                .filter(href => href && !href.startsWith('mailto:') && !href.startsWith('tel:'));
            });

            await discoveryPage.close();

            const targetUrls = Array.from(new Set(rawLinks))
              .map(url => url.split('#')[0].replace(/\/$/, ''))
              .filter(url => url.includes(BASE_DOMAIN) && url !== SITEMAP_URL);

            console.log(`\n🔍 Found ${targetUrls.length} destinations to audit:`);
            targetUrls.forEach((u, i) => console.log(`   [${i + 1}] ${u}`));

            if (targetUrls.length === 0) {
              console.warn("⚠️ No portal links were extracted.");
              await browser.close();
              return;
            }

            let failureCount = 0;
            const allIssues = [];

            for (const url of targetUrls) {
              console.log(`\nAuditing: ${url}`);
              const page = await browser.newPage();
              const pageIssues = [];

              page.on('pageerror', err => pageIssues.push(`[JS ERROR] ${err.message}`));
              page.on('console', msg => {
                if (msg.type() === 'error') pageIssues.push(`[CONSOLE ERROR] ${msg.text()}`);
              });

              try {
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                if (response && response.status() >= 400) {
                  pageIssues.push(`[HTTP STATUS] Returned code ${response.status()}`);
                }
                await page.waitForTimeout(2000);
              } catch (e) {
                pageIssues.push(`[NAVIGATION FAIL] ${e.message}`);
              }

              if (pageIssues.length === 0) {
                console.log(`  ✅ Clean`);
              } else {
                failureCount += pageIssues.length;
                pageIssues.forEach(err => {
                  console.error(`  ❌ ${err}`);
                  allIssues.push({ url, issue: err });
                });
              }

              await page.close();
            }

            await browser.close();

            if (failureCount > 0) {
              fs.writeFileSync('audit-summary.json', JSON.stringify({ failureCount, issues: allIssues }, null, 2));
              console.error(`\n🚨 Sweep finished with ${failureCount} critical failure(s).`);
              process.exit(1);
            } else {
              console.log(`\n✨ All portals passed cleanly.`);
            }
          }

          audit();
          EOF

          node sweep.mjs

      - name: Upload audit summary (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-audit-summary
          path: audit-summary.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          echo "## Ecosystem Health Sweep Results" >> $GITHUB_STEP_SUMMARY
          if [ -f audit-summary.json ]; then
            echo "### ❌ Failures detected" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat audit-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All portals passed with zero runtime failures." >> $GITHUB_STEP_SUMMARY
          fi
