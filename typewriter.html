<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="https://wordstar.nexus/svg/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="https://wordstar.nexus/svg/favicon.svg" />
<link rel="shortcut icon" href="https://wordstar.nexus/svg/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="https://wordstar.nexus/svg/apple-touch-icon.png" />
<title>TYPEWRITER // INSTRUMENT</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=Courier+Prime&family=VT323&family=JetBrains+Mono&family=Source+Code+Pro&family=Roboto+Mono&family=Space+Mono&family=Fira+Code&family=EB+Garamond&family=Libre+Baskerville&family=Merriweather&family=Inter&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #090909;
  --panel: #111111;
  --panel-border: #282828;
  --dock-bg: rgba(14, 14, 14, 0.94);
  --text: #eaeaea;
  --text-dim: #555555;
  --red: #e10600;
  --red-dim: #8a0400;
  --grey: #858585;
  --grey-dark: #303030;
  --input-bg: #000000;
  --knob-bg: radial-gradient(circle at 35% 35%, #2a2a2a, #080808);
  --knob-border: #383838;
  --editor-overlay: linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0.72));
  --cursor-bg: #ffffff;
  --cursor-text: #000000;
  --video-opacity: 0.35;
  --video-filter: grayscale(0.35) contrast(1.05);
}

body.inverted {
  --bg: #f4efe6;
  --panel: #e6e0d2;
  --panel-border: #cdc4b3;
  --dock-bg: rgba(240, 235, 224, 0.95);
  --text: #161616;
  --text-dim: #9b9487;
  --red: #c40500;
  --red-dim: #8b0400;
  --grey: #686156;
  --grey-dark: #bcb4a3;
  --input-bg: #ffffff;
  --knob-bg: radial-gradient(circle at 35% 35%, #f7f3ec, #cfc6b5);
  --knob-border: #b8af9c;
  /* Crisp, translucent scrim without heavy milky fog */
  --editor-overlay: linear-gradient(to bottom, rgba(244,239,230,0.20), rgba(244,239,230,0.42));
  --cursor-bg: #161616;
  --cursor-text: #ffffff;
  /* Crystal-clear video without photo-negative distortion */
  --video-opacity: 0.65;
  --video-filter: contrast(1.1) brightness(1.02) grayscale(0.12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  overflow: hidden;
  transition: background-color 0.25s, color 0.25s;
}
body { display: flex; flex-direction: column; cursor: none; }

/* Custom cursor */
#cursor-wrap {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  transform: translate(-50%, -50%);
}
#cursor {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--cursor-bg);
  box-shadow: 0 0 14px rgba(0,0,0,0.3);
  transition: transform 0.16s cubic-bezier(0.16,1,0.3,1), opacity 0.15s, background-color 0.25s;
  display: flex; align-items: center; justify-content: center;
}
#cursor.hovering { transform: scale(1.35); }
#cursor-text {
  color: var(--cursor-text); font-size: 8px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  opacity: 0; transition: opacity 0.12s;
}
#cursor.hovering #cursor-text { opacity: 1; }
body.typing #cursor-wrap { opacity: 0; pointer-events: none; }

.app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }

/* --- ROOMY ACROHAT RACK HEADER --- */
header {
  display: flex; flex-direction: column; gap: 14px;
  padding: 18px 24px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-border);
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  z-index: 10;
}
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.header-row.rack-shelf {
  justify-content: space-between; align-items: center;
  padding-top: 6px; border-top: 1px dashed var(--panel-border);
}
header .title { color: var(--red); font-weight: 600; font-size: 14px; letter-spacing: 0.16em; }
header .label { color: var(--grey); font-size: 9px; }
header select, header button, header input[type="text"] {
  background: var(--input-bg); color: var(--text); border: 1px solid var(--grey-dark);
  padding: 6px 10px; font-size: 10px; font-family: inherit; cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
header input[type="text"] { width: 140px; cursor: text; }
header button:hover, header select:hover { border-color: var(--red); color: var(--red); }
header a { color: var(--grey); text-decoration: none; font-size: 10px; letter-spacing: 0.1em; }
header a:hover { color: var(--red); }

/* Acrohat Analog Rotary Knobs */
.rack-dials { display: flex; align-items: center; gap: 20px; }
.knob-pod {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  user-select: none; -webkit-user-select: none;
}
.knob-pod .knob-label { font-size: 8px; color: var(--grey); letter-spacing: 0.1em; }
.knob-dial {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--knob-bg);
  border: 2px solid var(--knob-border);
  box-shadow: 0 3px 8px rgba(0,0,0,0.35), inset 0 1px 2px rgba(255,255,255,0.15);
  position: relative; cursor: ns-resize; touch-action: none;
  transition: border-color 0.15s;
}
.knob-dial:hover, .knob-dial.active { border-color: var(--red); }
.knob-dial::after {
  content: ''; position: absolute; top: 3px; left: 50%;
  width: 3px; height: 12px; background: var(--red);
  transform: translateX(-50%); border-radius: 2px;
}
.knob-pod .readout {
  font-size: 9px; font-weight: 600; color: var(--text);
  font-variant-numeric: tabular-nums; letter-spacing: 0.05em;
}

/* Image Bay Shelf */
.img-bay { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--grey-dark); }
.seg button {
  border: none; border-right: 1px solid var(--grey-dark); padding: 5px 9px;
  background: var(--input-bg); color: var(--grey);
}
.seg button:last-child { border-right: none; }
.seg button.active { background: var(--red); color: #fff; }

/* Contained Desktop / Desk Platen */
.main {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px 20px 8px; min-height: 0;
}
.editor-wrap {
  width: 100%; max-width: 900px; height: 48vh; min-height: 270px;
  position: relative; border: 1px solid var(--panel-border); border-radius: 2px;
  overflow: hidden; background: var(--bg);
  box-shadow: 0 10px 32px rgba(0,0,0,0.16);
}
#video-layer {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  opacity: var(--video-opacity); filter: var(--video-filter);
  transition: opacity 0.3s, filter 0.3s;
}
#video-layer iframe { width: 100%; height: 100%; border: 0; }
.editor-overlay { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: var(--editor-overlay); }
#editor {
  position: relative; z-index: 2; width: 100%; height: 100%; background: transparent; color: var(--text);
  border: none; padding: 26px 32px; font-family: 'Special Elite', serif; font-size: 1.15rem;
  line-height: 1.65; resize: none; outline: none; caret-color: var(--red);
}
body.inverted #editor {
  /* Subtle drop shadow to ensure crisp readability over bright video areas */
  text-shadow: 0 1px 2px rgba(244,239,230,0.7);
}
#editor::placeholder { color: var(--text-dim); }

.marquee-wrap {
  width: 100%; max-width: 900px; height: 32px; margin-top: 10px;
  overflow: hidden; background: var(--input-bg); border: 1px solid var(--panel-border);
}
.marquee-wrap.hidden { display: none; }
.marquee { display: flex; white-space: nowrap; animation: marquee 38s linear infinite; font-size: 11px; letter-spacing: 0.1em; color: var(--grey); padding: 6px 0; }
.marquee span { padding: 0 32px; }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

/* --- MONA-STYLE INSTRUMENT DOCK --- */
.dock-chassis {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 8px 20px; background: var(--dock-bg);
  border-top: 1px solid var(--panel-border);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.18);
  font-size: 10px; letter-spacing: 0.06em;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.dock-segment { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.dock-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; background: var(--input-bg);
  border: 1px solid var(--grey-dark); border-radius: 2px;
  font-family: inherit; font-size: 9px; color: var(--grey);
  cursor: pointer; text-transform: uppercase; white-space: nowrap;
  transition: all 0.15s;
}
.dock-pill:hover { border-color: var(--red); color: var(--red); }
.dock-pill.active {
  background: var(--red); color: #ffffff !important; border-color: var(--red);
  box-shadow: 0 0 8px rgba(225,6,0,0.4);
}
.dock-pill .indicator-led {
  width: 6px; height: 6px; border-radius: 50%; background: var(--grey-dark);
}
.dock-pill.active .indicator-led {
  background: #ffffff; box-shadow: 0 0 5px #ffffff;
}

/* Telemetry Readout */
.dock-status {
  display: flex; align-items: center; gap: 12px; font-size: 9px;
  color: var(--grey); white-space: nowrap; flex-shrink: 0;
}
.dock-status .ready-badge {
  color: var(--red); font-weight: 600; padding: 2px 6px;
  border: 1px solid var(--red-dim); background: rgba(225,6,0,0.08);
}

@media (max-width: 900px) {
  body { cursor: auto; }
  #cursor-wrap { display: none !important; }
  header { padding: 12px 14px; gap: 10px; }
  .header-row.rack-shelf { flex-direction: column; align-items: flex-start; gap: 12px; }
  .rack-dials { width: 100%; justify-content: space-around; }
  .main { padding: 8px 10px; }
  .editor-wrap { height: 50vh; }
  #editor { padding: 18px 16px; font-size: 1rem; }
  .dock-chassis { padding: 8px 12px; gap: 10px; justify-content: flex-start; }
}
</style>
</head>
<body>
<div id="cursor-wrap"><div id="cursor"><span id="cursor-text">VIEW</span></div></div>

<div class="app">
  <!-- ACROHAT HARDWARE RACK HEADER -->
  <header>
    <div class="header-row">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="title">TYPEWRITER</div>
        <span class="label">// INSTRUMENT S/370</span>
        <a href="https://wordstar.nexus/acrohat" target="_blank" rel="noopener">ACROHAT&#8599;</a>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <select id="font-select" title="Font">
          <option value="'Special Elite', serif" selected>Special Elite</option>
          <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
          <option value="'VT323', monospace">VT323</option>
          <option value="'Courier Prime', monospace">Courier Prime</option>
          <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
          <option value="'Source Code Pro', monospace">Source Code Pro</option>
          <option value="'Roboto Mono', monospace">Roboto Mono</option>
          <option value="'Space Mono', monospace">Space Mono</option>
          <option value="'Fira Code', monospace">Fira Code</option>
          <option value="'EB Garamond', serif">EB Garamond</option>
          <option value="'Libre Baskerville', serif">Libre Baskerville</option>
          <option value="'Merriweather', serif">Merriweather</option>
          <option value="'Inter', sans-serif">Inter</option>
        </select>
        <select id="video-select" title="Video">
          <option value="Kz5HI-z8Nnc">Runway Stream</option>
          <option value="DB7oO82OeD4">Live Deck A</option>
          <option value="8TDmgVs6HZE">Live Deck B</option>
          <option value="7Ux4GeY5MXQ">Live Deck C</option>
          <option value="none">Video Off</option>
          <option value="custom">Custom ID…</option>
        </select>
        <input id="custom-video" placeholder="YouTube ID / URL" style="display:none">
      </div>
    </div>

    <!-- RACK SHELF: ROTARY KNOBS + IMAGE BAY -->
    <div class="header-row rack-shelf">
      <div class="rack-dials">
        <!-- Knob 1: Beam Gain / Zoom -->
        <div class="knob-pod">
          <span class="knob-label">BEAM GAIN</span>
          <div class="knob-dial" id="knob-zoom" data-min="80" data-max="150" data-val="100" data-step="1"></div>
          <span class="readout" id="readout-zoom">100%</span>
        </div>
        <!-- Knob 2: Line Pitch -->
        <div class="knob-pod">
          <span class="knob-label">LINE PITCH</span>
          <div class="knob-dial" id="knob-pitch" data-min="1.2" data-max="2.4" data-val="1.65" data-step="0.05"></div>
          <span class="readout" id="readout-pitch">1.65X</span>
        </div>
        <!-- Knob 3: Image Scale Width -->
        <div class="knob-pod">
          <span class="knob-label">IMG WIDTH</span>
          <div class="knob-dial" id="knob-img" data-min="80" data-max="360" data-val="180" data-step="5"></div>
          <span class="readout" id="readout-img">180PX</span>
        </div>
      </div>

      <div class="img-bay">
        <span class="label">IMAGE BAY</span>
        <input type="file" id="img-input" accept="image/*" hidden>
        <button id="img-upload" title="Upload Image">+</button>
        <img id="img-thumb" style="height:22px;width:22px;object-fit:cover;border:1px solid var(--grey-dark);display:none;">
        <div class="seg" id="align-seg">
          <button data-val="left">L</button>
          <button data-val="center" class="active">C</button>
          <button data-val="right">R</button>
        </div>
        <div class="seg" id="shape-seg">
          <button data-val="rect" class="active">RECT</button>
          <button data-val="circle">CIRCLE</button>

        <button id="img-insert">INSERT</button>
      </div>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="main">
    <div class="editor-wrap">
      <div id="video-layer"></div>
      <div class="editor-overlay"></div>
      <textarea id="editor" placeholder="Initialize instrument..." spellcheck="false"></textarea>
    </div>
    <div class="marquee-wrap" id="marquee-wrap"><div class="marquee" id="marquee"></div></div>
  </div>

  <!-- MONA-STYLE BOTTOM DOCK -->
  <footer class="dock-chassis">
    <!-- Telemetry -->
    <div class="dock-status">
      <span class="ready-badge" id="ready">READY</span>
      <span id="words">WORDS 0</span>
      <span id="chars">CHARS 0</span>
      <span id="lines">LN 1</span>
    </div>

    <!-- Execute controls -->
    <div class="dock-segment">
      <button class="dock-pill" id="theme-toggle">
        <span class="indicator-led"></span>
        <span id="theme-text">THEME: INVERT</span>
      </button>
      <button class="dock-pill" id="sound-toggle">
        <span class="indicator-led"></span>AUDIO: OFF
      </button>
      <button class="dock-pill active" id="marquee-toggle">
        <span class="indicator-led"></span>MARQUEE: ON
      </button>
      <button class="dock-pill" id="btn-pdf">EXPORT: PDF</button>
      <button class="dock-pill" id="btn-load">LOAD</button>
      <button class="dock-pill" id="btn-undo">UNDO</button>
      <button class="dock-pill" id="btn-clear">CLEAR</button>
      <input type="file" id="file-input" accept=".txt,.md" hidden>
    </div>
  </footer>
</div>

<script>
const { jsPDF } = window.jspdf;
const editor = document.getElementById('editor');
const marquee = document.getElementById('marquee');
const marqueeWrap = document.getElementById('marquee-wrap');
const videoSelect = document.getElementById('video-select');
const customVideo = document.getElementById('custom-video');
const videoLayer = document.getElementById('video-layer');
const fontSelect = document.getElementById('font-select');
const wordsEl = document.getElementById('words');
const charsEl = document.getElementById('chars');
const linesEl = document.getElementById('lines');
const readyEl = document.getElementById('ready');
const cursorWrap = document.getElementById('cursor-wrap');
const cursor = document.getElementById('cursor');
const cursorText = document.getElementById('cursor-text');
const imgInput = document.getElementById('img-input');
const imgThumb = document.getElementById('img-thumb');
const imgUpload = document.getElementById('img-upload');
const imgInsert = document.getElementById('img-insert');
const themeToggle = document.getElementById('theme-toggle');
const themeText = document.getElementById('theme-text');
const soundToggle = document.getElementById('sound-toggle');
const marqueeToggle = document.getElementById('marquee-toggle');

let currentImageData = null;
let imgAlign = 'center';
let imgShape = 'rect';
let currentImgWidth = 180;

const LIVE_IDS = new Set(['DB7oO82OeD4','8TDmgVs6HZE','7Ux4GeY5MXQ']);
let undoStack = [];
let soundOn = false;
let marqueeOn = true;
let audioCtx = null;

// Cursor tracking
let mouseX = -100, mouseY = -100, curX = -100, curY = -100;
function renderCursor() {
  curX += (mouseX - curX) * 0.2;
  curY += (mouseY - curY) * 0.2;
  cursorWrap.style.transform = `translate3d(${curX}px, ${curY}px, 0)`;
  requestAnimationFrame(renderCursor);
}
renderCursor();
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX; mouseY = e.clientY;
  const overEditor = !!e.target.closest('#editor, .editor-wrap');
  const interactive = e.target.closest('button, select, a, input, .seg, .knob-dial, .dock-pill');
  if (overEditor) {
    document.body.classList.add('typing');
    cursor.classList.remove('hovering');
  } else {
    document.body.classList.remove('typing');
    if (interactive) {
      cursor.classList.add('hovering');
      cursorText.textContent = 'ACT';
    } else {
      cursor.classList.remove('hovering');
    }
  }
});

// Mobile-Tested Mechanical Typewriter Sound Engine
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
// Unlock mobile audio instantly on first touch
window.addEventListener('touchstart', () => { if (soundOn) initAudio(); }, { passive: true, once: true });
window.addEventListener('pointerdown', () => { if (soundOn) initAudio(); }, { passive: true, once: true });

function playClick() {
  if (!soundOn) return;
  initAudio();
  if (!audioCtx || audioCtx.state === 'suspended') return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  // Dual-frequency mechanical punch: sweeps from 820Hz down to 110Hz in 25ms
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(820 + Math.random() * 120, now);
  osc.frequency.exponentialRampToValueAtTime(110, now + 0.024);

  gain.gain.setValueAtTime(0.22, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.03);
}

function playKnobTick() {
  initAudio();
  if (!audioCtx || audioCtx.state === 'suspended') return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1400 + Math.random() * 200, now);
  gain.gain.setValueAtTime(0.05, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.012);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.015);
}

// Inverted Theme (Saved in localStorage, prominently in Mona Dock)
function setTheme(isInverted) {
  document.body.classList.toggle('inverted', isInverted);
  themeText.textContent = isInverted ? 'THEME: DARK' : 'THEME: INVERT';
  themeToggle.classList.toggle('active', isInverted);
  localStorage.setItem('typewriter_theme', isInverted ? 'inverted' : 'dark');
}
themeToggle.onclick = () => {
  const isInverted = !document.body.classList.contains('inverted');
  setTheme(isInverted);
};
if (localStorage.getItem('typewriter_theme') === 'inverted') {
  setTheme(true);
}

// Acrohat Rotary Knobs Engine
function setupKnob(elId, readoutId, unit, onChange) {
  const dial = document.getElementById(elId);
  const readout = document.getElementById(readoutId);
  const min = parseFloat(dial.dataset.min);
  const max = parseFloat(dial.dataset.max);
  const step = parseFloat(dial.dataset.step) || 1;
  let val = parseFloat(dial.dataset.val);

  function updateVisual(playTick = false) {
    const fraction = (val - min) / (max - min);
    const deg = -135 + fraction * 270;
    dial.style.transform = `rotate(${deg}deg)`;
    readout.textContent = (step < 1 ? val.toFixed(2) : Math.round(val)) + unit;
    if (playTick) playKnobTick();
    onChange(val);
  }

  let startY = 0, startVal = 0, isDragging = false;
  dial.addEventListener('pointerdown', (e) => {
    isDragging = true;
    startY = e.clientY;
    startVal = val;
    dial.classList.add('active');
    dial.setPointerCapture(e.pointerId);
  });

  dial.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dy = startY - e.clientY;
    const range = max - min;
    const rawVal = startVal + (dy / 140) * range;
    let clamped = Math.min(max, Math.max(min, rawVal));
    clamped = Math.round(clamped / step) * step;
    if (clamped !== val) {
      val = clamped;
      updateVisual(true);
    }
  });

  const stop = () => { isDragging = false; dial.classList.remove('active'); };
  dial.addEventListener('pointerup', stop);
  dial.addEventListener('pointercancel', stop);

  updateVisual(false);
}

// Initialize the 3 hardware dials
setupKnob('knob-zoom', 'readout-zoom', '%', (v) => {
  editor.style.fontSize = `${(v / 100) * 1.15}rem`;
});
setupKnob('knob-pitch', 'readout-pitch', 'X', (v) => {
  editor.style.lineHeight = v;
});
setupKnob('knob-img', 'readout-img', 'PX', (v) => {
  currentImgWidth = Math.round(v);
});

// Video Background
function extractId(val) {
  if (!val) return '';
  const m = val.trim().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|live\/)|[?&]v=)([\w-]{11})/);
  if (m) return m[1];
  const cleaned = val.trim();
  return /^[a-zA-Z0-9_-]{11}$/.test(cleaned) ? cleaned : '';
}
function setVideo(id) {
  if (!id || id === 'none') { videoLayer.innerHTML = ''; return; }
  const isLive = LIVE_IDS.has(id);
  const params = isLive
    ? 'autoplay=1&mute=1&controls=0&playsinline=1&modestbranding=1&showinfo=0'
    : `autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&playsinline=1&modestbranding=1&showinfo=0`;
  videoLayer.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?${params}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
}
videoSelect.addEventListener('change', () => {
  const v = videoSelect.value;
  customVideo.style.display = v === 'custom' ? 'inline-block' : 'none';
  if (v !== 'custom') setVideo(v);
});
customVideo.addEventListener('change', () => setVideo(extractId(customVideo.value)));
customVideo.addEventListener('keydown', (e) => { if (e.key === 'Enter') setVideo(extractId(customVideo.value)); });
setVideo(videoSelect.value);

// Image Bay & Segments
imgUpload.onclick = () => imgInput.click();
imgInput.onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    currentImageData = r.result;
    imgThumb.src = currentImageData;
    imgThumb.style.display = 'inline-block';
  };
  r.readAsDataURL(f);
};
document.getElementById('align-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  imgAlign = btn.dataset.val;
  document.querySelectorAll('#align-seg button').forEach(b => b.classList.toggle('active', b === btn));
});
document.getElementById('shape-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  imgShape = btn.dataset.val;
  document.querySelectorAll('#shape-seg button').forEach(b => b.classList.toggle('active', b === btn));
});
imgInsert.onclick = () => {
  if (!currentImageData) { alert('Upload an image first.'); return; }
  const marker = '{{IMG}}';
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const val = editor.value;
  editor.value = val.slice(0, start) + marker + val.slice(end);
  editor.selectionStart = editor.selectionEnd = start + marker.length;
  editor.focus();
  updateStatus(); scheduleMarquee(); save(); pushUndo(true);
};

// Font
fontSelect.addEventListener('change', () => { editor.style.fontFamily = fontSelect.value; });
editor.style.fontFamily = fontSelect.value;

// Marquee Engine
let marqueeTimer = null;
function updateMarquee() {
  if (!marqueeOn) return;
  const text = editor.value.trim();
  if (!text) { marquee.innerHTML = '<span>— silence —</span><span>— silence —</span>'; return; }
  const words = text.split(/\s+/).slice(-40);
  const reversed = words.reverse().join('  ·  ');
  const display = reversed + '     ' + reversed;
  marquee.innerHTML = `<span>${display}</span><span>${display}</span>`;
}
function scheduleMarquee() { clearTimeout(marqueeTimer); marqueeTimer = setTimeout(updateMarquee, 180); }
marqueeToggle.onclick = () => {
  marqueeOn = !marqueeOn;
  marqueeWrap.classList.toggle('hidden', !marqueeOn);
  marqueeToggle.classList.toggle('active', marqueeOn);
  marqueeToggle.innerHTML = `<span class="indicator-led"></span>MARQUEE: ${marqueeOn ? 'ON' : 'OFF'}`;
  if (marqueeOn) updateMarquee();
};

// Sound toggle
soundToggle.onclick = () => {
  soundOn = !soundOn;
  soundToggle.classList.toggle('active', soundOn);
  soundToggle.innerHTML = `<span class="indicator-led"></span>AUDIO: ${soundOn ? 'ON' : 'OFF'}`;
  if (soundOn) initAudio();
};

// Telemetry Status
function updateStatus() {
  const t = editor.value;
  const w = t.trim() ? t.trim().split(/\s+/).length : 0;
  wordsEl.textContent = `WORDS ${w}`;
  charsEl.textContent = `CHARS ${t.length}`;
  linesEl.textContent = `LN ${t.split('\n').length}`;
  readyEl.textContent = t.length ? 'WRITING' : 'READY';
}

// Undo Engine
let undoTimer = null;
function pushUndo(force = false) {
  const v = editor.value;
  if (force) {
    if (undoStack[undoStack.length - 1] !== v) undoStack.push(v);
    if (undoStack.length > 50) undoStack.shift();
    return;
  }
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    if (undoStack[undoStack.length - 1] !== v) undoStack.push(v);
    if (undoStack.length > 50) undoStack.shift();
  }, 400);
}
document.getElementById('btn-undo').onclick = () => {
  if (undoStack.length > 1) {
    undoStack.pop();
    editor.value = undoStack[undoStack.length - 1] || '';
    updateStatus(); scheduleMarquee(); save();
  }
};

// Persistence via LocalStorage
function save() {
  localStorage.setItem('typewriter_text', editor.value);
}
function load() {
  const saved = localStorage.getItem('typewriter_text');
  if (saved) editor.value = saved;
  updateStatus(); updateMarquee(); pushUndo(true);
}

// PDF Export & File Loading
document.getElementById('btn-load').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { editor.value = r.result; updateStatus(); scheduleMarquee(); save(); pushUndo(true); };
  r.readAsText(f);
};
document.getElementById('btn-pdf').onclick = () => {
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const text = editor.value || ' ';
  const margin = 54;
  const maxWidth = 504;
  const pageHeight = 720;
  let y = margin;
  doc.setFont('courier', 'normal');
  doc.setFontSize(11);
  const width = currentImgWidth || 180;

  const parts = text.split('{{IMG}}');
  parts.forEach((part, idx) => {
    if (part) {
      const lines = doc.splitTextToSize(part, maxWidth);
      lines.forEach(line => {
        if (y > pageHeight) { doc.addPage(); y = margin; }
        doc.text(line, margin, y);
        y += 16;
      });
    }
    if (idx < parts.length - 1 && currentImageData) {
      const h = imgShape === 'circle' ? width : width * 0.75;
      if (y + h > pageHeight) { doc.addPage(); y = margin; }
      let x = margin;
      if (imgAlign === 'center') x = (612 - width) / 2;
      if (imgAlign === 'right') x = 612 - margin - width;
      try {
        const isPng = currentImageData.startsWith('data:image/png');
        doc.addImage(currentImageData, isPng ? 'PNG' : 'JPEG', x, y, width, h);
        y += h + 12;
      } catch (err) {
        doc.text('[image]', x, y);
        y += 16;
      }
    }
  });
  doc.save('typewriter.pdf');
};
document.getElementById('btn-clear').onclick = () => {
  if (confirm('Clear current sheet?')) {
    editor.value = '';
    updateStatus(); scheduleMarquee(); save(); pushUndo(true);
  }
};

editor.addEventListener('input', () => {
  updateStatus(); scheduleMarquee(); save(); pushUndo();
  if (soundOn) playClick();
});
editor.addEventListener('focus', () => document.body.classList.add('typing'));
editor.addEventListener('blur', () => document.body.classList.remove('typing'));

editor.addEventListener('dragover', (e) => e.preventDefault());
editor.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && (f.type.startsWith('text') || f.name.endsWith('.txt') || f.name.endsWith('.md'))) {
    const r = new FileReader();
    r.onload = () => { editor.value = r.result; updateStatus(); scheduleMarquee(); save(); pushUndo(true); };
    r.readAsText(f);
  }
});

load();
</script>
</body>
</html>
