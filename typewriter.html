<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://wordstar.nexus/svg/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="https://wordstar.nexus/svg/favicon.svg" />
<link rel="shortcut icon" href="https://wordstar.nexus/svg/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="https://wordstar.nexus/svg/apple-touch-icon.png" />
<title>TYPEWRITER</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500&family=Courier+Prime&family=VT323&family=JetBrains+Mono&family=Source+Code+Pro&family=Roboto+Mono&family=Space+Mono&family=Fira+Code&family=EB+Garamond&family=Libre+Baskerville&family=Merriweather&family=Inter&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #0a0a0a; --panel: #111; --red: #e10600; --red-dim: #8a0400;
  --white: #e8e8e8; --grey: #888; --grey-dark: #333; --yellow: #e6c200;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--white); font-family: 'IBM Plex Mono', monospace; overflow: hidden; }
body { display: flex; flex-direction: column; cursor: none; }

#cursor-wrap {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
  mix-blend-mode: difference; display: flex; align-items: center; justify-content: center;
  transform: translate(-50%, -50%);
}
#cursor {
  width: 56px; height: 56px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 10px rgba(255,255,255,0.3);
  transition: transform 0.16s cubic-bezier(0.16,1,0.3,1), opacity 0.15s;
  display: flex; align-items: center; justify-content: center;
}
#cursor.hovering { transform: scale(1.45); }
#cursor-text {
  color: #000; font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  opacity: 0; transition: opacity 0.12s;
}
#cursor.hovering #cursor-text { opacity: 1; }
body.typing #cursor-wrap { opacity: 0; pointer-events: none; }

header {
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px 18px 10px; background: rgba(0,0,0,0.88); border-bottom: 1px solid var(--grey-dark);
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
}
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.header-row.controls { justify-content: flex-start; gap: 8px; }
header .title { color: var(--red); font-weight: 500; font-size: 13px; letter-spacing: 0.14em; }
header .label { color: var(--grey); font-size: 9px; }
header select, header button, header input[type="text"] {
  background: #000; color: var(--white); border: 1px solid var(--grey-dark);
  padding: 4px 8px; font-size: 10px; font-family: inherit; cursor: pointer;
}
header input[type="text"] { width: 130px; cursor: text; }
header button:hover, header select:hover { border-color: var(--red); color: var(--red); }
header a { color: var(--grey); text-decoration: none; font-size: 9px; letter-spacing: 0.1em; }
header a:hover { color: var(--red); }

.img-bay { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.knob {
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 8px; color: var(--grey);
}
.knob input[type="range"] {
  -webkit-appearance: none; width: 52px; height: 4px; background: #222; border-radius: 2px; outline: none;
}
.knob input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--red); cursor: pointer;
}
.seg { display: flex; border: 1px solid var(--grey-dark); }
.seg button { border: none; border-right: 1px solid var(--grey-dark); padding: 3px 7px; background: #000; color: var(--grey); }
.seg button:last-child { border-right: none; }
.seg button.active { background: var(--red); color: #000; }

.app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
.main { flex: 1; display: flex; flex-direction: column; padding: 14px 18px 8px; min-height: 0; }

.editor-wrap {
  flex: 1; position: relative; min-height: 0; border: 1px solid var(--grey-dark); border-radius: 2px;
  overflow: hidden; background: #000;
}
#video-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.35; filter: grayscale(0.35) contrast(1.05); }
#video-layer iframe { width: 100%; height: 100%; border: 0; }
.editor-overlay { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0.65)); }
#editor {
  position: relative; z-index: 2; width: 100%; height: 100%; background: transparent; color: var(--white);
  border: none; padding: 26px 30px; font-family: 'Special Elite', serif; font-size: 1.12rem;
  line-height: 1.65; resize: none; outline: none; caret-color: var(--red);
}
#editor::placeholder { color: #555; }

.marquee-wrap { height: 34px; margin-top: 8px; overflow: hidden; background: #000; border: 1px solid var(--grey-dark); }
.marquee-wrap.hidden { display: none; }
.marquee { display: flex; white-space: nowrap; animation: marquee 40s linear infinite; font-size: 12px; letter-spacing: 0.1em; color: var(--grey); padding: 7px 0; }
.marquee span { padding: 0 36px; }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 18px; background: rgba(0,0,0,0.92); border-top: 1px solid var(--grey-dark);
  font-size: 10px; letter-spacing: 0.05em; color: var(--grey);
}
footer .status span { margin-right: 14px; }
footer .status .ready { color: var(--red); }
footer button {
  background: transparent; border: 1px solid var(--grey-dark); color: var(--grey);
  padding: 4px 9px; font-size: 9px; font-family: inherit; cursor: pointer; margin-left: 5px;
}
footer button:hover { border-color: var(--red); color: var(--red); }

@media (max-width: 800px) {
  body { cursor: auto; }
  #cursor-wrap { display: none !important; }
  header { padding: 10px 12px; }
  .header-row { gap: 8px; }
  .main { padding: 10px 12px 6px; }
  #editor { padding: 16px 16px; font-size: 1rem; }
  footer { flex-wrap: wrap; gap: 4px; }
  header input[type="text"] { width: 110px; }
}
</style>
</head>
<body>
<div id="cursor-wrap"><div id="cursor"><span id="cursor-text">VIEW</span></div></div>

<div class="app">
  <header>
    <div class="header-row">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="title">TYPEWRITER</div>
        <span class="label">// INSTRUMENT</span>
        <a href="https://wordstar.nexus/acrohat" target="_blank" rel="noopener" data-hover>ACROHAT&#8599;</a>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <select id="font-select" title="Font">
          <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
          <option value="'VT323', monospace">VT323</option>
          <option value="'Courier Prime', monospace">Courier Prime</option>
          <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
          <option value="'Source Code Pro', monospace">Source Code Pro</option>
          <option value="'Roboto Mono', monospace">Roboto Mono</option>
          <option value="'Space Mono', monospace">Space Mono</option>
          <option value="'Fira Code', monospace">Fira Code</option>
          <option value="'EB Garamond', serif">EB Garamond</option>
          <option value="'Libre Baskerville', serif">Libre Baskerville</option>
          <option value="'Merriweather', serif">Merriweather</option>
          <option value="'Inter', sans-serif">Inter</option>
          <option value="'Special Elite', serif">Special Elite</option>
        </select>
        <select id="video-select" title="Video">
          <option value="Kz5HI-z8Nnc">Default runway</option>
          <option value="DB7oO82OeD4">Live A</option>
          <option value="8TDmgVs6HZE">Live B</option>
          <option value="7Ux4GeY5MXQ">Live C</option>
          <option value="none">Off</option>
          <option value="custom">Custom…</option>
        </select>
        <input id="custom-video" placeholder="YouTube ID or URL" style="display:none">
        <button id="marquee-toggle">MARQUEE</button>
        <button id="sound-toggle">SOUND</button>
      </div>
    </div>

    <div class="header-row controls">
      <div class="img-bay">
        <span class="label">IMG</span>
        <input type="file" id="img-input" accept="image/*" hidden>
        <button id="img-upload" title="Upload">+</button>
        <img id="img-thumb" style="height:20px;width:20px;object-fit:cover;border:1px solid var(--grey-dark);display:none;">
        <div class="knob"><span>W</span><input type="range" id="img-width" min="80" max="360" value="180" step="20"></div>
        <div class="seg" id="align-seg">
          <button data-val="left">L</button>
          <button data-val="center" class="active">C</button>
          <button data-val="right">R</button>
        </div>
        <div class="seg" id="shape-seg">
          <button data-val="rect" class="active">RECT</button>
          <button data-val="circle">CIRCLE</button>
        </div>
        <button id="img-insert">INSERT</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="editor-wrap">
      <div id="video-layer"></div>
      <div class="editor-overlay"></div>
      <textarea id="editor" placeholder="Begin..." spellcheck="false"></textarea>
    </div>
    <div class="marquee-wrap" id="marquee-wrap"><div class="marquee" id="marquee"></div></div>
  </div>

  <footer>
    <div class="status">
      <span class="ready" id="ready">READY</span>
      <span id="words">WORDS 0</span>
      <span id="chars">CHARS 0</span>
      <span id="lines">LINES 1</span>
    </div>
    <div>
      <button id="btn-load">LOAD</button>
      <button id="btn-pdf">PDF</button>
      <button id="btn-undo">UNDO</button>
      <button id="btn-clear">CLEAR</button>
      <input type="file" id="file-input" accept=".txt,.md" hidden>
    </div>
  </footer>
</div>

<script>
const { jsPDF } = window.jspdf;
const editor = document.getElementById('editor');
const marquee = document.getElementById('marquee');
const marqueeWrap = document.getElementById('marquee-wrap');
const videoSelect = document.getElementById('video-select');
const customVideo = document.getElementById('custom-video');
const videoLayer = document.getElementById('video-layer');
const fontSelect = document.getElementById('font-select');
const wordsEl = document.getElementById('words');
const charsEl = document.getElementById('chars');
const linesEl = document.getElementById('lines');
const readyEl = document.getElementById('ready');
const cursorWrap = document.getElementById('cursor-wrap');
const cursor = document.getElementById('cursor');
const cursorText = document.getElementById('cursor-text');
const imgInput = document.getElementById('img-input');
const imgThumb = document.getElementById('img-thumb');
const imgUpload = document.getElementById('img-upload');
const imgInsert = document.getElementById('img-insert');
const imgWidth = document.getElementById('img-width');

let currentImageData = null;
let imgAlign = 'center';
let imgShape = 'rect';

const LIVE_IDS = new Set(['DB7oO82OeD4','8TDmgVs6HZE','7Ux4GeY5MXQ']);
let undoStack = [];
let soundOn = false;
let marqueeOn = true;
let audioCtx;

// Cursor — only activates on true interactive targets, fully hides over editor
let mouseX = -100, mouseY = -100, curX = -100, curY = -100;
function renderCursor() {
  curX += (mouseX - curX) * 0.2;
  curY += (mouseY - curY) * 0.2;
  cursorWrap.style.transform = `translate3d(${curX}px, ${curY}px, 0)`;
  requestAnimationFrame(renderCursor);
}
renderCursor();
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  const overEditor = !!e.target.closest('#editor, .editor-wrap');
  const interactive = e.target.closest('button, select, a, input, .seg, .knob');
  if (overEditor) {
    document.body.classList.add('typing');
    cursor.classList.remove('hovering');
  } else {
    document.body.classList.remove('typing');
    if (interactive) {
      cursor.classList.add('hovering');
      cursorText.textContent = 'VIEW';
    } else {
      cursor.classList.remove('hovering');
    }
  }
});

// Video
function extractId(val) {
  if (!val) return '';
  const m = val.trim().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|live\/)|[?&]v=)([\w-]{11})/);
  return m ? m[1] : val.trim().slice(0, 11);
}
function setVideo(id) {
  if (!id || id === 'none') { videoLayer.innerHTML = ''; return; }
  const isLive = LIVE_IDS.has(id);
  const params = isLive
    ? 'autoplay=1&mute=1&controls=0&playsinline=1&modestbranding=1&showinfo=0'
    : `autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&playsinline=1&modestbranding=1&showinfo=0`;
  videoLayer.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?${params}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
}
videoSelect.addEventListener('change', () => {
  const v = videoSelect.value;
  customVideo.style.display = v === 'custom' ? 'inline-block' : 'none';
  if (v !== 'custom') setVideo(v);
});
customVideo.addEventListener('change', () => setVideo(extractId(customVideo.value)));
customVideo.addEventListener('keydown', (e) => { if (e.key === 'Enter') setVideo(extractId(customVideo.value)); });
setVideo(videoSelect.value);

// Image bay — knobs / segments
imgUpload.onclick = () => imgInput.click();
imgInput.onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    currentImageData = r.result;
    imgThumb.src = currentImageData;
    imgThumb.style.display = 'inline-block';
  };
  r.readAsDataURL(f);
};
document.getElementById('align-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  imgAlign = btn.dataset.val;
  document.querySelectorAll('#align-seg button').forEach(b => b.classList.toggle('active', b === btn));
});
document.getElementById('shape-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  imgShape = btn.dataset.val;
  document.querySelectorAll('#shape-seg button').forEach(b => b.classList.toggle('active', b === btn));
});
imgInsert.onclick = () => {
  if (!currentImageData) { alert('Upload an image first.'); return; }
  const marker = '{{IMG}}';
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const val = editor.value;
  editor.value = val.slice(0, start) + marker + val.slice(end);
  editor.selectionStart = editor.selectionEnd = start + marker.length;
  editor.focus();
  updateStatus(); scheduleMarquee(); save(); pushUndo();
};

// Font
fontSelect.addEventListener('change', () => { editor.style.fontFamily = fontSelect.value; });

// Marquee
let marqueeTimer = null;
function updateMarquee() {
  if (!marqueeOn) return;
  const text = editor.value.trim();
  if (!text) { marquee.innerHTML = '<span>— silence —</span><span>— silence —</span>'; return; }
  const words = text.split(/\s+/).slice(-40);
  const reversed = words.reverse().join('  ·  ');
  const display = reversed + '     ' + reversed;
  marquee.innerHTML = `<span>${display}</span><span>${display}</span>`;
}
function scheduleMarquee() { clearTimeout(marqueeTimer); marqueeTimer = setTimeout(updateMarquee, 180); }
document.getElementById('marquee-toggle').onclick = () => {
  marqueeOn = !marqueeOn;
  marqueeWrap.classList.toggle('hidden', !marqueeOn);
  if (marqueeOn) updateMarquee();
};

// Status
function updateStatus() {
  const t = editor.value;
  const w = t.trim() ? t.trim().split(/\s+/).length : 0;
  wordsEl.textContent = `WORDS ${w}`;
  charsEl.textContent = `CHARS ${t.length}`;
  linesEl.textContent = `LINES ${t.split('\n').length}`;
  readyEl.textContent = t.length ? 'WRITING' : 'READY';
}

// Undo
function pushUndo() {
  const v = editor.value;
  if (undoStack[undoStack.length - 1] !== v) undoStack.push(v);
  if (undoStack.length > 60) undoStack.shift();
}
document.getElementById('btn-undo').onclick = () => {
  if (undoStack.length > 1) {
    undoStack.pop();
    editor.value = undoStack[undoStack.length - 1] || '';
    updateStatus(); scheduleMarquee(); save();
  }
};

// Persistence
function save() {
  localStorage.setItem('typewriter_text', editor.value);
  try {
    const hash = '#' + encodeURIComponent(editor.value.slice(0, 1800));
    if (location.hash !== hash) history.replaceState(null, '', hash);
  } catch (e) {}
}
function load() {
  const fromHash = location.hash.slice(1);
  if (fromHash) { try { editor.value = decodeURIComponent(fromHash); } catch (e) {} }
  else { const saved = localStorage.getItem('typewriter_text'); if (saved) editor.value = saved; }
  updateStatus(); updateMarquee(); pushUndo();
}

// File & PDF
document.getElementById('btn-load').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { editor.value = r.result; updateStatus(); scheduleMarquee(); save(); pushUndo(); };
  r.readAsText(f);
};
document.getElementById('btn-pdf').onclick = () => {
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const text = editor.value || ' ';
  const margin = 54;
  const maxWidth = 504;
  const pageHeight = 720;
  let y = margin;
  doc.setFont('courier', 'normal');
  doc.setFontSize(11);
  const width = parseInt(imgWidth.value) || 180;

  const parts = text.split('{{IMG}}');
  parts.forEach((part, idx) => {
    if (part) {
      const lines = doc.splitTextToSize(part, maxWidth);
      lines.forEach(line => {
        if (y > pageHeight) { doc.addPage(); y = margin; }
        doc.text(line, margin, y);
        y += 16;
      });
    }
    if (idx < parts.length - 1 && currentImageData) {
      if (y + width > pageHeight) { doc.addPage(); y = margin; }
      let x = margin;
      if (imgAlign === 'center') x = (612 - width) / 2;
      if (imgAlign === 'right') x = 612 - margin - width;
      try {
        const h = imgShape === 'circle' ? width : width * 0.75;
        doc.addImage(currentImageData, 'JPEG', x, y, width, h);
        y += h + 12;
      } catch (err) {
        doc.text('[image]', x, y);
        y += 16;
      }
    }
  });
  doc.save('typewriter.pdf');
};
document.getElementById('btn-clear').onclick = () => {
  if (confirm('Clear the page?')) {
    editor.value = '';
    updateStatus(); scheduleMarquee(); save(); pushUndo();
  }
};

// Sound
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playClick() {
  if (!soundOn || !audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(180 + Math.random() * 40, audioCtx.currentTime);
  g.gain.setValueAtTime(0.04, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.05);
}
document.getElementById('sound-toggle').onclick = () => {
  soundOn = !soundOn;
  document.getElementById('sound-toggle').style.color = soundOn ? 'var(--red)' : '';
  document.getElementById('sound-toggle').style.borderColor = soundOn ? 'var(--red)' : '';
  if (soundOn) initAudio();
};

editor.addEventListener('input', () => { updateStatus(); scheduleMarquee(); save(); pushUndo(); if (soundOn) playClick(); });
editor.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); document.getElementById('btn-undo').click(); }
});
editor.addEventListener('focus', () => document.body.classList.add('typing'));
editor.addEventListener('blur', () => document.body.classList.remove('typing'));

editor.addEventListener('dragover', (e) => e.preventDefault());
editor.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && (f.type.startsWith('text') || f.name.endsWith('.txt') || f.name.endsWith('.md'))) {
    const r = new FileReader();
    r.onload = () => { editor.value = r.result; updateStatus(); scheduleMarquee(); save(); pushUndo(); };
    r.readAsText(f);
  }
});

load();
window.addEventListener('hashchange', load);
</script>
</body>
</html>
