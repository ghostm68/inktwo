<style>
/* Load Both Custom Fonts safely via jsDelivr */
@font-face {
  font-family: 'Inkrealm';
  src: url('https://cdn.jsdelivr.net/gh/ghostm68/inktwo@main/fonts/Inkrealm-Regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'WordStar';
  src: url('https://cdn.jsdelivr.net/gh/ghostm68/eg@main/fonts/wordstar-regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg-color: #050505;
  --bg-card: rgba(5, 5, 5, 0.9);
  --primary: #ff0000;
  --primary-dim: #aa0000;
  --secondary: #550000;
  --text-main: #e8e0cc;
  --text-dim: #a89f8a;
  --line: rgba(232, 224, 204, 0.28);
  --line-soft: rgba(232, 224, 204, 0.14);
  --font-serif: Georgia, "Times New Roman", serif;
  --font-sans: "Avenir Next", "Segoe UI", sans-serif;
  
  /* Fallback initialized to Inkrealm */
  --font-mono: 'Inkrealm', "Courier New", "Courier Prime", monospace;
  
  --selection-bg: #ff0033;
  --selection-color: #0a0a0a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--selection-bg); color: var(--selection-color); text-shadow: none; }

body {
  background: var(--bg-color);
  color: var(--text-main);
  font-family: var(--font-sans);
  overflow: hidden;
  width: 100vw; height: 100vh;
}

#canvas-container {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
}

#ui-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
  pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
}
#ui-layer > * { pointer-events: auto; }

/* HUD Title */
.hud-title {
  position: absolute; top: 22px; left: 26px; pointer-events: none;
}
.hud-title h1 {
  font-family: var(--font-serif); font-weight: 400; font-size: 21px;
  letter-spacing: 0.24em; margin: 0; color: var(--text-main);
}
.hud-title .subtitle {
  margin: 5px 0 0; font-size: 11.5px; letter-spacing: 0.12em; color: var(--text-dim);
}
.hud-title .tagline {
  margin: 14px 0 0; font-size: 11px; line-height: 1.75;
  letter-spacing: 0.06em; color: rgba(232,224,204,0.5);
}

/* Camera Indicator */
#cam-indicator {
  position: absolute; top: 22px; right: 26px;
  border: 1px solid var(--line-soft); background: var(--bg-card);
  backdrop-filter: blur(8px); padding: 7px 16px;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--primary); font-family: var(--font-sans);
}

/* Stats Panel */
#stats-panel {
  position: absolute; top: 70px; right: 26px;
  border: 1px solid var(--line-soft); background: var(--bg-card);
  backdrop-filter: blur(8px); padding: 12px 16px;
  font-family: "Courier New", monospace; font-size: 11px;
  line-height: 1.7; letter-spacing: 0.08em;
  min-width: 140px; color: var(--text-dim);
  z-index: 20;
}
.stat-row { display: flex; justify-content: space-between; gap: 20px; }
.stat-value { color: var(--text-main); }

/* Interactive Manuscript Side Panel - Float Right below stats panel */
#manuscript-panel {
  position: fixed; 
  top: 165px; 
  right: -420px; 
  left: auto;
  width: 360px; 
  height: calc(100% - 187px); 
  background: var(--bg-card); 
  border: 1px solid var(--line);
  backdrop-filter: blur(12px); 
  z-index: 15;
  transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; 
  flex-direction: column; 
  padding: 22px;
  pointer-events: auto;
  box-shadow: -10px 10px 30px rgba(0,0,0,0.5);
}
#manuscript-panel.open {
  right: 26px; 
}
.panel-header {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--line-soft); padding-bottom: 12px;
  margin-bottom: 16px;
}
.panel-header h2 {
  font-family: var(--font-serif); font-size: 15px; letter-spacing: 0.15em;
  color: var(--text-main); font-weight: 400; text-transform: uppercase;
}
#manuscript-textarea {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text-main); font-family: var(--font-mono);
  font-size: 15px; line-height: 1.75; resize: none;
  letter-spacing: 0.02em;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  transition: font-family 0.15s ease;
}

/* Control Desk Toolbar */
#control-desk {
  position: absolute; left: 26px; bottom: 22px;
  border: 1px solid var(--line-soft); background: var(--bg-card);
  backdrop-filter: blur(8px); padding: 10px 14px 8px;
  display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center;
  max-width: min(92vw, 550px);
}

.desk-btn {
  -webkit-appearance: none; appearance: none;
  background: transparent; border: 1px solid var(--line);
  color: var(--text-main); font-family: var(--font-sans);
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 7px 12px; cursor: pointer; transition: all 0.15s;
}
.desk-btn:hover:not(:disabled), .desk-btn:focus-visible {
  border-color: var(--text-main); outline: none;
}
.desk-btn:disabled { opacity: 0.35; cursor: default; }
.desk-btn.on { background: rgba(232, 224, 204, 0.14); }
.desk-btn.accent { border-color: #b08d57; color: #b08d57; }
.desk-btn.accent:hover:not(:disabled) { background: rgba(176,141,87,0.12); }
.desk-btn.danger { border-color: rgba(190,110,80,0.6); color: #be6e50; }
.desk-btn.seg { border-right-width: 0; }
.desk-btn.seg:last-child { border-right-width: 1px; }

.desk-sep { width: 1px; height: 24px; background: var(--line-soft); margin: 0 2px; }

.section-label {
  font-size: 8.5px; letter-spacing: 0.22em; color: var(--text-dim);
  user-select: none; width: 100%; margin-bottom: 2px;
}
.panel-section {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
}
.panel-section + .panel-section {
  border-left: 1px solid var(--line-soft); padding-left: 14px;
}

/* Mobile Tap Zone */
#tap-zone {
  position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
  width: 260px; height: 50px; z-index: 5;
  border: 1px dashed var(--line-soft); border-radius: 2px;
  display: none; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  pointer-events: auto; cursor: text; background: rgba(5,5,5,0.4);
}

/* --- MOBILE SPECIFIC STYLING --- */
@media (max-width: 768px) {
  #tap-zone { display: flex; }
  
  /* Horizontal Touch-Scroll Toolbar */
  #control-desk {
    left: 10px; right: 10px; bottom: 10px;
    max-width: none;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch; /* Momentum scrolling on iOS */
    padding: 10px 14px;
    gap: 12px;
  }
  .desk-sep { display: none; } 
  .panel-section {
    flex-wrap: nowrap;
    flex-shrink: 0;
    border-left: none !important;
    padding-left: 0 !important;
  }
  .section-label { font-size: 7.5px; }

  .hud-title .tagline { display: none; }
  #stats-panel { top: 60px; right: 10px; }
  #cam-indicator { top: 10px; right: 10px; }
  .hud-title { top: 10px; left: 10px; }
  .hud-title h1 { font-size: 16px; }
  
  /* Slide-up mobile overlay panel */
  #manuscript-panel {
    top: 150px;
    right: -100%;
    width: calc(100% - 20px);
    height: calc(100% - 260px); /* Leave clean clearance for the scrollable toolbar */
    z-index: 25;
  }
  #manuscript-panel.open {
    right: 10px;
  }
}

/* Recovery Modal */
#recovery-modal {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(7,6,5,0.88); z-index: 100;
  display: none; align-items: center; justify-content: center;
}
#recovery-box {
  border: 1px solid var(--line); background: #0b0a08;
  padding: 28px 32px; max-width: 380px; text-align: center;
}
#recovery-box h2 {
  font-family: var(--font-serif); font-weight: 400; font-size: 18px;
  margin-bottom: 10px; color: var(--primary); letter-spacing: 0.08em;
}
#recovery-box p {
  font-size: 12px; color: var(--text-dim); margin-bottom: 18px;
  line-height: 1.6; letter-spacing: 0.04em;
}

/* Toast */
#toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  border: 1px solid var(--line); background: var(--bg-card);
  backdrop-filter: blur(8px); padding: 8px 18px;
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-main); opacity: 0; transition: all 0.25s;
  pointer-events: none; z-index: 50;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Scanlines */
#scanlines {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,0,0,0.04) 2px, rgba(255,0,0,0.04) 4px);
  opacity: 0.35;
}

/* Print content */
#print-content { display: none; }
@media print {
  body * { visibility: hidden !important; }
  #print-content, #print-content * { visibility: visible !important; }
  #print-content {
    position: absolute; left: 0; top: 0; width: 100%; display: block !important;
    background: #fffef8 !important; color: #1a1a1a !important;
    padding: 60px; font-family: "WordStar", monospace !important;
    font-size: 12pt; line-height: 1.6; white-space: pre-wrap;
  }
}
</style>

<body>

<div id="canvas-container"></div>
<div id="scanlines"></div>

<!-- Side Panel Manuscript view - Positioned Float-Right -->
<div id="manuscript-panel" aria-label="Manuscript Panel">
  <div class="panel-header">
    <h2>Manuscript</h2>
  </div>
  <textarea id="manuscript-textarea" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Type here or directly on the typewriter..."></textarea>
</div>

<div id="ui-layer">
  <div class="hud-title">
    <h1>IRONCLAD</h1>
    <div class="subtitle">IMMERSIVE 3D MECHANICAL</div>
    <div class="tagline">Type anywhere. The machine listens.<br>Mouse to orbit in INSPECT mode.</div>
  </div>

  <div id="cam-indicator" role="status" aria-live="polite">WRITE</div>

  <div id="stats-panel" role="complementary" aria-label="Document Statistics">
    <div class="stat-row"><span>WORDS</span><span class="stat-value" id="stat-words">0</span></div>
    <div class="stat-row"><span>PAGES</span><span class="stat-value" id="stat-pages">1</span></div>
    <div class="stat-row"><span>LINES</span><span class="stat-value" id="stat-lines">1</span></div>
    <div class="stat-row"><span>COL</span><span class="stat-value" id="stat-col">1</span></div>
  </div>

  <div id="tap-zone" role="button" aria-label="Tap to open keyboard">TAP TO TYPE</div>

  <div id="control-desk" role="toolbar" aria-label="Typewriter Controls">
    <div class="panel-section">
      <div class="section-label">SOUND</div>
      <button class="desk-btn on" id="btn-sound">ON</button>
    </div>
    <div class="desk-sep"></div>
    <div class="panel-section">
      <div class="section-label">OPTIONS</div>
      <button class="desk-btn" id="btn-unicode">UNICODE</button>
      <button class="desk-btn" id="btn-panel">PANEL</button>
      <button class="desk-btn" id="btn-font">FONT: INKREALM</button>
    </div>
    <div class="desk-sep"></div>
    <div class="panel-section">
      <div class="section-label">EDIT</div>
      <button class="desk-btn" id="btn-undo">UNDO</button>
      <button class="desk-btn" id="btn-redo">REDO</button>
    </div>
    <div class="desk-sep"></div>
    <div class="panel-section">
      <div class="section-label">MANUSCRIPT</div>
      <button class="desk-btn danger" id="btn-clear">CLEAR</button>
    </div>
    <div class="desk-sep"></div>
    <div class="panel-section">
      <div class="section-label">EXPORT</div>
      <button class="desk-btn" id="btn-txt">SAVE TXT</button>
      <button class="desk-btn accent" id="btn-pdf">PRINT PDF</button>
    </div>
    <div class="desk-sep"></div>
    <div class="panel-section">
      <div class="section-label">CAMERA</div>
      <div class="segmented">
        <button class="desk-btn seg on" id="cam-write">WRITE</button>
        <button class="desk-btn seg" id="cam-inspect">INSPECT</button>
      </div>
    </div>
  </div>
</div>

<div id="recovery-modal" role="dialog" aria-modal="true" aria-labelledby="recovery-title">
  <div id="recovery-box">
    <h2 id="recovery-title">DRAFT RECOVERED</h2>
    <p>A previous typing session was found. Restore it?</p>
    <button class="desk-btn accent recovery-btn" id="btn-recover-yes">RESTORE</button>
    <button class="desk-btn recovery-btn" id="btn-recover-no">DISCARD</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="print-content"></div>

<script>
/* ============================================================
   IRONCLAD — IMMERSIVE 3D MECHANICAL TYPEWRITER
   Multi-Font Options, Mobile Toolbar Optimization & Dynamic Acoustic Feedback
   ============================================================ */

const STATE = {
  text: '', lines: [''], cursorLine: 0, cursorCol: 0,
  history: [], historyIndex: -1,
  soundOn: true, unicodeMode: false, panelOpen: false,
  fontMode: 'INKREALM', // 'INKREALM' or 'WORDSTAR'
  cameraMode: 'WRITE', isTyping: false,
  carriageX: 0, paperOffset: 0,
  maxCharsPerLine: 48, linesPerPage: 24, pageCount: 1,
  bellRungOnLine: -1,
  audioCtx: null, draftRestored: false
};

/* --- THREE.JS --- */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.012);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

/* --- LIGHTING --- */
const ambientLight = new THREE.AmbientLight(0xffeedd, 0.2);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffeebb, 1.3);
keyLight.position.set(10, 22, 15);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 60;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xffaa66, 0.35, 50);
fillLight.position.set(-12, 12, 12);
scene.add(fillLight);

const rimLight = new THREE.SpotLight(0xff3300, 0.9, 60, Math.PI/6, 0.6);
rimLight.position.set(0, 18, -12);
rimLight.lookAt(0, 5, 0);
scene.add(rimLight);

/* --- MATERIALS --- */
const mats = {
  ivory: new THREE.MeshStandardMaterial({ color: 0xf5f0e6, roughness: 0.35, metalness: 0.05 }),
  blackPaint: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.25, metalness: 0.15 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.18, metalness: 0.92 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xbbbbbb, roughness: 0.08, metalness: 1.0 }),
  paper: new THREE.MeshStandardMaterial({ color: 0xfffef8, roughness: 0.92, metalness: 0.0 }),
  ribbon: new THREE.MeshStandardMaterial({ color: 0x330000, roughness: 0.6, metalness: 0.1 }),
  keyTop: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.35, metalness: 0.12 }),
  typebarMetal: new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.25, metalness: 0.85 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.95, metalness: 0.0 })
};

/* --- TYPEWRITER GROUPS --- */
const typewriterGroup = new THREE.Group();
scene.add(typewriterGroup);

const carriageGroup = new THREE.Group();
const keysGroup = new THREE.Group();
const typebarsGroup = new THREE.Group();
typewriterGroup.add(carriageGroup, keysGroup, typebarsGroup);

/* --- HELPERS --- */
function box(w,h,d,mat,x,y,z,parent,cast=true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = cast; m.receiveShadow = true;
  if (parent) parent.add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,rx=0,rz=0,parent) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.rotation.x=rx; m.rotation.z=rz;
  m.castShadow=true; m.receiveShadow=true;
  if (parent) parent.add(m); return m;
}

/* --- BODY --- */
box(16,3,10, mats.ivory, 0,1.5,0, typewriterGroup);
box(14,0.8,6, mats.blackPaint, 0,3.4,2, typewriterGroup);
box(16,1.5,8, mats.ivory, 0,5.5,-1, typewriterGroup);
box(14,0.2,4, mats.chrome, 0,6.3,-2, typewriterGroup);
box(0.5,6,10, mats.ivory, -8,3,0, typewriterGroup);
box(0.5,6,10, mats.ivory, 8,3,0, typewriterGroup);
box(16,6,0.5, mats.ivory, 0,3,-5, typewriterGroup);
[-7.5,7.5].forEach(x => cyl(0.3,0.3,6.5,16,mats.brass,x,3.25,0,Math.PI/2,0,typewriterGroup));
[[-6,-3],[6,-3],[-6,3],[6,3]].forEach(([x,z]) => cyl(0.6,0.8,0.8,16,mats.rubber,x,0.4,z,0,0,typewriterGroup));

/* --- KEYS --- */
const KEY_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];
const keysMap = new Map();
const keyMeshes = [];

function buildKeys() {
  const keySize = 0.9, spacing = 1.1;
  KEY_ROWS.forEach((row, ri) => {
    const z = 3.5 + ri * 1.2;
    const startX = -(row.length * spacing)/2 + spacing/2;
    row.forEach((ch, ci) => {
      const x = startX + ci * spacing;
      const stem = cyl(0.15,0.15,0.6,8,mats.chrome,x,3.8,z,0,0,keysGroup);
      const cap = cyl(keySize/2,keySize/2,0.25,16,mats.keyTop,x,4.2,z,0,0,keysGroup);
      const label = box(0.5,0.05,0.5,mats.ivory,x,4.33,z,keysGroup);
      const km = { char:ch, mesh:cap, stem, label, baseY:4.2, x, z };
      keysMap.set(ch, km); keyMeshes.push(km);
    });
  });
  // Spacebar
  const sb = { char:' ', isSpace:true, baseY:4.2, x:0, z:7 };
  sb.stem = cyl(0.15,0.15,0.6,8,mats.chrome,-2,3.8,7,0,0,keysGroup);
  sb.stem2 = cyl(0.15,0.15,0.6,8,mats.chrome,2,3.8,7,0,0,keysGroup);
  sb.mesh = box(7,0.25,0.8,mats.keyTop,0,4.2,7,keysGroup);
  keysMap.set(' ', sb); keyMeshes.push(sb);
  // Enter
  const en = { char:'ENTER', baseY:4.2, x:7, z:5.5 };
  en.stem = cyl(0.15,0.15,0.6,8,mats.chrome,7,3.8,5.5,0,0,keysGroup);
  en.mesh = box(1.2,0.25,1.8,mats.keyTop,7,4.2,5.5,keysGroup);
  keysMap.set('ENTER', en); keyMeshes.push(en);
  // Backspace
  const bs = { char:'BACKSPACE', baseY:4.2, x:-7, z:5.5 };
  bs.stem = cyl(0.15,0.15,0.6,8,mats.chrome,-7,3.8,5.5,0,0,keysGroup);
  bs.mesh = box(1.2,0.25,1.8,mats.keyTop,-7,4.2,5.5,keysGroup);
  keysMap.set('BACKSPACE', bs); keyMeshes.push(bs);
}
buildKeys();

/* --- TYPEBARS --- */
const typebarsMap = new Map();
function buildTypebars() {
  keyMeshes.forEach(km => {
    if (km.char === 'ENTER' || km.char === 'BACKSPACE') return;
    const barLen = 4.5;

  });
}

let isInkrealmFontLoaded = false;
let isWordstarFontLoaded = false;

function renderPaper() {
  const ctx = paperCtx, w = 1024, h = 1400;
  ctx.fillStyle = '#fffef8'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#2a2a2a';
  
  // Choose Font based on option selection
  if (STATE.fontMode === 'INKREALM') {
    ctx.font = isInkrealmFontLoaded ? '32px "Inkrealm"' : 'bold 28px "Courier New", monospace';
  } else {
    ctx.font = isWordstarFontLoaded ? '25px "WordStar"' : 'bold 28px "Courier New", monospace';
  }
  
  const lineH = 42, margin = 60;
  STATE.lines.forEach((line, i) => {
    const pageIdx = Math.floor(i / STATE.linesPerPage);
    const y = margin + (i % STATE.linesPerPage) * lineH + 32 + pageIdx * h;
    ctx.fillText(line, margin, y);
    if (i === STATE.cursorLine) {
      const tw = ctx.measureText(line.substring(0, STATE.cursorCol)).width;
      ctx.fillStyle = 'rgba(255,0,0,0.35)';
      ctx.fillRect(margin + tw, y - 28, 3, 32);
      ctx.fillStyle = '#2a2a2a';
    }
  });
  paperTex.needsUpdate = true;
}

/* --- AUDIO ENGINE --- */
function initAudio() {
  if (!STATE.audioCtx) STATE.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (STATE.audioCtx.state === 'suspended') STATE.audioCtx.resume();
}

function playClick(intensity=1) {
  if (!STATE.soundOn || !STATE.audioCtx) return;
  const ctx = STATE.audioCtx, now = ctx.currentTime;
  
  // Mechanical sharp clack
  const bufferSize = ctx.sampleRate * 0.015;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.8;
  const noise = ctx.createBufferSource(); noise.buffer = buffer;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 2500;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.12 * intensity, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.012);
  noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start(now); noise.stop(now + 0.015);
  
  // Low-freq typing chassis thud
  const thudOsc = ctx.createOscillator();
  thudOsc.type = 'triangle';
  thudOsc.frequency.setValueAtTime(180, now);
  thudOsc.frequency.exponentialRampToValueAtTime(60, now + 0.04);
  const thudGain = ctx.createGain();
  thudGain.gain.setValueAtTime(0.08 * intensity, now);
  thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
  thudOsc.connect(thudGain); thudGain.connect(ctx.destination);
  thudOsc.start(now); thudOsc.stop(now + 0.05);
}

function playReturn() {
  if (!STATE.soundOn || !STATE.audioCtx) return;
  const ctx = STATE.audioCtx, now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(220, now);
  osc.frequency.linearRampToValueAtTime(45, now + 0.22);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.035, now);
  gain.gain.linearRampToValueAtTime(0.001, now + 0.22);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.22);
}

function playBell() {
  if (!STATE.soundOn || !STATE.audioCtx) return;
  const ctx = STATE.audioCtx, now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1600, now); 
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.08, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.4);
}

/* --- ANIMATIONS --- */
const activeAnimations = [];

function animateKey(char) {
  const k = keysMap.get(char.toUpperCase()) || keysMap.get(char) || keysMap.get(' ');
  if (!k) return;
  activeAnimations.push({
    type: 'key', target: k, startTime: performance.now(), duration: 100,
    from: k.baseY, to: k.baseY - 0.3
  });
  const tb = typebarsMap.get(char.toUpperCase()) || typebarsMap.get(char) || typebarsMap.get(' ');
  if (tb) activeAnimations.push({
    type: 'typebar', target: tb, startTime: performance.now(), duration: 130,
    from: tb.baseRotX, to: tb.activeRotX
  });
}

function updateAnimations() {
  const now = performance.now();
  for (let i = activeAnimations.length - 1; i >= 0; i--) {
    const a = activeAnimations[i];
    const t = Math.min((now - a.startTime) / a.duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    if (a.type === 'key') {
      const y = a.from + (a.to - a.from) * Math.sin(t * Math.PI);
      a.target.mesh.position.y = y;
      if (a.target.stem) a.target.stem.position.y = y - 0.4;
      if (a.target.stem2) a.target.stem2.position.y = y - 0.4;
      if (a.target.label) a.target.label.position.y = y + 0.13;
    } else if (a.type === 'typebar') {
      a.target.pivot.rotation.x = a.from + (a.to - a.from) * Math.sin(t * Math.PI);
    } else if (a.type === 'carriage') {
      carriageGroup.position.x = a.from + (a.to - a.from) * ease;
    }
    if (t >= 1) activeAnimations.splice(i, 1);
  }
}

/* --- TEXT AREA DIRECT INTEGRATION & HISTORY ENGINE --- */
const editor = document.getElementById('manuscript-textarea');

let lastChangeType = ''; // 'insert', 'delete', 'newline'
let historyDebounceTimer = null;

function saveHistory() {
  STATE.history = STATE.history.slice(0, STATE.historyIndex + 1);
  STATE.history.push({ lines: [...STATE.lines], cursorLine: STATE.cursorLine, cursorCol: STATE.cursorCol });
  if (STATE.history.length > 50) STATE.history.shift();
  else STATE.historyIndex++;
}

// Group sequential inputs to prevent single character undo bloat
function checkAndGroupHistory(changeType) {
  clearTimeout(historyDebounceTimer);
  
  const isTypeBoundary = changeType !== lastChangeType || changeType === 'newline' || changeType === 'space';
  
  if (isTypeBoundary) {
    saveHistory();
    lastChangeType = changeType;
  } else {
    // Debounce to save history snapshot after a natural writing pause
    historyDebounceTimer = setTimeout(() => {
      saveHistory();
      lastChangeType = '';
    }, 1200);
  }
}

function updateEditorValue() {
  editor.value = STATE.lines.join('\n');
  let idx = 0;
  for (let i = 0; i < STATE.cursorLine; i++) {
    idx += STATE.lines[i].length + 1; 
  }
  idx += STATE.cursorCol;
  editor.setSelectionRange(idx, idx);
}

function undo() {
  if (STATE.historyIndex <= 0) return;
  STATE.historyIndex--;
  const snap = STATE.history[STATE.historyIndex];
  STATE.lines = [...snap.lines]; STATE.cursorLine = snap.cursorLine; STATE.cursorCol = snap.cursorCol;
  updateEditorValue(); recalcStats(); renderPaper(); updateCarriage();
}

function redo() {
  if (STATE.historyIndex >= STATE.history.length - 1) return;
  STATE.historyIndex++;
  const snap = STATE.history[STATE.historyIndex];
  STATE.lines = [...snap.lines]; STATE.cursorLine = snap.cursorLine; STATE.cursorCol = snap.cursorCol;
  updateEditorValue(); recalcStats(); renderPaper(); updateCarriage();
}

function updateCarriage() {
  const charWidth = 0.18;
  const targetX = -STATE.cursorCol * charWidth;
  activeAnimations.push({
    type: 'carriage', startTime: performance.now(), duration: 70,
    from: carriageGroup.position.x, to: targetX
  });
}

function recalcStats() {
  const fullText = STATE.lines.join('\n');
  const words = fullText.trim().split(/\s+/).filter(w => w.length > 0).length;
  const lines = STATE.lines.length;
  const pages = Math.max(1, Math.ceil(lines / STATE.linesPerPage));
  document.getElementById('stat-words').textContent = words;
  document.getElementById('stat-pages').textContent = pages;
  document.getElementById('stat-lines').textContent = lines;
  document.getElementById('stat-col').textContent = STATE.cursorCol + 1;
}

/* --- DUAL INTERACTION ENGINE (Bidirectional Sync) --- */
editor.addEventListener('input', (e) => {
  initAudio();
  
  const text = editor.value;
  const lines = text.split('\n');
  
  // Calculate selection details
  const selStart = editor.selectionStart;
  const textBefore = text.substring(0, selStart);
  const parsedLines = textBefore.split('\n');
  const activeLineIdx = parsedLines.length - 1;
  const activeColIdx = parsedLines[parsedLines.length - 1].length;

  // Margin limits: Prevent entering characters beyond maximum margin limits
  if (lines[activeLineIdx] && lines[activeLineIdx].length > STATE.maxCharsPerLine) {
    // Truncate input back to maximum character limit
    editor.value = STATE.lines.join('\n');
    const resetCursor = selStart - 1;
    editor.setSelectionRange(resetCursor, resetCursor);
    playClick(0.35); // stuck mechanical key sound feedback
    return;
  }

  // Determine history action category
  let actionType = 'insert';
  if (e.inputType === 'insertLineBreak') actionType = 'newline';
  else if (e.inputType === 'deleteContentBackward') actionType = 'delete';
  else if (e.data === ' ') actionType = 'space';

  checkAndGroupHistory(actionType);

  STATE.lines = lines;
  STATE.cursorLine = activeLineIdx;
  STATE.cursorCol = activeColIdx;

  // Trigger margin bell warning once as margin is crossed
  if (STATE.cursorCol >= STATE.maxCharsPerLine - 6 && STATE.bellRungOnLine !== STATE.cursorLine && e.data) {
    playBell();
    STATE.bellRungOnLine = STATE.cursorLine;
  }

  // Process physical mechanical feedback
  if (e.inputType === 'insertLineBreak') {
    playReturn();
  } else if (e.inputType === 'deleteContentBackward') {
    animateKey('BACKSPACE');
    playClick(0.7);
  } else if (e.data) {
    const ch = e.data[e.data.length - 1];
    animateKey(ch);
    playClick();
  }

  recalcStats();
  renderPaper();
  updateCarriage();
  saveDraft();
});

// Clean wrap long pasted texts into 48-character blocks
editor.addEventListener('paste', (e) => {
  e.preventDefault();
  const pastedText = (e.clipboardData || window.clipboardData).getData('text');
  
  const wrapParagraph = (str, limit) => {
    const words = str.split(' ');
    let wrappedLines = [];
    let currentLine = '';
    words.forEach(word => {
      if ((currentLine + word).length < limit) {
        currentLine += (currentLine === '' ? '' : ' ') + word;
      } else {
        wrappedLines.push(currentLine);
        currentLine = word;
      }
    });
    if (currentLine) wrappedLines.push(currentLine);
    return wrappedLines.join('\n');
  };

  const formattedLines = pastedText.split('\n').map(p => wrapParagraph(p, STATE.maxCharsPerLine)).join('\n');
  
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const val = editor.value;
  editor.value = val.substring(0, start) + formattedLines + val.substring(end);
  
  // Dispatch synthetic event to rebuild and render assets
  const syncEvent = new Event('input', { bubbles: true });
  editor.dispatchEvent(syncEvent);
  
  const finalCursorPos = start + formattedLines.length;
  editor.setSelectionRange(finalCursorPos, finalCursorPos);
  syncCursorOnly();
});

// Sync cursor alignment when user clicks or shifts lines with arrows
function syncCursorOnly() {
  const text = editor.value;
  const selStart = editor.selectionStart;
  const textBefore = text.substring(0, selStart);
  const parsedLines = textBefore.split('\n');
  
  STATE.cursorLine = parsedLines.length - 1;
  STATE.cursorCol = parsedLines[parsedLines.length - 1].length;

  renderPaper();
  updateCarriage();
  recalcStats();
}

editor.addEventListener('click', syncCursorOnly);
editor.addEventListener('keyup', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    syncCursorOnly();
  }
});

/* Global keydown fallback listener when clicking on 3D canvas (outside panel) */
document.addEventListener('keydown', (e) => {
  if (document.activeElement === editor || e.target.tagName === 'BUTTON') return;
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z') { e.preventDefault(); undo(); }
    if (e.key === 'y') { e.preventDefault(); redo(); }
    if (e.key === 'p') { e.preventDefault(); exportPDF(); }
    if (e.key === 's') { e.preventDefault(); exportTXT(); }
    return;
  }
  editor.focus();
});

/* --- CAMERA --- */
const CAMERAS = {
  WRITE: { pos: new THREE.Vector3(0, 14, 22), look: new THREE.Vector3(0, 6, 0) },
  INSPECT: { pos: new THREE.Vector3(12, 12, 12), look: new THREE.Vector3(0, 5, 0) }
};

let orbitActive = false;
let orbitTheta = 0, orbitPhi = Math.PI/3, orbitRadius = 20;
let camTargetPos = CAMERAS.WRITE.pos.clone();
let camTargetLook = CAMERAS.WRITE.look.clone();
let currentLook = CAMERAS.WRITE.look.clone();

function setCamera(mode) {
  STATE.cameraMode = mode;
  document.getElementById('cam-indicator').textContent = mode;
  ['cam-write','cam-inspect'].forEach(id => document.getElementById(id).classList.remove('on'));
  document.getElementById('cam-' + mode.toLowerCase()).classList.add('on');
  const c = CAMERAS[mode];
  camTargetPos.copy(c.pos); camTargetLook.copy(c.look);
  orbitActive = (mode === 'INSPECT');
}

document.getElementById('cam-write').addEventListener('click', () => setCamera('WRITE'));
document.getElementById('cam-inspect').addEventListener('click', () => setCamera('INSPECT'));
setCamera('WRITE');

let isDragging = false, lastMX = 0, lastMY = 0;
renderer.domElement.addEventListener('mousedown', e => { isDragging = true; lastMX = e.clientX; lastMY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging || !orbitActive) return;
  orbitTheta -= (e.clientX - lastMX) * 0.01;
  orbitPhi += (e.clientY - lastMY) * 0.01;
  orbitPhi = Math.max(0.2, Math.min(Math.PI/2 - 0.1, orbitPhi));
  lastMX = e.clientX; lastMY = e.clientY;
  camTargetPos.set(
    orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta),
    orbitRadius * Math.cos(orbitPhi),
    orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta)
  );
});
renderer.domElement.addEventListener('wheel', e => {
  if (!orbitActive) return;
  orbitRadius += e.deltaY * 0.02;
  orbitRadius = Math.max(8, Math.min(40, orbitRadius));
  camTargetPos.set(
    orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta),
    orbitRadius * Math.cos(orbitPhi),
    orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta)
  );
});

let lastTouch = null;
renderer.domElement.addEventListener('touchstart', e => { if (e.touches.length === 1) lastTouch = e.touches[0]; });
renderer.domElement.addEventListener('touchmove', e => {
  if (!orbitActive || !lastTouch || e.touches.length !== 1) return;
  const t = e.touches[0];
  orbitTheta -= (t.clientX - lastTouch.clientX) * 0.01;
  orbitPhi += (t.clientY - lastTouch.clientY) * 0.01;
  orbitPhi = Math.max(0.2, Math.min(Math.PI/2 - 0.1, orbitPhi));
  camTargetPos.set(
    orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta),
    orbitRadius * Math.cos(orbitPhi),
    orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta)
  );
  lastTouch = t;
});

/* --- EXPORT --- */
function getManuscriptText() {
  return STATE.lines.join('\n');
}

function exportTXT() {
  const text = getManuscriptText();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'manuscript_' + new Date().toISOString().slice(0,10) + '.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('TXT SAVED');
}

function exportPDF() {
  const text = getManuscriptText();
  const printDiv = document.getElementById('print-content');
  printDiv.innerHTML = '';
  const inner = document.createElement('div');
  inner.textContent = text;
  printDiv.appendChild(inner);
  printDiv.style.display = 'block';
  requestAnimationFrame(() => {
    window.print();
    requestAnimationFrame(() => { printDiv.style.display = 'none'; printDiv.innerHTML = ''; });
  });
  showToast('PRINT DIALOG OPENED');
}

document.getElementById('btn-txt').addEventListener('click', exportTXT);
document.getElementById('btn-pdf').addEventListener('click', exportPDF);

/* --- DRAFT RECOVERY --- */
function saveDraft() {
  const text = STATE.lines.join('\n');
  if (!text || text.trim().length === 0) {
    localStorage.removeItem('typewriter-draft');
    return;
  }
  localStorage.setItem('typewriter-draft', JSON.stringify({
    lines: STATE.lines, cursorLine: STATE.cursorLine, cursorCol: STATE.cursorCol,
    timestamp: Date.now()
  }));
}

function checkRecovery() {
  const raw = localStorage.getItem('typewriter-draft');
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    const text = (data.lines || []).join('\n');
    if (!text || text.trim().length === 0) { localStorage.removeItem('typewriter-draft'); return; }
    const modal = document.getElementById('recovery-modal');
    modal.style.display = 'flex';
    document.getElementById('btn-recover-yes').onclick = () => {
      STATE.lines = data.lines || ['']; STATE.cursorLine = data.cursorLine || 0; STATE.cursorCol = data.cursorCol || 0;
      updateEditorValue(); recalcStats(); renderPaper(); updateCarriage(); modal.style.display = 'none';
      showToast('DRAFT RESTORED');
    };
    document.getElementById('btn-recover-no').onclick = () => {
      localStorage.removeItem('typewriter-draft'); modal.style.display = 'none';
    };
  } catch(e) { localStorage.removeItem('typewriter-draft'); }
}

/* --- RENDER LOOP --- */
function animate() {
  requestAnimationFrame(animate);
  updateAnimations();
  
  // Smoothly lerp camera perspective
  camera.position.lerp(camTargetPos, 0.05);
  currentLook.lerp(camTargetLook, 0.05);
  camera.lookAt(currentLook);
  
  // Vertical feed logic: smooth lerp to raise/lower paper plane out of platen
  const targetPaperY = 9.5 + (STATE.cursorLine * 0.22);
  paperMesh.position.y = THREE.MathUtils.lerp(paperMesh.position.y, targetPaperY, 0.12);
  
  const t = performance.now() * 0.001;
  rimLight.intensity = 0.9 + Math.sin(t) * 0.1;
  paperMesh.rotation.x = -Math.PI/2 + Math.sin(t*0.5) * 0.008;
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* --- INIT --- */
recalcStats(); renderPaper(); checkRecovery(); animate();
setTimeout(() => {
  editor.focus();
  togglePanel(true); // Default open the side panel to facilitate immediate writing
}, 600);
</script>
</body>
</html>
