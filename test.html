<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWP TRIPTYCH // TALTOS DOLLHOUSE SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Cinzel:wght@700;900&family=Special+Elite&display=swap" rel="stylesheet">

<style>
  :root {
    /* STRICT DOMAIN PALETTE: RED, WHITE, GRAY, BLACK */
    --c-black: #050404;
    --c-dark-gray: #121010;
    --c-mid-gray: #242020;
    --c-silver: #a8a0a0;
    --c-white: #f5f2ef;
    --c-crimson: #e61c1c;
    --c-blood: #8a0c0c;
    
    /* DEFAULT PHOSPHOR: BLOOD CRIMSON */
    --crt-phosphor: #ff3333;
    --crt-glow: rgba(255, 51, 51, 0.65);
    --crt-dim: #590d0d;
    --crt-bg: rgba(10, 4, 4, 0.90);
    --crt-highlight: #ffffff;
    --video-opacity: 0.40;
  }

  /* MONOCHROME WHITE CRT */
  [data-theme="white"] {
    --crt-phosphor: #f0f0f0;
    --crt-glow: rgba(240, 240, 240, 0.5);
    --crt-dim: #444444;
    --crt-bg: rgba(8, 8, 8, 0.92);
    --crt-highlight: #ffffff;
  }

  /* BONE SILVER NOIR */
  [data-theme="bone"] {
    --crt-phosphor: #d6cfc5;
    --crt-glow: rgba(214, 207, 197, 0.4);
    --crt-dim: #423d38;
    --crt-bg: rgba(12, 10, 10, 0.92);
    --crt-highlight: #ffffff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--c-black);
    color: var(--c-silver);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ==================== TOP HARDWARE RACK ==================== */
  header.hardware-shelf {
    width: 100%;
    background: linear-gradient(180deg, #1c1414 0%, #0d0808 100%);
    border-bottom: 2px solid var(--c-blood);
    padding: 8px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    z-index: 1000;
    box-shadow: 0 4px 25px rgba(0,0,0,0.95);
  }

  .brand-zone {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .pwp-svg-emblem {
    height: 36px;
  }

  .brand-title {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
    color: var(--c-white);
    text-shadow: 0 0 8px rgba(230, 28, 28, 0.4);
  }

  .brand-sub {
    font-size: 0.62rem;
    color: var(--c-silver);
    letter-spacing: 1.5px;
  }

  .btn-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .retro-btn {
    background: linear-gradient(180deg, #261b1b 0%, #120b0b 100%);
    border: 1px solid #4a2828;
    border-bottom: 2px solid #000;
    color: var(--c-silver);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    font-weight: bold;
    padding: 6px 11px;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: 0.15s ease;
  }

  .retro-btn:hover {
    background: #3d1c1c;
    color: var(--c-white);
    border-color: var(--c-crimson);
  }

  .retro-btn.active {
    border-color: var(--c-crimson);
    color: var(--c-white);
    box-shadow: 0 0 10px rgba(230, 28, 28, 0.6);
  }

  .retro-select {
    background: #140d0d;
    border: 1px solid #4a2828;
    color: var(--c-silver);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 5px 8px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  /* ==================== COLLAGE VIEWPORT & GLITCH ==================== */
  .collage-viewport {
    position: relative;
    width: 100%;
    max-width: 1600px;
    margin: 10px auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.98);
    border: 1px solid #331515;
    background: #000;
    overflow: hidden;
  }

  .collage-base-img {
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
    pointer-events: none;
    animation: analogDrift 14s infinite ease-in-out;
  }

  @keyframes analogDrift {
    0%, 88%, 100% {
      filter: contrast(1.08) brightness(0.95);
      transform: translate(0, 0);
    }
    89% {
      filter: contrast(1.3) brightness(1.2) drop-shadow(-2px 0 0 rgba(230, 28, 28, 0.7));
      transform: translate(-1px, 1px);
    }
    90% {
      filter: contrast(1.1) brightness(0.9) drop-shadow(2px 0 0 rgba(255, 255, 255, 0.7));
      transform: translate(1px, -1px);
    }
    92% {
      filter: contrast(1.08) brightness(0.95);
      transform: translate(0, 0);
    }
    96% {
      filter: contrast(1.25) brightness(1.1) drop-shadow(-3px 0 0 rgba(230, 28, 28, 0.8));
      transform: translate(2px, 0);
    }
    97% {
      filter: contrast(1.08) brightness(0.95);
      transform: translate(0, 0);
    }
  }

  /* ==================== CONSTRAINED LEFT-PANEL CRT APERTURE ====================
     Positioned to start on the Smith Corona monitor and extend down over the 
     8-point option menu, but STOPPING strictly before the vertical crimson stripe.
  ================================================================================ */
  .screen-aperture-fitted {
    position: absolute;
    top: 31.8%;
    left: 7.2%;
    width: 32.8%;   /* stops before the crimson stripe */
    height: 64.5%;  /* extends down through the foot of panel 1 to cover 8-pt menu */
    
    background: var(--crt-bg);
    border: 2px solid var(--c-blood);
    border-radius: 4px;
    box-shadow: 
      inset 0 0 25px rgba(0,0,0,0.98),
      0 0 15px rgba(0,0,0,0.85);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    z-index: 50;
    backdrop-filter: blur(2px);
  }

  /* CRT Scanlines & Glass Glow */
  .screen-aperture-fitted::before {
    content: " ";
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(
      rgba(10, 10, 10, 0) 50%, 
      rgba(0, 0, 0, 0.55) 50%
    );
    background-size: 100% 3px;
    z-index: 8;
    pointer-events: none;
  }

  .screen-aperture-fitted::after {
    content: " ";
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: radial-gradient(
      circle at center,
      rgba(255,255,255,0.01) 0%,
      rgba(0,0,0,0.45) 80%,
      rgba(0,0,0,0.9) 100%
    );
    z-index: 9;
    pointer-events: none;
  }

  /* VIDEO BACKGROUND LAYER */
  .crt-video-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    transition: opacity 0.4s ease;
    overflow: hidden;
  }

  .crt-video-layer iframe {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.3);
    filter: contrast(1.5) grayscale(0.85) brightness(0.65);
  }

  /* CRT TOP HEADER */
  .crt-header {
    background: rgba(12, 4, 4, 0.9);
    border-bottom: 1px dashed var(--crt-dim);
    color: var(--crt-phosphor);
    font-family: 'VT323', monospace;
    font-size: 1.05rem;
    padding: 4px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 1.5px;
    z-index: 10;
    text-shadow: 0 0 6px var(--crt-glow);
  }

  /* CRT TEXTAREA */
  #main-editor {
    position: relative;
    z-index: 5;
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--crt-phosphor);
    font-family: 'VT323', monospace;
    font-size: 1.35rem;
    line-height: 1.25;
    letter-spacing: 1px;
    padding: 10px 14px;
    text-shadow: 0 0 6px var(--crt-glow);
    white-space: pre-wrap;
    word-break: break-word;
    caret-color: var(--crt-highlight);
  }

  #main-editor::selection {
    background: var(--crt-phosphor);
    color: #000;
    text-shadow: none;
  }

  /* CRT FOOTER */
  .crt-footer {
    background: rgba(10, 4, 4, 0.95);
    border-top: 1px dashed var(--crt-dim);
    color: var(--crt-phosphor);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    padding: 4px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 1px;
    z-index: 10;
  }

  .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background-color: var(--crt-phosphor);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--crt-phosphor);
    animation: pulseLed 1.6s infinite;
  }

  @keyframes pulseLed {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* CALIBRATION TOOLBAR */
  .calibrator-panel {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: rgba(18, 10, 10, 0.96);
    border: 1px solid var(--c-blood);
    border-radius: 4px;
    padding: 10px 14px;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.95);
    font-size: 0.7rem;
    max-width: 320px;
    display: none;
  }

  .calibrator-panel.show {
    display: block;
  }

  .cal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 8px;
  }

  .cal-row input[type="range"] {
    flex: 1;
    accent-color: var(--c-crimson);
    cursor: pointer;
  }
</style>
</head>

<body data-theme="crimson">

  <!-- TOP HARDWARE RACK -->
  <header class="hardware-shelf">
    <div class="brand-zone">
      <!-- Hatched SVG Barcode Logo -->
      <svg class="pwp-svg-emblem" viewBox="0 0 190 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="2" width="5" height="34" fill="#e61c1c"/>
        <rect x="9" y="2" width="2" height="34" fill="#e61c1c"/>
        <rect x="15" y="2" width="7" height="34" fill="#e61c1c"/>
        <rect x="26" y="2" width="3" height="34" fill="#a8a0a0"/>
        <rect x="33" y="2" width="10" height="34" fill="#f5f2ef"/>
        <rect x="47" y="2" width="4" height="34" fill="#e61c1c"/>
        <rect x="55" y="2" width="2" height="34" fill="#a8a0a0"/>
        <rect x="61" y="2" width="8" height="34" fill="#f5f2ef"/>
        <line x1="75" y1="4" x2="185" y2="4" stroke="#8a0c0c" stroke-width="1.2" stroke-dasharray="3 2"/>
        <text x="75" y="17" fill="#f5f2ef" font-family="'Cinzel', serif" font-weight="bold" font-size="10.5" letter-spacing="1.5">TAL-TOS // PWP</text>
        <text x="75" y="30" fill="#a8a0a0" font-family="'Share Tech Mono', monospace" font-size="7.5" letter-spacing="1">DATADISK PROCESSOR</text>
        <line x1="75" y1="34" x2="185" y2="34" stroke="#8a0c0c" stroke-width="1.2" stroke-dasharray="3 2"/>
      </svg>
      <div>
        <div class="brand-title">TALAMASCA DOLL-PROCESSOR</div>
        <div class="brand-sub">PANEL 1 CRT // PRESERVED CRIMSON STRIPE</div>
      </div>
    </div>

    <div class="btn-bar">
      <!-- PHOSPHOR SWITCHER -->
      <select class="retro-select" onchange="setPhosphorTheme(this.value)">
        <option value="crimson" selected>Blood Crimson CRT</option>
        <option value="white">Stark White CRT</option>
        <option value="bone">Bone Silver Noir</option>
      </select>

      <!-- VIDEO BACKGROUND TOGGLE -->
      <button class="retro-btn" id="vbg-toggle" onclick="toggleVideoBackground()">
        📹 VIDEO BG: <span id="vbg-label" style="color:var(--c-silver);">OFF</span>
      </button>

      <!-- SOLENOID AUDIO -->
      <button class="retro-btn" id="audio-toggle" onclick="toggleAudioFeedback()">
        🔊 CLICKS: <span id="audio-label" style="color:var(--c-white);">ON</span>
      </button>

      <!-- STORE DATADISK -->
      <button class="retro-btn" onclick="storeDataDisk()">
        💾 [STORE DATADISK]
      </button>

      <!-- LOAD EXTERNAL DOSSIER -->
      <label class="retro-btn" style="cursor:pointer;">
        📂 LOAD .TXT
        <input type="file" accept=".txt,.md,.dat" style="display:none;" onchange="loadExternalFile(event)">
      </label>

      <!-- CALIBRATE APERTURE -->
      <button class="retro-btn" onclick="toggleCalibrator()">
        📐 ALIGN SCREEN
      </button>
    </div>
  </header>

  <!-- COLLAGE VIEWPORT -->
  <div class="collage-viewport" id="viewport">
    <img 
      src="https://raw.githubusercontent.com/ghostm68/666/main/nexus_20260828_152537824.jpg" 
      alt="Surrealist Dollhouse Triptych" 
      class="collage-base-img"
    >

    <!-- FITTED CRT SCREEN (COVERS 8-POINT MENU, PRESERVES DOLL STRIPE) -->
    <div class="screen-aperture-fitted" id="crt-aperture">
      
      <!-- Video Background Layer -->
      <div class="crt-video-layer" id="video-layer">
        <iframe 
          id="video-iframe" 
          src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&controls=0&loop=1&playlist=jfKfPfyJRdk&playsinline=1" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          frameborder="0">
        </iframe>
      </div>

      <!-- Header -->
      <div class="crt-header">
        <span>LS1 P10 WR100% // PWP-0</span>
        <span id="crt-clock">00:00:00</span>
      </div>

      <!-- Editor -->
      <textarea id="main-editor" spellcheck="false" placeholder="INITIALIZE WORD TRANSMISSION..."></textarea>

      <!-- Footer -->
      <div class="crt-footer">
        <div class="status-tag">
          <div class="status-dot"></div>
          <span id="save-status">DISK: SYNCED</span>
        </div>
        <div>
          <span>LN <span id="stat-line">1</span></span>
          &nbsp;|&nbsp;
          <span>W:<span id="stat-words">0</span></span>
          &nbsp;|&nbsp;
          <span>C:<span id="stat-chars">0</span></span>
        </div>
      </div>

    </div>
  </div>

  <!-- CALIBRATION HUD -->
  <div class="calibrator-panel" id="calibrator">
    <div style="font-weight:bold; color:var(--c-white); margin-bottom:8px; border-bottom:1px solid var(--c-blood); padding-bottom:4px; display:flex; justify-content:space-between;">
      <span>APERTURE CALIBRATOR</span>
      <span style="cursor:pointer; color:var(--c-crimson);" onclick="toggleCalibrator()">✕</span>
    </div>
    
    <div class="cal-row">
      <label>Top (%):</label>
      <input type="range" id="cal-top" min="0" max="60" step="0.1" value="31.8" oninput="updateGeometry()">
      <span id="val-top">31.8</span>
    </div>
    <div class="cal-row">
      <label>Left (%):</label>
      <input type="range" id="cal-left" min="0" max="30" step="0.1" value="7.2" oninput="updateGeometry()">
      <span id="val-left">7.2</span>
    </div>
    <div class="cal-row">
      <label>Width (%):</label>
      <input type="range" id="cal-width" min="15" max="60" step="0.1" value="32.8" oninput="updateGeometry()">
      <span id="val-width">32.8</span>
    </div>
    <div class="cal-row">
      <label>Height (%):</label>
      <input type="range" id="cal-height" min="20" max="80" step="0.1" value="64.5" oninput="updateGeometry()">
      <span id="val-height">64.5</span>
    </div>
    
    <div style="display:flex; justify-content:space-between; margin-top:8px;">
      <button class="retro-btn" onclick="resetGeometry()">RESET</button>
      <button class="retro-btn" style="border-color:var(--c-crimson); color:var(--c-white);" onclick="saveGeometry()">LOCK POS</button>
    </div>
  </div>

<script>
  const editor = document.getElementById('main-editor');
  const crtAperture = document.getElementById('crt-aperture');
  const saveStatus = document.getElementById('save-status');
  const statLine = document.getElementById('stat-line');
  const statWords = document.getElementById('stat-words');
  const statChars = document.getElementById('stat-chars');
  const crtClock = document.getElementById('crt-clock');
  
  const STORAGE_KEY = 'PWP_FITTED_TEXT_V4';
  const GEOM_KEY = 'PWP_FITTED_GEOM_V4';
  
  let audioEnabled = true;
  let videoEnabled = false;

  const DEFAULT_DOLL_TEXT = `TALAMASCA FIELD DOSSIER // CASE 666-TALTOS
TERMINAL: SMITH CORONA CRT [PANEL 1 BUFFER]
LOCATION: ATTIC OBSERVATORY // FIRST STREET HOUSE

----------------------------------------------------------------
1. THE APERTURE
The word processor terminal maps across the lower attic chamber,
stopping cleanly before the crimson stripe of porcelain faces.

2. LASHER / TALTOS RESONANCE
Mechanical key strikes activate non-volatile memory imprints.
The 8-point menu remains eclipsed behind the active CRT buffer.

[Type and structure your dossier text below...]`;

  const DEFAULT_GEOM = {
    top: 31.8,
    left: 7.2,
    width: 32.8,
    height: 64.5
  };

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    editor.value = (saved !== null && saved.trim() !== '') ? saved : DEFAULT_DOLL_TEXT;

    const savedGeom = localStorage.getItem(GEOM_KEY);
    if (savedGeom) {
      applyGeometry(JSON.parse(savedGeom));
    }

    updateMetrics();
    startClock();
  });

  // REALTIME PERSISTENCE
  let saveDebounce;
  editor.addEventListener('input', () => {
    saveStatus.textContent = 'SAVING...';
    clearTimeout(saveDebounce);
    saveDebounce = setTimeout(() => {
      localStorage.setItem(STORAGE_KEY, editor.value);
      saveStatus.textContent = 'DISK: SYNCED';
    }, 400);

    updateMetrics();
    playKeystrokeAudio();
  });

  editor.addEventListener('keyup', updateMetrics);
  editor.addEventListener('click', updateMetrics);

  function updateMetrics() {
    const text = editor.value;
    statChars.textContent = text.length;
    const words = text.trim().length > 0 ? text.trim().split(/\s+/).length : 0;
    statWords.textContent = words;

    const pos = editor.selectionStart;
    const lines = text.substring(0, pos).split("\n");
    statLine.textContent = lines.length;
  }

  // PHOSPHOR PALETTE
  function setPhosphorTheme(theme) {
    document.body.setAttribute('data-theme', theme);
  }

  // VIDEO BACKGROUND TOGGLE
  function toggleVideoBackground() {
    videoEnabled = !videoEnabled;
    const vLayer = document.getElementById('video-layer');
    const vLabel = document.getElementById('vbg-label');
    const vBtn = document.getElementById('vbg-toggle');

    if (videoEnabled) {
      vLayer.style.opacity = 'var(--video-opacity)';
      vLabel.textContent = 'ON';
      vLabel.style.color = 'var(--crt-phosphor)';
      vBtn.classList.add('active');
    } else {
      vLayer.style.opacity = '0';
      vLabel.textContent = 'OFF';
      vLabel.style.color = 'var(--c-silver)';
      vBtn.classList.remove('active');
    }
  }

  // MECHANICAL AUDIO (RED/WHITE MATRIX CLICK)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function toggleAudioFeedback() {
    audioEnabled = !audioEnabled;
    const lbl = document.getElementById('audio-label');
    const btn = document.getElementById('audio-toggle');
    lbl.textContent = audioEnabled ? 'ON' : 'MUTED';
    lbl.style.color = audioEnabled ? 'var(--c-white)' : 'var(--c-silver)';
    if (audioEnabled) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }

  function playKeystrokeAudio() {
    if (!audioEnabled) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140 + Math.random() * 60, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.035);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    } catch (e) {}
  }

  // EXPORT .TXT
  function storeDataDisk() {
    const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `TALAMASCA_DATADISK_${new Date().toISOString().slice(0,10)}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // LOAD .TXT
  function loadExternalFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      editor.value = event.target.result;
      localStorage.setItem(STORAGE_KEY, editor.value);
      updateMetrics();
    };
    reader.readAsText(file);
  }

  // CALIBRATOR HUD LOGIC
  function toggleCalibrator() {
    document.getElementById('calibrator').classList.toggle('show');
  }

  function updateGeometry() {
    const top = document.getElementById('cal-top').value;
    const left = document.getElementById('cal-left').value;
    const width = document.getElementById('cal-width').value;
    const height = document.getElementById('cal-height').value;

    document.getElementById('val-top').textContent = top;
    document.getElementById('val-left').textContent = left;
    document.getElementById('val-width').textContent = width;
    document.getElementById('val-height').textContent = height;

    applyGeometry({ top, left, width, height });
  }

  function applyGeometry(g) {
    crtAperture.style.top = g.top + '%';
    crtAperture.style.left = g.left + '%';
    crtAperture.style.width = g.width + '%';
    crtAperture.style.height = g.height + '%';

    document.getElementById('cal-top').value = g.top;
    document.getElementById('cal-left').value = g.left;
    document.getElementById('cal-width').value = g.width;
    document.getElementById('cal-height').value = g.height;

    document.getElementById('val-top').textContent = g.top;
    document.getElementById('val-left').textContent = g.left;
    document.getElementById('val-width').textContent = g.width;
    document.getElementById('val-height').textContent = g.height;
  }

  function saveGeometry() {
    const g = {
      top: document.getElementById('cal-top').value,
      left: document.getElementById('cal-left').value,
      width: document.getElementById('cal-width').value,
      height: document.getElementById('cal-height').value
    };
    localStorage.setItem(GEOM_KEY, JSON.stringify(g));
    alert('Aperture coordinates locked into localStorage!');
  }

  function resetGeometry() {
    applyGeometry(DEFAULT_GEOM);
    localStorage.removeItem(GEOM_KEY);
  }

  function startClock() {
    function tick() {
      const d = new Date();
      crtClock.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }
    tick();
    setInterval(tick, 1000);
  }
</script>
</body>
</html>
