<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWP TRIPTYCH // TALTOS DOLLHOUSE SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Cinzel:wght@700;900&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
  :root {
    /* DOMAIN PALETTE: RED, WHITE, GRAY, BLACK */
    --c-black: #050404;
    --c-dark-gray: #121010;
    --c-mid-gray: #242020;
    --c-silver: #a8a0a0;
    --c-white: #f5f2ef;
    --c-crimson: #e61c1c;
    --c-blood: #8a0c0c;
    
    /* DEFAULT PHOSPHOR: BLOOD CRIMSON */
    --crt-phosphor: #ff3333;
    --crt-glow: rgba(255, 51, 51, 0.65);
    --crt-dim: #590d0d;
    --crt-bg: rgba(10, 4, 4, 0.90);
    --crt-highlight: #ffffff;
    --beam-gain: 1.0;
    --video-opacity: 0.40;
  }

  [data-theme="white"] {
    --crt-phosphor: #f0f0f0;
    --crt-glow: rgba(240, 240, 240, 0.5);
    --crt-dim: #444444;
    --crt-bg: rgba(8, 8, 8, 0.92);
    --crt-highlight: #ffffff;
  }

  [data-theme="bone"] {
    --crt-phosphor: #d6cfc5;
    --crt-glow: rgba(214, 207, 197, 0.4);
    --crt-dim: #423d38;
    --crt-bg: rgba(12, 10, 10, 0.92);
    --crt-highlight: #ffffff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--c-black);
    color: var(--c-silver);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* FULLSCREEN PARTICLE CANVAS TRAIL */
  #trailCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99999;
  }

  /* ==================== HARDWARE RACK ==================== */
  header.hardware-shelf {
    width: 100%;
    background: linear-gradient(180deg, #1c1414 0%, #0d0808 100%);
    border-bottom: 2px solid var(--c-blood);
    padding: 8px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    z-index: 1000;
    box-shadow: 0 4px 25px rgba(0,0,0,0.95);
  }

  .brand-zone {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .pwp-svg-emblem {
    height: 36px;
  }

  .brand-title {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
    color: var(--c-white);
    text-shadow: 0 0 8px rgba(230, 28, 28, 0.4);
  }

  .brand-sub {
    font-size: 0.62rem;
    color: var(--c-silver);
    letter-spacing: 1.5px;
  }

  .btn-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }

  .retro-btn {
    background: linear-gradient(180deg, #261b1b 0%, #120b0b 100%);
    border: 1px solid #4a2828;
    border-bottom: 2px solid #000;
    color: var(--c-silver);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    font-weight: bold;
    padding: 6px 11px;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .retro-btn:hover {
    background: #3d1c1c;
    color: var(--c-white);
    border-color: var(--c-crimson);
  }

  .retro-btn.active {
    border-color: var(--c-crimson);
    color: var(--c-white);
    box-shadow: 0 0 10px rgba(230, 28, 28, 0.6);
  }

  .retro-select {
    background: #140d0d;
    border: 1px solid #4a2828;
    color: var(--c-silver);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 5px 8px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  /* ==================== COLLAGE VIEWPORT & GLITCH ==================== */
  .collage-viewport {
    position: relative;
    width: 100%;
    max-width: 1600px;
    margin: 10px auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.98);
    border: 1px solid #331515;
    background: #000;
    overflow: hidden;
  }

  .collage-base-img {
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
    pointer-events: none;
    animation: analogDrift 14s infinite ease-in-out;
  }

  @keyframes analogDrift {
    0%, 88%, 100% {
      filter: contrast(1.08) brightness(0.95);
      transform: translate(0, 0);
    }
    89% {
      filter: contrast(1.3) brightness(1.2) drop-shadow(-2px 0 0 rgba(230, 28, 28, 0.7));
      transform: translate(-1px, 1px);
    }
    90% {
      filter: contrast(1.1) brightness(0.9) drop-shadow(2px 0 0 rgba(255, 255, 255, 0.7));
      transform: translate(1px, -1px);
    }
    92% {
      filter: contrast(1.08) brightness(0.95);
      transform: translate(0, 0);
    }
    96% {
      filter: contrast(1.25) brightness(1.1) drop-shadow(-3px 0 0 rgba(230, 28, 28, 0.8));
      transform: translate(2px, 0);
    }
    97% {
      filter: contrast(1.08) brightness(0.95);
      transform: translate(0, 0);
    }
  }

  /* ==================== CONSTRAINED CRT APERTURE ==================== */
  .screen-aperture-fitted {
    position: absolute;
    top: 31.8%;
    left: 7.2%;
    width: 32.8%;
    height: 64.5%;
    background: var(--crt-bg);
    border: 2px solid var(--c-blood);
    border-radius: 4px;
    box-shadow: 
      inset 0 0 25px rgba(0,0,0,0.98),
      0 0 15px rgba(0,0,0,0.85);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    z-index: 50;
    backdrop-filter: blur(2px);
  }

  /* CRT Scanlines & Curved Glass vignette */
  .screen-aperture-fitted::before {
    content: " ";
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(
      rgba(10, 10, 10, 0) 50%, 
      rgba(0, 0, 0, 0.55) 50%
    );
    background-size: 100% 3px;
    z-index: 8;
    pointer-events: none;
  }

  .screen-aperture-fitted::after {
    content: " ";
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: radial-gradient(
      circle at center,
      rgba(255,255,255,0.01) 0%,
      rgba(0,0,0,0.45) 80%,
      rgba(0,0,0,0.9) 100%
    );
    z-index: 9;
    pointer-events: none;
  }

  /* VIDEO BACKGROUND LAYER */
  .crt-video-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    transition: opacity 0.4s ease;
    overflow: hidden;
  }

  .crt-video-layer iframe {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.35);
    filter: contrast(1.5) grayscale(0.85) brightness(0.65);
  }

  /* CRT TOP HEADER */
  .crt-header {
    background: rgba(12, 4, 4, 0.9);
    border-bottom: 1px dashed var(--crt-dim);
    color: var(--crt-phosphor);
    font-family: 'VT323', monospace;
    font-size: 1.05rem;
    padding: 4px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 1.5px;
    z-index: 10;
    text-shadow: 0 0 calc(6px * var(--beam-gain)) var(--crt-glow);
  }

  /* CRT TEXTAREA */
  #main-editor {
    position: relative;
    z-index: 5;
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--crt-phosphor);
    font-family: 'VT323', monospace;
    font-size: 1.35rem;
    line-height: 1.25;
    letter-spacing: 1px;
    padding: 10px 14px;
    text-shadow: 0 0 calc(6px * var(--beam-gain)) var(--crt-glow);
    white-space: pre-wrap;
    word-break: break-word;
    caret-color: var(--crt-highlight);
  }

  #main-editor::selection {
    background: var(--crt-phosphor);
    color: #000;
    text-shadow: none;
  }

  /* CRT FOOTER */
  .crt-footer {
    background: rgba(10, 4, 4, 0.95);
    border-top: 1px dashed var(--crt-dim);
    color: var(--crt-phosphor);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    padding: 4px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 1px;
    z-index: 10;
  }

  .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background-color: var(--crt-phosphor);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--crt-phosphor);
    animation: pulseLed 1.6s infinite;
  }

  @keyframes pulseLed {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* MODAL / CALIBRATION PANELS */
  .hud-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(18, 10, 10, 0.96);
    border: 1px solid var(--c-blood);
    border-radius: 4px;
    padding: 12px 16px;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.95);
    font-size: 0.72rem;
    max-width: 340px;
    display: none;
  }

  .hud-panel.show {
    display: block;
  }

  .hud-header {
    font-weight: bold;
    color: var(--c-white);
    margin-bottom: 8px;
    border-bottom: 1px solid var(--c-blood);
    padding-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
    gap: 8px;
  }

  .hud-row input[type="range"], .hud-row input[type="text"] {
    flex: 1;
    accent-color: var(--c-crimson);
    background: #0f0a0a;
    border: 1px solid #4a2828;
    color: #fff;
    padding: 3px 6px;
    font-family: inherit;
    font-size: 0.72rem;
  }
</style>
</head>

<script>
  const editor = document.getElementById('main-editor');
  const crtAperture = document.getElementById('crt-aperture');
  const saveStatus = document.getElementById('save-status');
  const statLine = document.getElementById('stat-line');
  const statWords = document.getElementById('stat-words');
  const statChars = document.getElementById('stat-chars');
  const crtClock = document.getElementById('crt-clock');
  
  const STORAGE_KEY = 'PWP_FITTED_TEXT_V5';
  const GEOM_KEY = 'PWP_FITTED_GEOM_V5';
  
  let audioEnabled = true;
  let videoEnabled = false;

  const DEFAULT_DOLL_TEXT = `TALAMASCA FIELD DOSSIER // CASE 666-TALTOS
TERMINAL: SMITH CORONA CRT [REALTIME URL-HASH ENGINE]
LOCATION: ATTIC OBSERVATORY // FIRST STREET HOUSE

----------------------------------------------------------------
1. THE APERTURE
The word processor terminal maps across the lower chamber,
stopping cleanly before the crimson stripe of porcelain faces.

2. LASHER / TALTOS RESONANCE
Mechanical key strikes activate non-volatile memory imprints.
All text compresses directly into your browser's address bar.

[Type and structure your dossier text below...]`;

  const DEFAULT_GEOM = { top: 31.8, left: 7.2, width: 32.8, height: 64.5 };

  // ==================== REALTIME URL COMPRESSION (EBCDIC/WORDSTAR ENGINE) ====================
  async function compressArticle(string) {
    if (!string) return '';
    const byteArray = new TextEncoder().encode(string);
    const stream = new CompressionStream('deflate-raw');
    const writer = stream.writable.getWriter();
    writer.write(byteArray);
    writer.close();
    const buffer = await new Response(stream.readable).arrayBuffer();
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
  }

  async function decompressArticle(b64) {
    if (!b64) return '';
    const byteArray = Uint8Array.from(
      atob(b64.replace(/-/g, "+").replace(/_/g, "/")), 
      c => c.charCodeAt(0)
    );
    const stream = new DecompressionStream('deflate-raw');
    const writer = stream.writable.getWriter();
    writer.write(byteArray);
    writer.close();
    const buffer = await new Response(stream.readable).arrayBuffer();
    return new TextDecoder().decode(buffer);
  }

  async function saveToUrlHash() {
    try {
      const hash = '#' + await compressArticle(editor.value);
      if (location.hash !== hash) {
        history.replaceState({}, '', hash);
      }
      localStorage.setItem(STORAGE_KEY, editor.value);
      saveStatus.textContent = 'URL MEMORY: SYNCED';
      saveStatus.style.color = 'var(--crt-phosphor)';
    } catch (e) {}
  }

  async function loadFromUrlHash() {
    try {
      if (location.hash && location.hash.length > 1) {
        const text = await decompressArticle(location.hash.slice(1));
        if (text) {
          editor.value = text;
          updateMetrics();
          return;
        }
      }
    } catch (e) {}
    
    // Fallback to local storage
    const saved = localStorage.getItem(STORAGE_KEY);
    editor.value = (saved !== null && saved.trim() !== '') ? saved : DEFAULT_DOLL_TEXT;
    updateMetrics();
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadFromUrlHash();

    const savedGeom = localStorage.getItem(GEOM_KEY);
    if (savedGeom) applyGeometry(JSON.parse(savedGeom));

    startClock();
  });

  // REALTIME INPUT LISTENER WITH RECOIL
  let saveDebounce;
  editor.addEventListener('input', () => {
    saveStatus.textContent = 'URL: COMPRESSING...';
    saveStatus.style.color = 'var(--crt-highlight)';
    clearTimeout(saveDebounce);
    saveDebounce = setTimeout(saveToUrlHash, 400);

    updateMetrics();
    playKeystrokeAudio();
  });

  // GSAP TACTILE KEYBOARD RECOIL
  editor.addEventListener('keydown', (e) => {
    if (typeof gsap === 'undefined') return;
    if (e.key === 'Enter') {
      gsap.fromTo(crtAperture, 
        { y: 3, rotate: -0.15 }, 
        { y: 0, rotate: 0, duration: 0.25, ease: "elastic.out(1.2, 0.4)" }
      );
    } else if (e.key.length === 1) {
      const rx = (Math.random() - 0.5) * 1.5;
      const ry = (Math.random() - 0.5) * 1.2;
      gsap.fromTo(crtAperture, { x: rx, y: ry }, { x: 0, y: 0, duration: 0.05 });
    }
  });

  editor.addEventListener('keyup', updateMetrics);
  editor.addEventListener('click', updateMetrics);

  function updateMetrics() {
    const text = editor.value;
    statChars.textContent = text.length;
    const words = text.trim().length > 0 ? text.trim().split(/\s+/).length : 0;
    statWords.textContent = words;

    const pos = editor.selectionStart;
    const lines = text.substring(0, pos).split("\n");
    statLine.textContent = lines.length;
  }

  // ==================== TALTOS RUNES CIPHER DECODER ====================
  const RUNES = "ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛈᛉᛋᛏᛒᛖᛗᛚᛜᛞᛟ§∆‡†∑√∫0101";
  function runTaltosCipher() {
    const originalText = editor.value;
    if (!originalText.trim()) return;

    let iteration = 0;
    const interval = setInterval(() => {
      editor.value = originalText
        .split('')
        .map((char, index) => {
          if (char === ' ' || char === '\n') return char;
          if (index < iteration) return originalText[index];
          return RUNES[Math.floor(Math.random() * RUNES.length)];
        })
        .join('');

      if (iteration >= originalText.length) {
        clearInterval(interval);
        editor.value = originalText;
        saveToUrlHash();
      }
      iteration += 4;
    }, 20);
    playKeystrokeAudio(300, 0.08);
  }

  // ==================== BEAM GAIN CONTROL ====================
  const beamGains = [0.6, 1.0, 1.5, 2.0];
  let beamIdx = 1;
  function cycleBeamGain() {
    beamIdx = (beamIdx + 1) % beamGains.length;
    const val = beamGains[beamIdx];
    document.documentElement.style.setProperty('--beam-gain', val);
    document.getElementById('beam-label').textContent = val.toFixed(1) + 'x';
    playKeystrokeAudio(500, 0.02);
  }

  // ==================== PHOSPHOR PALETTE ====================
  function setPhosphorTheme(theme) {
    document.body.setAttribute('data-theme', theme);
  }

  // ==================== VIDEO DECK HUD & PRESETS ====================
  function toggleVideoBackground() {
    videoEnabled = !videoEnabled;
    const vLayer = document.getElementById('video-layer');
    const vLabel = document.getElementById('vbg-label');
    const vBtn = document.getElementById('vbg-toggle');

    if (videoEnabled) {
      vLayer.style.opacity = 'var(--video-opacity)';
      vLabel.textContent = 'ON';
      vLabel.style.color = 'var(--crt-phosphor)';
      vBtn.classList.add('active');
    } else {
      vLayer.style.opacity = '0';
      vLabel.textContent = 'OFF';
      vLabel.style.color = 'var(--c-silver)';
      vBtn.classList.remove('active');
    }
  }

  function toggleVideoHUD() {
    document.getElementById('video-hud').classList.toggle('show');
  }

  function applyVideoPreset(val) {
    const customRow = document.getElementById('custom-vid-row');
    if (val === 'custom') {
      customRow.style.display = 'flex';
      return;
    }
    customRow.style.display = 'none';
    setIframeVideo(val);
  }

  function setCustomVideo(val) {
    let id = val.trim();
    if (id.includes('v=')) id = id.split('v=')[1].split('&')[0];
    if (id.includes('youtu.be/')) id = id.split('youtu.be/')[1].split('?')[0];
    setIframeVideo(id);
  }

  function setIframeVideo(id) {
    const iframe = document.getElementById('video-iframe');
    iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&playsinline=1`;
  }

  function setVideoOpacity(val) {
    document.getElementById('val-vopacity').textContent = val;
    document.documentElement.style.setProperty('--video-opacity', (val / 100).toFixed(2));
  }

  // ==================== AUDIO SYNTHESIS ====================
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function toggleAudioFeedback() {
    audioEnabled = !audioEnabled;
    const lbl = document.getElementById('audio-label');
    const btn = document.getElementById('audio-toggle');
    lbl.textContent = audioEnabled ? 'ON' : 'MUTED';
    lbl.style.color = audioEnabled ? 'var(--c-white)' : 'var(--c-silver)';
    if (audioEnabled) btn.classList.add('active');
    else btn.classList.remove('active');
  }

  function playKeystrokeAudio(freq = 140, duration = 0.035) {
    if (!audioEnabled) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq + Math.random() * 60, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration + 0.005);
    } catch (e) {}
  }

  // ==================== STORE .TXT & LOAD ====================
  function storeDataDisk() {
    const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `TALAMASCA_DATADISK_${new Date().toISOString().slice(0,10)}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function loadExternalFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      editor.value = event.target.result;
      saveToUrlHash();
      updateMetrics();
    };
    reader.readAsText(file);
  }

  // ==================== APERTURE CALIBRATOR ====================
  function toggleCalibrator() {
    document.getElementById('calibrator').classList.toggle('show');
  }

  function updateGeometry() {
    const top = document.getElementById('cal-top').value;
    const left = document.getElementById('cal-left').value;
    const width = document.getElementById('cal-width').value;
    const height = document.getElementById('cal-height').value;

    document.getElementById('val-top').textContent = top;
    document.getElementById('val-left').textContent = left;
    document.getElementById('val-width').textContent = width;
    document.getElementById('val-height').textContent = height;

    applyGeometry({ top, left, width, height });
  }

  function applyGeometry(g) {
    crtAperture.style.top = g.top + '%';
    crtAperture.style.left = g.left + '%';
    crtAperture.style.width = g.width + '%';
    crtAperture.style.height = g.height + '%';

    document.getElementById('cal-top').value = g.top;
    document.getElementById('cal-left').value = g.left;
    document.getElementById('cal-width').value = g.width;
    document.getElementById('cal-height').value = g.height;

    document.getElementById('val-top').textContent = g.top;
    document.getElementById('val-left').textContent = g.left;
    document.getElementById('val-width').textContent = g.width;
    document.getElementById('val-height').textContent = g.height;
  }

  function saveGeometry() {
    const g = {
      top: document.getElementById('cal-top').value,
      left: document.getElementById('cal-left').value,
      width: document.getElementById('cal-width').value,
      height: document.getElementById('cal-height').value
    };
    localStorage.setItem(GEOM_KEY, JSON.stringify(g));
    alert('Aperture coordinates locked into localStorage!');
  }

  function resetGeometry() {
    applyGeometry(DEFAULT_GEOM);
    localStorage.removeItem(GEOM_KEY);
  }

  function startClock() {
    function tick() {
      const d = new Date();
      crtClock.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }
    tick();
    setInterval(tick, 1000);
  }

  // ==================== RED CRT LASER POINTER TRAIL ====================
  (function initPointerTrail() {
    const canvas = document.getElementById('trailCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, dpr;
    const pts = [];
    const LIFE = 400;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', (e) => {
      pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    });

    function render() {
      requestAnimationFrame(render);
      const now = performance.now();
      while (pts.length && now - pts[0].t > LIFE) pts.shift();

      ctx.clearRect(0, 0, W, H);
      if (pts.length < 2) return;

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 1; i < pts.length; i++) {
        const progress = (now - pts[i].t) / LIFE;
        const alpha = Math.max(0, Math.min(1, (1 - progress) * 1.3));
        ctx.strokeStyle = `rgba(230, 28, 28, ${alpha.toFixed(3)})`;
        ctx.shadowColor = 'rgba(255, 51, 51, 0.8)';
        ctx.shadowBlur = 4;
        ctx.lineWidth = 1.4;

        ctx.beginPath();
        ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
        ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
      }
    }
    render();
  })();
</script>
