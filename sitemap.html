<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKREALM // INDEX</title>
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/ghostm68/inktwo@main/svg/inky.svg">
  <style>
    :root, [data-theme="dark"] {
      --bg: #050505;
      --text: #f0f0f0;
      --text-dim: #999;
      --accent: #ff0033;
      --header-bg: rgba(5, 5, 5, 0.88);
      --border: #333;
      --font: 'Courier New', Courier, monospace;
    }

    [data-theme="light"] {
      --bg: #f0ebe3;
      --text: #111;
      --text-dim: #444;
      --accent: #c00;
      --header-bg: rgba(240, 235, 227, 0.94);
      --border: #bbb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: #000;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Full-screen background video */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.28;
      filter: grayscale(25%) contrast(115%);
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 15%, rgba(0,0,0,0.82) 78%);
      z-index: 1;
      pointer-events: none;
    }

    /* Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo-container {
      width: 190px;
      max-width: 45vw;
    }

    .splash-logo {
      width: 100%;
      height: auto;
      max-height: 44px;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.3));
    }

    .logo-text { fill: var(--text); }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .theme-btn, .support-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 11px;
      padding: 5px 10px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s;
    }
    .theme-btn:hover, .support-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Masthead */
    .masthead {
      position: relative;
      z-index: 20;
      max-width: 900px;
      margin: 20px auto 6px;
      padding: 0 20px;
      text-align: center;
    }
    .masthead h1 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }
    .masthead p {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .masthead a {
      color: var(--accent);
      text-decoration: none;
    }
    .masthead a:hover { text-decoration: underline; }

    /* Stage – the circular orbit */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: min(78vh, 720px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .orbit-wrap {
      position: relative;
      width: min(94vw, 760px);
      height: min(94vw, 760px);
    }

    .orbit {
      position: absolute;
      inset: 0;
      animation: spin 140s linear infinite;
    }

    .orbit-wrap:hover .orbit,
    .orbit-wrap:hover .node-label {
      animation-play-state: paused;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .node {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 1px;
    }

    .node-label {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: clamp(9px, 1.4vw, 12px);
      letter-spacing: 0.6px;
      color: var(--text);
      text-decoration: none;
      padding: 4px 8px;
      border: 1px solid transparent;
      background: rgba(0,0,0,0.45);
      border-radius: 2px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      text-shadow: 0 1px 3px #000;
      animation: counter-spin 140s linear infinite;
    }

    .node-label:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(0,0,0,0.75);
      z-index: 30;
    }

    @keyframes counter-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    /* Center triangle video */
    .triangle-video-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(22vw, 170px);
      height: min(22vw, 170px);
      z-index: 25;
      pointer-events: none;
    }

    .triangle-inner-video {
      width: 100%;
      height: 100%;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      overflow: hidden;
      border: 1px solid var(--accent);
      box-shadow: 0 0 28px rgba(255, 0, 51, 0.4);
      background: #000;
    }

    .triangle-inner-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Footer */
    .bottom-bar {
      position: relative;
      z-index: 20;
      border-top: 1px solid var(--border);
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .bottom-bar a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .bottom-bar a:hover { color: var(--accent); }
    .footer-links { display: flex; gap: 14px; flex-wrap: wrap; }

    /* Light theme tweaks */
    [data-theme="light"] .bg-video {
      opacity: 0.18;
      filter: grayscale(40%) brightness(1.15);
    }
    [data-theme="light"] .vignette {
      background: radial-gradient(ellipse at center, transparent 10%, rgba(240,235,227,0.75) 80%);
    }
    [data-theme="light"] .node-label {
      background: rgba(255,255,255,0.7);
      text-shadow: none;
    }
    [data-theme="light"] .node-label:hover {
      background: rgba(255,255,255,0.95);
    }

    @media (max-width: 640px) {
      .orbit-wrap {
        width: 96vw;
        height: 96vw;
      }
      .node-label {
        font-size: 9px;
        padding: 2px 5px;
      }
      .triangle-video-frame {
        width: 24vw;
        height: 24vw;
      }
      .header-logo-container { width: 140px; }
      .stage { height: 70vh; }
    }
  </style>
</head>

  <script>
    const pages = [
      { name: "1991", url: "https://inkrealm.info/1991" },
      { name: "2741", url: "https://inkrealm.info/2741" },

      { name: "Coven", url: "https://inkrealm.info/coven" },
      { name: "Deluxe", url: "https://inkrealm.info/deluxe" },
      { name: "Fadeaway", url: "https://inkrealm.info/fadeaway" },

      { name: "Poesia", url: "https://inkrealm.info/poesia" },
      { name: "Quantum", url: "https://inkrealm.info/quantum" },
      { name: "Ravenlux", url: "https://inkrealm.info/ravenlux" },
      { name: "Reader", url: "https://inkrealm.info/reader" },
      { name: "Runway", url: "https://inkrealm.info/runway" },
      { name: "Sanctum", url: "https://inkrealm.info/sanctum" },
      { name: "Satellite", url: "https://inkrealm.info/satellite" },
      { name: "SVG", url: "https://inkrealm.info/svg" },
      { name: "SynthWord", url: "https://inkrealm.info/synthword" },
      { name: "Telegraph", url: "https://inkrealm.info/telegraph" },
      { name: "TikTok Quick", url: "https://inkrealm.info/tiktok/quick" },
      { name: "Trix", url: "https://inkrealm.info/trix" },
      { name: "TVC15", url: "https://inkrealm.info/tvc15" },
      { name: "Two Skinny Girls", url: "https://inkrealm.info/twoskinnygirls" },
      { name: "View 1991", url: "https://inkrealm.info/view1991" }
    ];

    const orbit = document.getElementById('orbit');
    const total = pages.length;
    const radiusPct = 48;

    pages.forEach((page, i) => {
      const angle = (i / total) * 360 - 90; // start from top
      const rad = angle * Math.PI / 180;
      const x = 50 + radiusPct * Math.cos(rad);
      const y = 50 + radiusPct * Math.sin(rad);

      const node = document.createElement('div');
      node.className = 'node';
      node.style.left = x + '%';
      node.style.top = y + '%';

      const link = document.createElement('a');
      link.className = 'node-label';
      link.href = page.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = page.name;
      node.appendChild(link);
      orbit.appendChild(node);
    });

    /* Theme */
    const themeBtn = document.getElementById('themeToggle');
    const root = document.documentElement;

    function setTheme(t) {
      root.setAttribute('data-theme', t);
      localStorage.setItem('inkrealm-theme', t);
      themeBtn.textContent = t === 'dark' ? 'LIGHT' : 'DARK';
    }
    setTheme(localStorage.getItem('inkrealm-theme') || 'dark');
    themeBtn.addEventListener('click', () => {
      setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  </script>
