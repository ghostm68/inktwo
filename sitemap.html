<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKREALM // INDEX</title>
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/ghostm68/inktwo@main/svg/inky.svg">
  <script src="https://www.paypal.com/sdk/js?client-id=sb&components=hosted-buttons"></script>
  <style>
    :root, [data-theme="dark"] {
      --bg: #050505;
      --bg-elevated: #0c0c0c;
      --bg-card: rgba(14, 14, 16, 0.92);
      --bg-card-hover: rgba(22, 22, 26, 0.98);
      --border: #222;
      --border-focus: #ff0033;
      --text: #e8e8e8;
      --text-dim: #777;
      --accent: #ff0033;
      --accent-dim: rgba(255, 0, 51, 0.15);
      --header-bg: rgba(5, 5, 5, 0.92);
      --input-bg: #000;
      --font: 'Courier New', Courier, monospace;
    }

    [data-theme="light"] {
      --bg: #f4f1ea;
      --bg-elevated: #ebe6db;
      --bg-card: rgba(255, 252, 245, 0.95);
      --bg-card-hover: #fff;
      --border: #ccc;
      --border-focus: #c00;
      --text: #1a1a1a;
      --text-dim: #555;
      --accent: #c00;
      --accent-dim: rgba(204, 0, 0, 0.1);
      --header-bg: rgba(244, 241, 234, 0.94);
      --input-bg: #fff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      line-height: 1.4;
      transition: background 0.25s ease, color 0.25s ease;
    }

    ::selection {
      background: var(--accent);
      color: #000;
    }

    /* Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo-link {
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: 700;
      white-space: nowrap;
    }
    .logo-link span { color: var(--accent); }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
    }

    #node-search {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 12px;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }
    #node-search:focus { border-color: var(--accent); }

    .theme-btn, .support-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .theme-btn:hover, .support-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Masthead */
    .masthead {
      max-width: 1100px;
      margin: 28px auto 8px;
      padding: 0 20px;
    }
    .masthead h1 {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1.5px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .masthead p {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .masthead a {
      color: var(--accent);
      text-decoration: none;
    }
    .masthead a:hover { text-decoration: underline; }

    /* Counter + status */
    .status-line {
      max-width: 1100px;
      margin: 0 auto 18px;
      padding: 0 20px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-line .count { color: var(--accent); }

    /* Grid */
    .catalog {
      max-width: 1100px;
      margin: 0 auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }

    .node-tile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      min-height: 56px;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }
    .node-tile:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      transform: translateX(3px);
    }
    .node-tile:hover .node-title { color: var(--accent); }

    .node-thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: #111;
    }

    .node-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* PayPal modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 2000;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border-focus);
      max-width: 380px;
      width: 100%;
      padding: 20px;
      position: relative;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    #paypal-container-R9N4AVXQZV5NS {
      min-height: 40px;
    }

    /* Footer */
    .bottom-bar {
      border-top: 1px solid var(--border);
      background: var(--bg-elevated);
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .bottom-bar a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .bottom-bar a:hover { color: var(--accent); }
    .footer-links { display: flex; gap: 14px; flex-wrap: wrap; }

    /* Empty state */
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 640px) {
      .catalog { grid-template-columns: 1fr; }
      #node-search { width: 140px; }
      .top-bar { padding: 10px 14px; }
      .masthead { margin-top: 20px; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="https://inkrealm.info/" class="logo-link" aria-label="Inkrealm Home">
      INK<span>REALM</span>
    </a>
    <div class="header-controls">
      <div class="search-wrap">
        <input type="text" id="node-search" placeholder="Search nodes..." autocomplete="off" aria-label="Search">
      </div>
      <button type="button" class="theme-btn" id="themeToggle" title="Toggle theme">THEME</button>
      <button type="button" class="support-btn" id="supportBtn" onclick="openSupport()">SUPPORT</button>
    </div>
  </header>

  <section class="masthead">
    <h1>// INDEX — full directory of the realm</h1>
    <p>Writer · musician · artist. Origin story at <a href="https://inkrealm.info/about">about</a>. Parallel frequency: <a href="https://wordstar.nexus" target="_blank" rel="noopener">wordstar.nexus</a></p>
  </section>

  <div class="status-line">
    <span>NODES: <span class="count" id="counter">0</span></span>
    <span>SYSTEM STATUS: <span style="color:var(--accent)">OPERATIONAL</span></span>
  </div>

  <main class="catalog" id="catalog"></main>

  <footer class="bottom-bar">
    <div>&copy; INKREALM</div>
    <div class="footer-links">
      <a href="https://tidal.com/browse/artist/15916023" target="_blank" rel="noopener">Tidal</a>
      <a href="https://music.apple.com/us/artist/two-skinny-girls/1466240185" target="_blank" rel="noopener">Apple Music</a>
      <a href="https://www.redbubble.com/people/inky99/shop" target="_blank" rel="noopener" style="color:var(--accent)">Shop</a>
      <a href="https://wordstar.nexus" target="_blank" rel="noopener">WordStar Nexus</a>
      <a href="https://inkrealm.info/about">Contact / About</a>
    </div>
    <div>NO TRACKERS · NO COOKIES</div>
  </footer>

  <!-- Support Modal -->
  <div id="supportModal" class="modal-backdrop" onclick="if(event.target===this) closeSupport()">
    <div class="modal-panel">
      <div class="modal-header">
        <span>// SUPPORT THE REALM</span>
        <button type="button" class="modal-close" onclick="closeSupport()" aria-label="Close">✕</button>
      </div>
      <div id="paypal-container-R9N4AVXQZV5NS"></div>
    </div>
  </div>

  <script>
    /* ========== DATA ========== */
    const directory = [
      { name: "1991", url: "https://inkrealm.info/1991", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/the-horse-skull-on-blue.jpg" },
      { name: "2741", url: "https://inkrealm.info/2741", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/picassojson1.jpg" },
      { name: "About", url: "https://inkrealm.info/about", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro.inkrealm%20(1).jpeg" },
      { name: "Apartment 7A", url: "https://inkrealm.info/apartment7A", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Michelangelo-Conversion-of-Saul.jpg" },
      { name: "App", url: "https://inkrealm.info/app", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/d6280e_2fd3d9fcf33543849e43d2a7ce753aeb~mv2.jpg" },
      { name: "Atari", url: "https://inkrealm.info/atari", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/wetstichler3.gif" },
      { name: "Brush", url: "https://inkrealm.info/brush", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/7f8605cbdd174dcf8ff777756ee92018.gif" },
      { name: "Cloud", url: "https://inkrealm.info/cloud", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/VAPORGRAM.wildfiremap1736434961088.gif" },
      { name: "Codex 1991", url: "https://inkrealm.info/codex1991", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/laracosima.wordstar.gif" },
      { name: "Cover", url: "https://inkrealm.info/cover", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/misfits.jpg" },
      { name: "Coven", url: "https://inkrealm.info/coven", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Minaro.zone.wordstar_240108_223759.gif" },
      { name: "Deluxe", url: "https://inkrealm.info/deluxe", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/runetime.gif" },
      { name: "Fadeaway", url: "https://inkrealm.info/fadeaway", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/emilee.inkrealm.164841611766.gif" },
      { name: "Fashion", url: "https://inkrealm.info/fashion", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/rachelchaleff22625.jpg" },
      { name: "Fount", url: "https://inkrealm.info/fount", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/the-horse-skull-on-blue.jpg" },
      { name: "Home", url: "https://inkrealm.info/", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/inkrealm2012lg.gif" },
      { name: "I.E.", url: "https://inkrealm.info/ie", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/guitartownindia.gif" },
      { name: "Ironclad", url: "https://inkrealm.info/ironclad", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Diego_Velázquez_053.jpg" },
      { name: "Isis", url: "https://inkrealm.info/isis", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/nova312.gif" },
      { name: "Minraud", url: "https://inkrealm.info/minraud", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/nova312.gif" },
      { name: "Poesia", url: "https://inkrealm.info/poesia", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro_20231218-091002.jpeg" },
      { name: "Quantum", url: "https://inkrealm.info/quantum", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/picassojson1.jpg" },
      { name: "Ravenlux", url: "https://inkrealm.info/ravenlux", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/wetstichler3.gif" },
      { name: "Reader", url: "https://inkrealm.info/reader", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro20231219-112218-01.jpeg" },
      { name: "Runway", url: "https://inkrealm.info/runway", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro_231228_154635.gif" },
      { name: "Sanctum", url: "https://inkrealm.info/sanctum", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaroh03001300804.jpg" },
      { name: "Satellite", url: "https://inkrealm.info/satellite", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/d6280e_2fd3d9fcf33543849e43d2a7ce753aeb~mv2.jpg" },
      { name: "SVG", url: "https://inkrealm.info/svg", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/VAPORGRAM.wildfiremap1736434961088.gif" },
      { name: "SynthWord", url: "https://inkrealm.info/synthword", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro.bailey2.jpeg" },
      { name: "Telegraph", url: "https://inkrealm.info/telegraph", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/7f8605cbdd174dcf8ff777756ee92018.gif" },
      { name: "TikTok Quick", url: "https://inkrealm.info/tiktok/quick", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Media_230212_132842.gif" },
      { name: "Trix", url: "https://inkrealm.info/trix", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/inkrealm2012lg.gif" },
      { name: "TVC15", url: "https://inkrealm.info/tvc15", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro_231228_154635.gif" },
      { name: "Two Skinny Girls", url: "https://inkrealm.info/twoskinnygirls", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Minaro_231218_074117.gif" },
      { name: "View 1991", url: "https://inkrealm.info/view1991", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/laracosima.wordstar.gif" }
    ];

    /* sort once */
    directory.sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true, sensitivity: 'base' }));

    const catalog = document.getElementById('catalog');
    const searchField = document.getElementById('node-search');
    const counterEl = document.getElementById('counter');
    counterEl.textContent = directory.length;

    function render(query = '') {
      catalog.innerHTML = '';
      const q = query.toLowerCase().trim();
      const filtered = directory.filter(item => item.name.toLowerCase().includes(q));

      if (filtered.length === 0) {
        catalog.innerHTML = '<div class="empty-msg">// NO MATCHING NODES</div>';
        return;
      }

      filtered.forEach(node => {
        const a = document.createElement('a');
        a.className = 'node-tile';
        a.href = node.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `
          <img class="node-thumb" src="${node.img}" alt="" loading="lazy" onerror="this.style.opacity='0.3'">
          <span class="node-title">${node.name}</span>
        `;
        catalog.appendChild(a);
      });
    }

    searchField.addEventListener('input', e => render(e.target.value));

    /* Theme */
    const themeBtn = document.getElementById('themeToggle');
    const root = document.documentElement;

    function setTheme(t) {
      root.setAttribute('data-theme', t);
      localStorage.setItem('inkrealm-theme', t);
      themeBtn.textContent = t === 'dark' ? 'LIGHT' : 'DARK';
    }

    const saved = localStorage.getItem('inkrealm-theme') || 'dark';
    setTheme(saved);

    themeBtn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });

    /* Support modal + PayPal */
    function openSupport() {
      document.getElementById('supportModal').classList.add('active');
      // render button only once
      if (!window.__paypalRendered) {
        try {
          paypal.HostedButtons({
            hostedButtonId: "R9N4AVXQZV5NS",
          }).render("#paypal-container-R9N4AVXQZV5NS");
          window.__paypalRendered = true;
        } catch (e) {
          document.getElementById('paypal-container-R9N4AVXQZV5NS').innerHTML =
            '<p style="font-size:11px;color:var(--text-dim);">PayPal button loading… or visit the main site to support.</p>';
        }
      }
    }
    function closeSupport() {
      document.getElementById('supportModal').classList.remove('active');
    }

    // initial
    render();
  </script>
</body>
</html>
