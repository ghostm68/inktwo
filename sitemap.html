<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKREALM // INDEX</title>
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/ghostm68/inktwo@main/svg/inky.svg">
  <style>
    :root, [data-theme="dark"] {
      --bg: #050505;
      --bg-elevated: #0c0c0c;
      --bg-card: rgba(14, 14, 16, 0.92);
      --bg-card-hover: rgba(22, 22, 26, 0.98);
      --border: #222;
      --border-focus: #ff0033;
      --text: #e8e8e8;
      --text-dim: #777;
      --accent: #ff0033;
      --header-bg: rgba(5, 5, 5, 0.92);
      --font: 'Courier New', Courier, monospace;
    }

    [data-theme="light"] {
      --bg: #f4f1ea;
      --bg-elevated: #ebe6db;
      --bg-card: rgba(255, 252, 245, 0.95);
      --bg-card-hover: #fff;
      --border: #ccc;
      --border-focus: #c00;
      --text: #1a1a1a;
      --text-dim: #555;
      --accent: #c00;
      --header-bg: rgba(244, 241, 234, 0.94);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      line-height: 1.4;
      transition: background 0.25s ease, color 0.25s ease;
    }

    ::selection {
      background: var(--accent);
      color: #000;
    }

    /* Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-logo-container {
      width: 200px;
      max-width: 48vw;
      display: flex;
      align-items: center;
    }

    .splash-logo {
      width: 100%;
      height: auto;
      max-height: 48px;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.35));
    }

    .logo-text { fill: var(--text); }
    [data-theme="light"] .logo-text { fill: #111; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-btn, .support-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 11px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .theme-btn:hover, .support-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Masthead */
    .masthead {
      max-width: 1100px;
      margin: 28px auto 10px;
      padding: 0 20px;
    }
    .masthead h1 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1.5px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .masthead p {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .masthead a {
      color: var(--accent);
      text-decoration: none;
    }
    .masthead a:hover { text-decoration: underline; }

    /* Status */
    .status-line {
      max-width: 1100px;
      margin: 0 auto 18px;
      padding: 0 20px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-line .count { color: var(--accent); }

    /* Grid */
    .catalog {
      max-width: 1100px;
      margin: 0 auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 8px;
    }

    .node-tile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      min-height: 54px;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }
    .node-tile:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      transform: translateX(3px);
    }
    .node-tile:hover .node-title { color: var(--accent); }

    .node-thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: #111;
    }

    .node-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Support Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 2000;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border-focus);
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    #paypal-container-R9N4AVXQZV5NS {
      min-height: 45px;
      display: flex;
      justify-content: center;
    }

    /* Footer */
    .bottom-bar {
      border-top: 1px solid var(--border);
      background: var(--bg-elevated);
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .bottom-bar a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .bottom-bar a:hover { color: var(--accent); }
    .footer-links { display: flex; gap: 14px; flex-wrap: wrap; }

    @media (max-width: 640px) {
      .catalog { grid-template-columns: 1fr; }
      .header-logo-container { width: 150px; }
      .top-bar { padding: 8px 14px; }
      .masthead { margin-top: 20px; }
    }
  </style>
</head>
<body>

      { name: "SVG", url: "https://inkrealm.info/svg", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/VAPORGRAM.wildfiremap1736434961088.gif" },

      { name: "Telegraph", url: "https://inkrealm.info/telegraph", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Media_230212_132842.gif" },
      { name: "TikTok Quick", url: "https://inkrealm.info/tiktok/quick", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Media_230212_132842.gif" },

      { name: "TVC15", url: "https://inkrealm.info/tvc15", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro_231228_154635.gif" },

    ];

    directory.sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true, sensitivity: 'base' }));

    const catalog = document.getElementById('catalog');
    const counterEl = document.getElementById('counter');
    counterEl.textContent = directory.length;

    function render() {
      catalog.innerHTML = '';
      directory.forEach(node => {
        const a = document.createElement('a');
        a.className = 'node-tile';
        a.href = node.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `
          <img class="node-thumb" src="${node.img}" alt="" loading="lazy" onerror="this.style.opacity='0.25'">
          <span class="node-title">${node.name}</span>
        `;
        catalog.appendChild(a);
      });
    }

    /* Theme */
    const themeBtn = document.getElementById('themeToggle');
    const root = document.documentElement;

    function setTheme(t) {
      root.setAttribute('data-theme', t);
      localStorage.setItem('inkrealm-theme', t);
      themeBtn.textContent = t === 'dark' ? 'LIGHT' : 'DARK';
    }

    setTheme(localStorage.getItem('inkrealm-theme') || 'dark');

    themeBtn.addEventListener('click', () => {
      setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* Support / PayPal */
    let paypalReady = false;
    function openSupport() {
      document.getElementById('supportModal').classList.add('active');
      if (!paypalReady && typeof paypal !== 'undefined') {
        try {
          paypal.HostedButtons({
            hostedButtonId: "R9N4AVXQZV5NS"
          }).render("#paypal-container-R9N4AVXQZV5NS");
          paypalReady = true;
        } catch (err) {
          document.getElementById('paypal-container-R9N4AVXQZV5NS').innerHTML =
            '<p style="font-size:11px;color:var(--text-dim);text-align:center;padding:12px 0;">PayPal button unavailable offline or client-id needs update.<br>Replace client-id=sb with your live merchant ID.</p>';
        }
      }
    }
    function closeSupport() {
      document.getElementById('supportModal').classList.remove('active');
    }

    render();
  </script>
