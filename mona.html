  :root {
    /* STRICT DOMAIN PALETTE */
    --c-black: #050404;
    --c-dark-gray: #100d0d;
    --c-mid-gray: #211c1c;
    --c-silver: #a39c9b;
    --c-white: #f5f2ef;
    --c-crimson: #e61c1c;
    --c-blood: #820e0e;
    
    /* DEFAULT PHOSPHOR: BLOOD CRIMSON */
    --crt-phosphor: #ff3333;
    --crt-glow: rgba(255, 51, 51, 0.65);
    --crt-dim: #540e0e;
    --crt-bg: rgba(10, 4, 4, 0.90);
    --crt-highlight: #ffffff;
    --video-opacity: 0.40;
    
    /* TYPOGRAPHY */
    --editor-font: 'VT323', monospace;
    --editor-weight: normal;
    --editor-style: normal;
  }

  [data-theme="white"] {
    --crt-phosphor: #f0f0f0;
    --crt-glow: rgba(240, 240, 240, 0.5);
    --crt-dim: #444444;
    --crt-bg: rgba(8, 8, 8, 0.92);
    --crt-highlight: #ffffff;
  }

  [data-theme="bone"] {
    --crt-phosphor: #d6cfc5;
    --crt-glow: rgba(214, 207, 197, 0.4);
    --crt-dim: #423d38;
    --crt-bg: rgba(12, 10, 10, 0.92);
    --crt-highlight: #ffffff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--c-black);
    color: var(--c-silver);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding-bottom: 90px;
  }

  /* FULLSCREEN CRT LASER CURSOR TRAIL */
  #trailCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99999;
  }

  /* ==================== SLEEK HEADER ==================== */
  header.hardware-shelf {
    width: 100%;
    background: linear-gradient(180deg, #140d0d 0%, #080505 100%);
    border-bottom: 1px solid var(--c-blood);
    padding: 6px 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    z-index: 100;
  }

  .brand-zone {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .pwp-svg-emblem {
    height: 30px;
  }

  .brand-title {
    font-family: 'Cinzel', serif;
    font-size: 0.88rem;
    letter-spacing: 2px;
    color: var(--c-white);
  }

  .brand-sub {
    font-size: 0.6rem;
    color: var(--c-silver);
    letter-spacing: 1px;
  }

  .status-cluster {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.68rem;
    color: var(--c-silver);
    letter-spacing: 1px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background-color: var(--c-crimson);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--c-crimson);
    animation: breathDot 2s infinite ease-in-out;
  }

  @keyframes breathDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.85); }
  }

  .url-copy-badge {
    background: rgba(138, 14, 14, 0.25);
    border: 1px solid var(--c-blood);
    color: var(--c-white);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    outline: none;
  }

  .url-copy-badge:hover {
    background: var(--c-crimson);
    color: #fff;
    box-shadow: 0 0 10px rgba(230, 28, 28, 0.6);
    border-color: var(--c-crimson);
  }

  /* ==================== COLLAGE VIEWPORT & CRT ==================== */
  .collage-viewport {
    position: relative;
    width: 100%;
    max-width: 1600px;
    margin: 8px auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.98);
    border: 1px solid #2e1111;
    background: #000;
    overflow: hidden;
  }

  .collage-base-img {
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
    pointer-events: none;
    animation: analogDrift 14s infinite ease-in-out;
  }

  @keyframes analogDrift {
    0%, 88%, 100% { filter: contrast(1.08) brightness(0.95); transform: translate(0, 0); }
    89% { filter: contrast(1.3) brightness(1.2) drop-shadow(-2px 0 0 rgba(230, 28, 28, 0.7)); transform: translate(-1px, 1px); }
    90% { filter: contrast(1.1) brightness(0.9) drop-shadow(2px 0 0 rgba(255, 255, 255, 0.7)); transform: translate(1px, -1px); }
    92% { filter: contrast(1.08) brightness(0.95); transform: translate(0, 0); }
    96% { filter: contrast(1.25) brightness(1.1) drop-shadow(-3px 0 0 rgba(230, 28, 28, 0.8)); transform: translate(2px, 0); }
    97% { filter: contrast(1.08) brightness(0.95); transform: translate(0, 0); }
  }

  /* CONSTRAINED LEFT-PANEL CRT SCREEN */
  .screen-aperture-fitted {
    position: absolute;
    top: 31.8%;
    left: 7.2%;
    width: 32.8%;
    height: 64.5%;
    background: var(--crt-bg);
    border: 1.5px solid var(--c-blood);
    border-radius: 4px;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.98), 0 0 15px rgba(0,0,0,0.85);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    z-index: 50;
    backdrop-filter: blur(2px);
  }

  .screen-aperture-fitted::before {
    content: " ";
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(10, 10, 10, 0) 50%, rgba(0, 0, 0, 0.55) 50%);
    background-size: 100% 3px;
    z-index: 8;
    pointer-events: none;
  }

  .screen-aperture-fitted::after {
    content: " ";
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.01) 0%, rgba(0,0,0,0.45) 80%, rgba(0,0,0,0.9) 100%);
    z-index: 9;
    pointer-events: none;
  }

  .crt-video-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    transition: opacity 0.4s ease;
    overflow: hidden;
  }

  .crt-video-layer iframe {
    width: 100%; height: 100%; object-fit: cover; transform: scale(1.35);
    filter: contrast(1.5) grayscale(0.85) brightness(0.65);
  }

  .crt-header {
    background: rgba(12, 4, 4, 0.9);
    border-bottom: 1px dashed var(--crt-dim);
    color: var(--crt-phosphor);
    font-family: 'VT323', monospace;
    font-size: 1.05rem;
    padding: 3px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 1.5px;
    z-index: 10;
    text-shadow: 0 0 6px var(--crt-glow);
  }

  #main-editor {
    position: relative;
    z-index: 5;
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--crt-phosphor);
    font-family: var(--editor-font);
    font-weight: var(--editor-weight);
    font-style: var(--editor-style);
    font-size: 1.35rem;
    line-height: 1.25;
    letter-spacing: 1px;
    padding: 10px 14px;
    text-shadow: 0 0 6px var(--crt-glow);
    white-space: pre-wrap;
    word-break: break-word;
    caret-color: var(--crt-highlight);
  }

  #main-editor::selection {
    background: var(--crt-phosphor);
    color: #000;
    text-shadow: none;
  }

  .crt-footer {
    background: rgba(10, 4, 4, 0.95);
    border-top: 1px dashed var(--crt-dim);
    color: var(--crt-phosphor);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    padding: 3px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 1px;
    z-index: 10;
  }

  /* ==================== FLUID HOVER-UP DOCK ==================== */
  .hover-dock-wrapper {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9000;
  }

  .hover-dock {
    position: relative;
    background: rgba(18, 12, 12, 0.82);
    backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(138, 14, 14, 0.5);
    box-shadow: 0 10px 35px rgba(0,0,0,0.9), 0 0 15px rgba(138, 14, 14, 0.2);
    border-radius: 40px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateY(0) scale(0.96);
  }

  .hover-dock-wrapper:hover .hover-dock {
    transform: translateY(-8px) scale(1);
    background: rgba(22, 12, 12, 0.96);
    border-color: var(--c-crimson);
    box-shadow: 0 16px 45px rgba(0,0,0,0.98), 0 0 25px rgba(230, 28, 28, 0.35);
  }

  .dock-section {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dock-divider {
    width: 1px;
    height: 18px;
    background: rgba(255, 255, 255, 0.12);
  }

  .dock-select {
    background: transparent;
    border: none;
    color: var(--c-white);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 1px;
    outline: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    transition: color 0.2s;
  }

  .dock-select option {
    background: #140d0d;
    color: #fff;
  }

  .dock-pill {
    background: transparent;
    border: 1px solid transparent;
    color: var(--c-silver);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 5px 9px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    outline: none;
  }

  .dock-pill:hover {
    color: var(--c-white);
    background: rgba(230, 28, 28, 0.15);
  }

  .dock-pill.active {
    color: var(--c-white);
    border-color: var(--c-crimson);
    background: rgba(230, 28, 28, 0.25);
    box-shadow: 0 0 10px rgba(230, 28, 28, 0.4);
  }

  /* BOLD & ITALIC TOGGLES */
  .type-toggle {
    font-family: 'Cinzel', serif;
    font-weight: 800;
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--c-silver);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.75rem;
    background: transparent;
    outline: none;
  }

  .type-toggle:hover {
    color: #fff;
    border-color: var(--c-crimson);
  }

  .type-toggle.active {
    background: var(--c-crimson);
    color: #fff;
    border-color: var(--c-crimson);
    box-shadow: 0 0 8px rgba(230, 28, 28, 0.6);
  }

  /* MODAL HUD */
  .hud-panel {
    position: fixed;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(18, 10, 10, 0.98);
    border: 1px solid var(--c-blood);
    border-radius: 8px;
    padding: 12px 18px;
    z-index: 9999;
    box-shadow: 0 15px 40px rgba(0,0,0,0.98);
    font-size: 0.72rem;
    min-width: 330px;
    display: none;
  }

  .hud-panel.show {
    display: block;
    animation: floatUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes floatUp {
    from { opacity: 0; transform: translate(-50%, 15px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  .hud-header {
    font-weight: bold;
    color: var(--c-white);
    margin-bottom: 8px;
    border-bottom: 1px solid var(--c-blood);
    padding-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
    gap: 8px;
  }

  .hud-row input[type="range"], .hud-row input[type="text"] {
    flex: 1;
    accent-color: var(--c-crimson);
    background: #0f0a0a;
    border: 1px solid #4a2828;
    color: #fff;
    padding: 3px 6px;
    font-family: inherit;
    font-size: 0.72rem;
  }
  /* ==================== MOBILE RESPONSIVE DOCK & CRT ADAPTATION ==================== */
@media (max-width: 860px) {
  /* 1. Expand dock wrapper to fit screen */
  .hover-dock-wrapper {
    width: calc(100% - 16px);
    max-width: 600px;
    bottom: 8px;
  }

  /* 2. Turn dock into a smooth thumb-swipe rail */
  .hover-dock {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;           /* Firefox */
    justify-content: flex-start;
    padding: 6px 12px;
    gap: 8px;
    border-radius: 25px;
    transform: translateY(0) scale(1) !important; /* Disables sticky mobile scale bug */
  }

  /* Hide unsightly mobile scrollbars */
  .hover-dock::-webkit-scrollbar {
    display: none;                  /* Chrome/Safari */
  }

  /* 3. Prevent any pill or button from getting squished */
  .dock-section {
    flex-shrink: 0;
  }

  .dock-pill {
    padding: 4px 8px;
    font-size: 0.66rem;
  }

  .dock-select {
    font-size: 0.68rem;
  }

  /* 4. Fine-tune mobile CRT text so it fits comfortably */
  #main-editor {
    font-size: 1.1rem;
    line-height: 1.2;
    padding: 6px 8px;
  }

  .crt-header, .crt-footer {
    font-size: 0.75rem;
    padding: 2px 6px;
  }
}
</style>

        <select class="dock-select" id="font-select" onchange="setEditorFont(this.value)">
          <option value="'VT323', monospace" selected>VT323 Phosphor</option>
          <option value="'Inkrealm', monospace">Inkrealm</option>
          <option value="'Fleming', serif">Fleming</option>
          <option value="'Keira', serif">Keira</option>
          <option value="'WSB', monospace">WSB Regular</option>
          <option value="'Wordstar', monospace">Wordstar</option>
        </select>
      </div>

      <!-- BOLD & ITALIC TOGGLES -->
      <div class="dock-section">
        <button class="type-toggle" id="btn-bold" onclick="toggleBold()" title="Toggle Bold">B</button>
        <button class="type-toggle" id="btn-italic" onclick="toggleItalic()" style="font-style:italic;" title="Toggle Italic">I</button>
      </div>

      <div class="dock-divider"></div>

      <!-- PHOSPHOR PALETTE -->
      <div class="dock-section">
        <select class="dock-select" onchange="setPhosphorTheme(this.value)">
          <option value="crimson" selected>Blood Crimson</option>
          <option value="white">Stark White</option>
          <option value="bone">Bone Noir</option>
        </select>
      </div>

      <div class="dock-divider"></div>

      <!-- VIDEO BACKGROUND & DECK -->
      <div class="dock-section">
        <button class="dock-pill" id="vbg-toggle" onclick="toggleVideoBackground()">
          VIDEO: <span id="vbg-label" style="color:var(--c-silver);">OFF</span>
        </button>
        <button class="dock-pill" onclick="toggleVideoHUD()">
          DECK
        </button>
      </div>

      <div class="dock-divider"></div>

      <!-- AUDIO FEEDBACK -->
      <div class="dock-section">
        <button class="dock-pill active" id="audio-toggle" onclick="toggleAudioFeedback()">
          AUDIO: <span id="audio-label">ON</span>
        </button>
      </div>

      <div class="dock-divider"></div>

      <!-- FILE UTILITIES (.NSF / .PWP / .TXT) -->
   <!-- EXPORT WITH OPTIONAL FORMAT SELECTOR -->
<!-- FILE UTILITIES WITH CYCLE FORMAT PILL -->
      <div class="dock-section">
        <!-- Clicking this cycles: .TXT -> .NSF -> .PWP -> .EBC -->
        <button class="dock-pill" id="fmt-pill" onclick="cycleExportFormat()" title="Click to cycle export format">
          FMT: <span id="fmt-label" style="color:var(--c-white); font-weight:bold;">.TXT</span>
        </button>
        <button class="dock-pill" onclick="storeDataDisk()">EXPORT</button>
        <label class="dock-pill" style="cursor:pointer;">
          LOAD
          <input type="file" accept=".txt,.nsf,.pwp,.ebc,.diz,.dat,.md" style="display:none;" onchange="loadExternalFile(event)">
        </label>
        <button class="dock-pill" onclick="toggleCalibrator()">ALIGN</button>
      </div>

    </div>
  </div>

  <!-- VIDEO DECK CONFIG HUD -->
  <div class="hud-panel" id="video-hud">
    <div class="hud-header">
      <span>VIDEO BACKGROUND DECK</span>
      <span style="cursor:pointer; color:var(--c-crimson);" onclick="toggleVideoHUD()">✕</span>
    </div>
    <div class="hud-row">
      <label>Preset:</label>
      <select class="dock-select" style="background:#140d0d; border:1px solid #4a2828; flex:1;" id="video-preset-select" onchange="applyVideoPreset(this.value)">
        <option value="Hozfg9_v-V4">Gothic Attic Embers (Default)</option>
        <option value="jfKfPfyJRdk">Analog Static & CRT Noise</option>
        <option value="WPni755-Krg">Thunderstorm / Rain on Glass</option>
        <option value="custom">-- Custom YouTube ID --</option>
      </select>
    </div>
    <div class="hud-row" id="custom-vid-row" style="display:none;">
      <label>YT ID:</label>
      <input type="text" id="custom-yt-input" placeholder="e.g. Hozfg9_v-V4" onchange="setCustomVideo(this.value)">
    </div>
    <div class="hud-row">
      <label>Opacity (%):</label>
      <input type="range" id="vid-opacity" min="5" max="90" step="1" value="40" oninput="setVideoOpacity(this.value)">
      <span id="val-vopacity">40</span>
    </div>
  </div>

  <!-- APERTURE CALIBRATOR HUD -->
  <div class="hud-panel" id="calibrator">
    <div class="hud-header">
      <span>APERTURE CALIBRATOR</span>
      <span style="cursor:pointer; color:var(--c-crimson);" onclick="toggleCalibrator()">✕</span>
    </div>
    <div class="hud-row">
      <label>Top (%):</label>
      <input type="range" id="cal-top" min="0" max="60" step="0.1" value="31.8" oninput="updateGeometry()">
      <span id="val-top">31.8</span>
    </div>
    <div class="hud-row">
      <label>Left (%):</label>
      <input type="range" id="cal-left" min="0" max="30" step="0.1" value="7.2" oninput="updateGeometry()">
      <span id="val-left">7.2</span>
    </div>
    <div class="hud-row">
      <label>Width (%):</label>
      <input type="range" id="cal-width" min="15" max="60" step="0.1" value="32.8" oninput="updateGeometry()">
      <span id="val-width">32.8</span>
    </div>
    <div class="hud-row">
      <label>Height (%):</label>
      <input type="range" id="cal-height" min="20" max="80" step="0.1" value="64.5" oninput="updateGeometry()">
      <span id="val-height">64.5</span>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:8px;">
      <button class="dock-pill" onclick="resetGeometry()">RESET</button>
      <button class="dock-pill active" onclick="saveGeometry()">LOCK</button>
    </div>
  </div>

<script>
  const editor = document.getElementById('main-editor');
  const crtAperture = document.getElementById('crt-aperture');
  const saveStatus = document.getElementById('save-status');
  const statLine = document.getElementById('stat-line');
  const statWords = document.getElementById('stat-words');
  const statChars = document.getElementById('stat-chars');
  const crtClock = document.getElementById('crt-clock');
  
  const STORAGE_KEY = 'PWP_FITTED_TEXT_V7';
  const GEOM_KEY = 'PWP_FITTED_GEOM_V7';
  
  let audioEnabled = true;
  let videoEnabled = false;
  let isBold = false;
  let isItalic = false;

  const DEFAULT_DOLL_TEXT = `TALAMASCA FIELD DOSSIER // CASE 666-TALTOS
TERMINAL: SMITH CORONA CRT [IMMORTAL HASH]
LOCATION: ATTIC OBSERVATORY // FIRST STREET HOUSE

----------------------------------------------------------------
1. THE APERTURE
The word processor terminal maps across the lower chamber,
stopping cleanly before the crimson stripe of porcelain faces.

2. LASHER / TALTOS RESONANCE
Mechanical key strikes activate non-volatile memory imprints.
All text compresses directly into your browser's address bar.

[Type and structure your dossier text below...]`;

  const DEFAULT_GEOM = { top: 31.8, left: 7.2, width: 32.8, height: 64.5 };

  // ==================== REALTIME URL COMPRESSION ====================
  async function compressArticle(string) {
    if (!string) return '';
    const byteArray = new TextEncoder().encode(string);
    const stream = new CompressionStream('deflate-raw');
    const writer = stream.writable.getWriter();
    writer.write(byteArray);
    writer.close();
    const buffer = await new Response(stream.readable).arrayBuffer();
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
  }

  async function decompressArticle(b64) {
    if (!b64) return '';
    const byteArray = Uint8Array.from(
      atob(b64.replace(/-/g, "+").replace(/_/g, "/")), 
      c => c.charCodeAt(0)
    );
    const stream = new DecompressionStream('deflate-raw');
    const writer = stream.writable.getWriter();
    writer.write(byteArray);
    writer.close();
    const buffer = await new Response(stream.readable).arrayBuffer();
    return new TextDecoder().decode(buffer);
  }

  async function saveToUrlHash() {
    try {
      const hash = '#' + await compressArticle(editor.value);
      if (location.hash !== hash) {
        history.replaceState({}, '', hash);
      }
      localStorage.setItem(STORAGE_KEY, editor.value);
      saveStatus.textContent = 'URL MEMORY: SYNCED';
      saveStatus.style.color = 'var(--crt-phosphor)';
    } catch (e) {}
  }

  async function loadFromUrlHash() {
    try {
      if (location.hash && location.hash.length > 1) {
        const text = await decompressArticle(location.hash.slice(1));
        if (text) {
          editor.value = text;
          updateMetrics();
          return;
        }
      }
    } catch (e) {}
    const saved = localStorage.getItem(STORAGE_KEY);
    editor.value = (saved !== null && saved.trim() !== '') ? saved : DEFAULT_DOLL_TEXT;
    updateMetrics();
  }

  async function copyCompressedUrl() {
    await saveToUrlHash();
    navigator.clipboard.writeText(window.location.href);
    
    const status = document.getElementById('save-status');
    const oldText = status.textContent;
    status.textContent = 'URL COPIED';
    status.style.color = 'var(--c-crimson)';
    playKeystrokeAudio(380, 0.05);

    setTimeout(() => {
      status.textContent = oldText;
      status.style.color = 'var(--crt-phosphor)';
    }, 2200);
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadFromUrlHash();
    const savedGeom = localStorage.getItem(GEOM_KEY);
    if (savedGeom) applyGeometry(JSON.parse(savedGeom));
    startClock();
  });

  // INPUT ENGINE WITH RECOIL
  let saveDebounce;
  editor.addEventListener('input', () => {
    saveStatus.textContent = 'URL: COMPRESSING...';
    saveStatus.style.color = 'var(--crt-highlight)';
    clearTimeout(saveDebounce);
    saveDebounce = setTimeout(saveToUrlHash, 400);

    updateMetrics();
    playKeystrokeAudio();
  });

  editor.addEventListener('keydown', (e) => {
    if (typeof gsap === 'undefined') return;
    if (e.key === 'Enter') {
      gsap.fromTo(crtAperture, { y: 3 }, { y: 0, duration: 0.2, ease: "power2.out" });
    } else if (e.key.length === 1) {
      const rx = (Math.random() - 0.5) * 1.2;
      const ry = (Math.random() - 0.5) * 1.0;
      gsap.fromTo(crtAperture, { x: rx, y: ry }, { x: 0, y: 0, duration: 0.04 });
    }
  });

  editor.addEventListener('keyup', updateMetrics);
  editor.addEventListener('click', updateMetrics);

  function updateMetrics() {
    const text = editor.value;
    statChars.textContent = text.length;
    const words = text.trim().length > 0 ? text.trim().split(/\s+/).length : 0;
    statWords.textContent = words;

    const pos = editor.selectionStart;
    const lines = text.substring(0, pos).split("\n");
    statLine.textContent = lines.length;
  }

  // ==================== TYPOGRAPHY & PHOSPHOR ====================
  function setEditorFont(fontName) {
    document.documentElement.style.setProperty('--editor-font', fontName);
  }

  function toggleBold() {
    isBold = !isBold;
    document.getElementById('btn-bold').classList.toggle('active', isBold);
    document.documentElement.style.setProperty('--editor-weight', isBold ? 'bold' : 'normal');
  }

  function toggleItalic() {
    isItalic = !isItalic;
    document.getElementById('btn-italic').classList.toggle('active', isItalic);
    document.documentElement.style.setProperty('--editor-style', isItalic ? 'italic' : 'normal');
  }

  function setPhosphorTheme(theme) {
    document.body.setAttribute('data-theme', theme);
  }

  // ==================== VIDEO DECK ====================
  function toggleVideoBackground() {
    videoEnabled = !videoEnabled;
    const vLayer = document.getElementById('video-layer');
    const vLabel = document.getElementById('vbg-label');
    const vBtn = document.getElementById('vbg-toggle');

    if (videoEnabled) {
      vLayer.style.opacity = 'var(--video-opacity)';
      vLabel.textContent = 'ON';
      vLabel.style.color = 'var(--crt-phosphor)';
      vBtn.classList.add('active');
    } else {
      vLayer.style.opacity = '0';
      vLabel.textContent = 'OFF';
      vLabel.style.color = 'var(--c-silver)';
      vBtn.classList.remove('active');
    }
  }

  function toggleVideoHUD() {
    document.getElementById('video-hud').classList.toggle('show');
  }

  function applyVideoPreset(val) {
    const customRow = document.getElementById('custom-vid-row');
    if (val === 'custom') {
      customRow.style.display = 'flex';
      return;
    }
    customRow.style.display = 'none';
    setIframeVideo(val);
  }

  function setCustomVideo(val) {
    let id = val.trim();
    if (id.includes('v=')) id = id.split('v=')[1].split('&')[0];
    if (id.includes('youtu.be/')) id = id.split('youtu.be/')[1].split('?')[0];
    setIframeVideo(id);
  }

  function setIframeVideo(id) {
    const iframe = document.getElementById('video-iframe');
    iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&playsinline=1`;
  }

  function setVideoOpacity(val) {
    document.getElementById('val-vopacity').textContent = val;
    document.documentElement.style.setProperty('--video-opacity', (val / 100).toFixed(2));
  }

  // ==================== SOLENOID AUDIO ====================
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function toggleAudioFeedback() {
    audioEnabled = !audioEnabled;
    const lbl = document.getElementById('audio-label');
    const btn = document.getElementById('audio-toggle');
    lbl.textContent = audioEnabled ? 'ON' : 'MUTED';
    lbl.style.color = audioEnabled ? 'var(--c-white)' : 'var(--c-silver)';
    btn.classList.toggle('active', audioEnabled);
  }

  function playKeystrokeAudio(freq = 140, duration = 0.035) {
    if (!audioEnabled) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq + Math.random() * 60, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration + 0.005);
    } catch (e) {}
  }

  // ==================== OBSCURE .NSF / .PWP STORAGE ====================
// ==================== DYNAMIC MULTI-FORMAT EXPORT ====================
// ==================== FORMAT CYCLE & DYNAMIC EXPORT ====================
const exportFormats = ['txt', 'nsf', 'pwp', 'ebc'];
let currentFormatIdx = 0;

function cycleExportFormat() {
  currentFormatIdx = (currentFormatIdx + 1) % exportFormats.length;
  const ext = exportFormats[currentFormatIdx];
  document.getElementById('fmt-label').textContent = `.${ext.toUpperCase()}`;
  playKeystrokeAudio(360, 0.03);
}

function storeDataDisk() {
  const ext = exportFormats[currentFormatIdx];
  const text = editor.value;
  const mimeType = (ext === 'txt') ? 'text/plain;charset=utf-8' : 'application/octet-stream';
  
  const blob = new Blob([text], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const dateStamp = new Date().toISOString().slice(0, 10);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = `MAYFAIR_${dateStamp}.${ext}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  playKeystrokeAudio(320, 0.05);
  const status = document.getElementById('save-status');
  const prev = status.textContent;
  status.textContent = `EXPORTED: .${ext.toUpperCase()}`;
  status.style.color = 'var(--c-crimson)';
  setTimeout(() => {
    status.textContent = prev;
    status.style.color = 'var(--crt-phosphor)';
  }, 2200);
}

  // ==================== APERTURE CALIBRATOR ====================
  function toggleCalibrator() {
    document.getElementById('calibrator').classList.toggle('show');
  }

  function updateGeometry() {
    const top = document.getElementById('cal-top').value;
    const left = document.getElementById('cal-left').value;
    const width = document.getElementById('cal-width').value;
    const height = document.getElementById('cal-height').value;

    document.getElementById('val-top').textContent = top;
    document.getElementById('val-left').textContent = left;
    document.getElementById('val-width').textContent = width;
    document.getElementById('val-height').textContent = height;

    applyGeometry({ top, left, width, height });
  }

  function applyGeometry(g) {
    crtAperture.style.top = g.top + '%';
    crtAperture.style.left = g.left + '%';
    crtAperture.style.width = g.width + '%';
    crtAperture.style.height = g.height + '%';

    document.getElementById('cal-top').value = g.top;
    document.getElementById('cal-left').value = g.left;
    document.getElementById('cal-width').value = g.width;
    document.getElementById('cal-height').value = g.height;

    document.getElementById('val-top').textContent = g.top;
    document.getElementById('val-left').textContent = g.left;
    document.getElementById('val-width').textContent = g.width;
    document.getElementById('val-height').textContent = g.height;
  }

  function saveGeometry() {
    const g = {
      top: document.getElementById('cal-top').value,
      left: document.getElementById('cal-left').value,
      width: document.getElementById('cal-width').value,
      height: document.getElementById('cal-height').value
    };
    localStorage.setItem(GEOM_KEY, JSON.stringify(g));
    alert('Aperture locked into localStorage!');
  }

  function resetGeometry() {
    applyGeometry(DEFAULT_GEOM);
    localStorage.removeItem(GEOM_KEY);
  }

  function startClock() {
    function tick() {
      const d = new Date();
      crtClock.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }
    tick();
    setInterval(tick, 1000);
  }

  // ==================== RED CRT LASER POINTER TRAIL ====================
  (function initPointerTrail() {
    const canvas = document.getElementById('trailCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, dpr;
    const pts = [];
    const LIFE = 380;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', (e) => {
      pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    });

    function render() {
      requestAnimationFrame(render);
      const now = performance.now();
      while (pts.length && now - pts[0].t > LIFE) pts.shift();

      ctx.clearRect(0, 0, W, H);
      if (pts.length < 2) return;

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 1; i < pts.length; i++) {
        const progress = (now - pts[i].t) / LIFE;
        const alpha = Math.max(0, Math.min(1, (1 - progress) * 1.3));
        ctx.strokeStyle = `rgba(230, 28, 28, ${alpha.toFixed(3)})`;
        ctx.shadowColor = 'rgba(255, 51, 51, 0.8)';
        ctx.shadowBlur = 4;
        ctx.lineWidth = 1.4;

        ctx.beginPath();
        ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
        ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
      }
    }
    render();
  })();
</script>
</body>
