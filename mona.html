<style>
    :root {
      --bg: #070405;
      --sheet: rgba(13, 8, 10, 0.94);
      --panel: #11080b;
      --border: #3d1418;
      --accent: #e61c1c;
      --accent-glow: #ff3b3b;
      --phosphor: #ff4d4d;
      --text: #f5f2ef;
      --mut: #8e7b7d;
      --sel-bg: rgba(230, 28, 28, 0.86);
      --sel-fg: #ffffff;
      --mono: 'IBM Plex Mono', monospace;
    }
    body[data-theme="stark"] {
      --bg: #000000; --sheet: #060608; --panel: #0c0c10;
      --border: #6f7685; --accent: #ffffff; --accent-glow: #ffffff;
      --phosphor: #ffffff; --text: #ffffff; --mut: #9ca3af;
    }
    body[data-theme="stark"] .pwp-svg-emblem,
    body[data-theme="stark"] .triptych-bay img {
      filter: grayscale(100%) contrast(1.18);
    }
    body[data-theme="bone"] {
      --bg: #ece5d8; --sheet: rgba(247, 243, 234, 0.96); --panel: #e3dbcc;
      --border: #c6bca9; --accent: #a61414; --accent-glow: #c91d1d;
      --phosphor: #8b0000; --text: #1c1816; --mut: #6e6559;
    }

    ::selection { background: var(--sel-bg); color: var(--sel-fg); text-shadow: none; }
    ::-moz-selection { background: var(--sel-bg); color: var(--sel-fg); text-shadow: none; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--mono); overflow: hidden;
      display: flex; flex-direction: column;
      transition: background 0.25s, color 0.25s;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9000;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.24) 50%);
      background-size: 100% 3px; opacity: 0.42;
    }
    button, select, input, textarea { font-family: inherit; }
    button { cursor: pointer; }
    #trailCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 8999; }

    /* ================= 1. HARDWARE SHELF HEADER ================= */
    header.hardware-shelf {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--accent);
      box-shadow: 0 4px 20px rgba(0,0,0,0.55);
      z-index: 500;
    }
    .brand-zone { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .pwp-svg-emblem { width: 175px; height: 36px; flex-shrink: 0; }
    .brand-title { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: var(--text); white-space: nowrap; }
    .brand-sub { font-size: 9px; letter-spacing: 0.12em; color: var(--phosphor); white-space: nowrap; }

    .shelf-center {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 9px; letter-spacing: 0.08em; color: var(--mut); text-align: center;
    }
    .shelf-center b { color: var(--text); }
    .shelf-mem-row { display: flex; align-items: center; gap: 8px; }
    #save-status { color: var(--phosphor); font-weight: 600; }
    .th-copy-link {
      background: transparent; border: 1px solid var(--border); color: var(--mut);
      font-size: 8px; padding: 2px 6px; letter-spacing: 0.06em;
    }
    .th-copy-link:hover { border-color: var(--accent); color: var(--accent-glow); }

    .triptych-bay {
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
      border: 1px solid var(--border); background: #050203; padding: 3px; cursor: pointer;
    }
    .triptych-bay img {
      width: 112px; height: 50px; object-fit: cover; display: block;
      border: 1px solid rgba(230,28,28,0.45);
    }
    .triptych-tag {
      writing-mode: vertical-rl; text-orientation: mixed;
      font-size: 7px; letter-spacing: 1px; color: var(--mut); padding: 2px 1px;
    }

    /* ================= 2. SIDE-BY-SIDE WORKSPACE ================= */
    #app {
      position: relative; flex: 1; min-height: 0; width: 100%;
      display: flex; flex-direction: row; z-index: 2;
    }
    #stage {
      flex: 1; min-width: 0; overflow-y: auto;
      display: block;
      padding: 18px 20px 28px;
    }
    #editor-sheet {
      width: 100%; max-width: 820px;
      min-height: 100%; height: auto;
      margin: 0 auto;
      background: var(--sheet); border: 1px solid var(--border);
      box-shadow: 0 14px 40px rgba(0,0,0,0.55);
      padding: 28px 36px;
    }
    #editor {
      min-height: 55vh; height: auto; outline: none; caret-color: var(--accent-glow);
      font-family: 'VT323', monospace; font-size: 1.32rem; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word; color: var(--text);
    }
    #editor:empty::before {
      content: attr(data-placeholder); color: var(--mut); opacity: 0.55; pointer-events: none;
    }

    /* RIGHT SPLIT COLUMN: VIDEO DECK (TOP) + FIELD NOTES WORKBENCH (BOTTOM) */
    #split-drawer {
      width: 0; overflow: hidden; flex-shrink: 0;
      background: var(--panel); border-left: 0 solid var(--accent);
      display: flex; flex-direction: column;
      transition: width 0.22s ease;
    }
    #split-drawer.open { width: 40%; min-width: 320px; max-width: 500px; border-left-width: 1px; }
    #split-drawer.open.expanded { width: 56%; max-width: 780px; }

    #vid-pane {
      display: none; flex-direction: column; gap: 6px;
      padding: 10px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #vid-pane.active { display: flex; }
    #split-drawer.vid-only #vid-pane { flex: 1; border-bottom: none; justify-content: flex-start; }

    #video-stage {
      width: 100%; aspect-ratio: 16 / 9; max-height: 36vh; background: #000;
      border: 1px solid var(--accent); overflow: hidden;
    }
    #split-drawer.vid-only #video-stage { max-height: 58vh; }
    #video-stage video, #video-stage iframe, #video-stage img {
      width: 100%; height: 100%; border: 0; display: block; object-fit: cover;
    }
    #video-select, #custom-video {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); font-size: 10px; padding: 5px 7px; outline: none;
    }
    #video-select:focus, #custom-video:focus { border-color: var(--accent); }
    .vid-bar { display: flex; gap: 5px; }

    #work-pane {
      display: none; flex: 1; min-height: 0; flex-direction: column;
    }
    #work-pane.active { display: flex; }

    .sp-tabs {
      display: flex; align-items: center; border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.24); flex-shrink: 0;
    }
    .sp-tab {
      flex: 1; padding: 8px 4px; background: transparent; border: none;
      border-bottom: 2px solid transparent; color: var(--mut);
      font-size: 9px; letter-spacing: 0.08em;
    }
    .sp-tab.active { color: var(--accent-glow); border-bottom-color: var(--accent); font-weight: 700; }

    .sp-body {
      flex: 1; min-height: 0; display: none; flex-direction: column;
      padding: 10px; overflow-y: auto; gap: 8px;
    }
    .sp-body.active { display: flex; }

    #notes-pad {
      flex: 1; min-height: 120px; width: 100%; resize: none;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      padding: 9px; font-size: 11px; line-height: 1.5; outline: none;
    }
    .sp-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text);
      padding: 6px 8px; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .sp-btn:hover, .sp-btn.active { border-color: var(--accent); color: var(--accent-glow); }
    .sp-btn.rec { background: var(--accent); color: #fff; font-weight: 700; border-color: var(--accent-glow); }
    #research-frame { flex: 1; width: 100%; border: 1px solid var(--border); background: #fff; min-height: 180px; }
    .snap-item {
      border: 1px solid var(--border); padding: 7px; font-size: 10px;
      display: flex; flex-direction: column; gap: 4px; background: var(--bg);
    }

    /* ================= 3. CRISP WHITE PILL FOOTER DECK ================= */
    #dock-wrap {
      flex-shrink: 0; display: flex; justify-content: center;
      padding: 6px 12px 12px; position: relative; z-index: 600;
    }
    #hud-dock {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(11, 5, 7, 0.94);
      backdrop-filter: blur(12px);
      border: 1.5px solid var(--accent);
      box-shadow: 0 8px 26px rgba(0,0,0,0.72), 0 0 14px rgba(230,28,28,0.25);
      max-width: 100%; overflow-x: auto; scrollbar-width: none;
    }
    #hud-dock::-webkit-scrollbar { display: none; }
    .hud-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(245, 242, 239, 0.16);
      color: #f5f2ef;
      font-size: 9px; font-weight: 600; letter-spacing: 0.08em;
      padding: 5px 10px; border-radius: 999px;
      white-space: nowrap; text-transform: uppercase; transition: all 0.15s ease;
    }
    .hud-pill:hover {
      border-color: #ffffff;
      background: rgba(230, 28, 28, 0.22);
      color: #ffffff;
    }
    .hud-pill.active {
      background: var(--accent);
      border-color: #f5f2ef;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(230, 28, 28, 0.45);
    }
    body[data-theme="stark"] .hud-pill.active {
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
    }
    .hud-sep { width: 1px; height: 14px; background: rgba(245, 242, 239, 0.2); flex-shrink: 0; margin: 0 2px; }
    .hilite-swatch {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--sel-bg); border: 1px solid #ffffff; margin-right: 4px; vertical-align: middle;
    }

    #export-pop {
      position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
      z-index: 6500; display: none; gap: 4px; flex-wrap: wrap;
      background: var(--panel); border: 1px solid var(--accent);
      padding: 6px; border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,0.8);
    }
    #export-pop.open { display: flex; }

    @media (max-width: 820px) {
      header.hardware-shelf { flex-wrap: wrap; padding: 6px 10px; gap: 6px; }
      .pwp-svg-emblem { width: 135px; height: 28px; }
      .shelf-center { order: 3; width: 100%; flex-direction: row; justify-content: space-between; }
      .triptych-bay img { width: 82px; height: 36px; }
      #stage { padding: 10px; }
      #editor-sheet { padding: 14px 14px; }
      #split-drawer.open { width: 48%; min-width: 190px; }
      #split-drawer.open.expanded { width: 65%; }
    }
    @media (max-width: 560px) {
      #app { flex-direction: column-reverse; }
      #split-drawer.open, #split-drawer.open.expanded {
        width: 100%; max-width: none; min-width: 0;
        border-left: none; border-bottom: 1px solid var(--accent);
        max-height: 44vh;
      }
      #video-stage { max-height: 24vh; }
    }
  </style>
</head>

      <button class="hud-pill" id="btn-hilite"><span class="hilite-swatch"></span>SEL: CRIMSON</button>
      <span class="hud-sep"></span>
      <button class="hud-pill active" id="btn-sound">AUDIO: ON</button>
      <button class="hud-pill" id="btn-vid">VID</button>
      <button class="hud-pill" id="btn-notes">NOTES</button>
      <span class="hud-sep"></span>
      <button class="hud-pill" id="btn-chk">CHK</button>
      <button class="hud-pill" id="btn-exp">EXPORT</button>
      <button class="hud-pill" id="btn-imp">LOAD</button>
      <button class="hud-pill" id="btn-purge">PURGE</button>
      <input type="file" id="file-imp" accept=".txt,.md,.bak,.wsd,.nsf,.pwp,.ebc,text/*" hidden>
    </nav>
  </div>

<script>
    const TRIPTYCH_GIF = 'https://raw.githubusercontent.com/ghostm68/666/main/triptych1787949777205.gif';
    const DEFAULT_DOLL_TEXT = `TALAMASCA FIELD DOSSIER // CASE 666-TALTOS
TERMINAL: S. C. CRT [IMMORTAL HASH]
LOCATION: ATTIC OBSERVATORY // FIRST STREET HOUSE

----------------------------------------------------------------
1. THE APERTURE
The word processor expands across the observatory floor,
while the porcelain triptych keeps watch on the shelf above.

2. LASHER / TALTOS RESONANCE
Mechanical key strikes activate non-volatile memory imprints.
All text compresses directly into your browser's address bar.

[Type and structure your dossier text below...]`;

    const editor = document.getElementById('editor');
    const saveStatus = document.getElementById('save-status');
    const statLine = document.getElementById('stat-line');
    const statWords = document.getElementById('stat-words');
    const statChars = document.getElementById('stat-chars');
    const crtClock = document.getElementById('crt-clock');
    const notesPad = document.getElementById('notes-pad');

    // ================= 1. CLOCK & INDEXEDDB + URL MEMORY =================
    function tickClock() {
      const d = new Date();
      crtClock.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }
    setInterval(tickClock, 1000); tickClock();

    const DB_NAME = 'MonaStudioDB';
    function openDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore('docs');
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }
    async function idbSet(k, v) {
      try { const db = await openDB(); db.transaction('docs', 'readwrite').objectStore('docs').put(v, k); } catch (_) {}
    }
    async function idbGet(k) {
      try {
        const db = await openDB();
        return await new Promise(res => {
          const r = db.transaction('docs').objectStore('docs').get(k);
          r.onsuccess = () => res(r.result); r.onerror = () => res(null);
        });
      } catch (_) { return null; }
    }

    function updateMetrics() {
      const text = editor.innerText || '';
      statChars.textContent = text.length;
      statWords.textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
      statLine.textContent = text.split('\n').length;
    }

    async function compressArticle(str) {
      const stream = new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      const buf = await new Response(stream).arrayBuffer();
      return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    async function decompressArticle(b64) {
      let norm = b64.replace(/-/g, '+').replace(/_/g, '/');
      while (norm.length % 4) norm += '=';
      const bytes = Uint8Array.from(atob(norm), c => c.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return await new Response(stream).text();
    }

    let saveDebounce;
    async function syncImmortalMemory() {
      try {
        const txt = editor.innerText;
        if (txt.trim()) {
          const hash = '#' + await compressArticle(txt);
          if (location.hash !== hash) history.replaceState({}, '', hash);
        }
        localStorage.setItem('PWP_FITTED_TEXT_V7', txt);
        localStorage.setItem('MONA_HTML', editor.innerHTML);
        idbSet('active_html', editor.innerHTML);
        saveStatus.textContent = 'URL MEMORY: SYNCED';
      } catch (_) {}
    }
    function scheduleSync() {
      saveStatus.textContent = 'URL: COMPRESSING...';
      clearTimeout(saveDebounce);
      saveDebounce = setTimeout(syncImmortalMemory, 400);
    }

    document.getElementById('btn-copy-url').onclick = async () => {
      await syncImmortalMemory();
      await navigator.clipboard.writeText(window.location.href);
      saveStatus.textContent = 'URL COPIED';
      playSolenoid(380, 0.05);
      setTimeout(() => saveStatus.textContent = 'URL MEMORY: SYNCED', 2200);
    };

    async function loadInitialDossier() {
      if (location.hash.length > 1) {
        try {
          const txt = await decompressArticle(location.hash.slice(1));
          if (txt) { editor.innerText = txt; updateMetrics(); return; }
        } catch (_) {}
      }
      const idbHtml = await idbGet('active_html');
      const lsText = localStorage.getItem('PWP_FITTED_TEXT_V7');
      if (idbHtml) editor.innerHTML = idbHtml;
      else if (lsText && lsText.trim()) editor.innerText = lsText;
      else editor.innerText = DEFAULT_DOLL_TEXT;
      updateMetrics();
    }

    // ================= 2. SOLENOID AUDIO =================
    let audioEnabled = true, audioCtx = null;
    function playSolenoid(freq = 140, duration = 0.035) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq + Math.random() * 60, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration + 0.005);
      } catch (_) {}
    }

    document.getElementById('btn-sound').onclick = function () {
      audioEnabled = !audioEnabled;
      this.classList.toggle('active', audioEnabled);
      this.textContent = audioEnabled ? 'AUDIO: ON' : 'AUDIO: OFF';
      if (audioEnabled) playSolenoid(220, 0.04);
    };

    // ================= 3. SIDE-BY-SIDE VIDEO + FIELD NOTES SPLIT =================
    const drawer = document.getElementById('split-drawer');
    const vidPane = document.getElementById('vid-pane');
    const workPane = document.getElementById('work-pane');
    const videoSelect = document.getElementById('video-select');
    const customVideo = document.getElementById('custom-video');
    const videoStage = document.getElementById('video-stage');
    const btnVid = document.getElementById('btn-vid');
    const btnNotes = document.getElementById('btn-notes');
    let vidOpen = false, notesOpen = false, videoMuted = true;

    function extractYouTubeId(val) {
      const m = (val || '').trim().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|live\/)|[?&]v=)([\w-]{11})/);
      if (m) return m[1];
      return /^[a-zA-Z0-9_-]{11}$/.test((val || '').trim()) ? val.trim() : '';
    }
    function isDirectVideo(src) {
      return /\.(mp4|webm|ogg)(\?|$)/i.test(src) || src.includes('archive.org/download');
    }

    function renderSplitVideo(val) {
      localStorage.setItem('MONA_MEDIA', val || '');
      videoStage.innerHTML = '';
      if (!val || val === 'triptych') {
        const img = document.createElement('img');
        img.src = TRIPTYCH_GIF; img.alt = 'Mayfair Triptych';
        videoStage.appendChild(img);
        return;
      }
      if (isDirectVideo(val)) {
        const vid = document.createElement('video');
        vid.src = val; vid.autoplay = true; vid.loop = true; vid.muted = videoMuted;
        vid.controls = true; vid.playsInline = true;
        videoStage.appendChild(vid);
        return;
      }
      const ytId = extractYouTubeId(val);
      if (ytId) {
        videoStage.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=${videoMuted ? 1 : 0}&loop=1&playlist=${ytId}&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }
    }

    function syncSplitLayout() {
      const anyOpen = vidOpen || notesOpen;
      drawer.classList.toggle('open', anyOpen);
      drawer.classList.toggle('vid-only', vidOpen && !notesOpen);
      vidPane.classList.toggle('active', vidOpen);
      workPane.classList.toggle('active', notesOpen);
      btnVid.classList.toggle('active', vidOpen);
      btnNotes.classList.toggle('active', notesOpen);
      if (!anyOpen) drawer.classList.remove('expanded');

      if (vidOpen && !videoStage.innerHTML) {
        renderSplitVideo(videoSelect.value === 'custom' ? customVideo.value : videoSelect.value);
      } else if (!vidOpen) {
        videoStage.innerHTML = '';
      }
    }

    function toggleVidPane(forceState, forceVal) {
      vidOpen = typeof forceState === 'boolean' ? forceState : !vidOpen;
      if (forceVal) {
        videoSelect.value = forceVal;
        customVideo.style.display = 'none';
        renderSplitVideo(forceVal);
      }
      syncSplitLayout();
      playSolenoid(180, 0.03);
    }

    btnVid.onclick = () => toggleVidPane();
    btnNotes.onclick = () => { notesOpen = !notesOpen; syncSplitLayout(); playSolenoid(180, 0.03); };

    document.getElementById('btn-vid-expand').onclick = function () {
      const exp = drawer.classList.toggle('expanded');
      this.classList.toggle('active', exp);
      this.textContent = exp ? 'RESTORE ⤡' : 'EXPAND ⤢';
      playSolenoid(170, 0.03);
    };

    videoSelect.onchange = () => {
      const v = videoSelect.value;
      customVideo.style.display = v === 'custom' ? 'block' : 'none';
      if (v !== 'custom') renderSplitVideo(v);
    };
    customVideo.onchange = () => {
      const raw = customVideo.value.trim();
      if (raw) renderSplitVideo(raw);
    };
    document.getElementById('btn-vid-mute').onclick = function () {
      videoMuted = !videoMuted;
      this.classList.toggle('active', !videoMuted);
      this.textContent = videoMuted ? 'SOUND: MUTED' : 'SOUND: LIVE';
      const v = videoStage.querySelector('video');
      if (v) v.muted = videoMuted;
      else renderSplitVideo(videoSelect.value === 'custom' ? customVideo.value : videoSelect.value);
    };

    document.querySelectorAll('.sp-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.sp-tab, .sp-body').forEach(el => el.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      };
    });

    // ================= 4. FONTS, THEMES, HIGHLIGHT COLOR, FORMATTING =================
    const FONTS = [
      { label: 'FONT: VT323', css: "'VT323', monospace", size: '1.32rem' },
      { label: 'FONT: ELITE', css: "'Special Elite', serif", size: '1.12rem' },
      { label: 'FONT: IBM', css: "'IBM Plex Mono', monospace", size: '1.02rem' },
      { label: 'FONT: COURIER', css: "'Courier Prime', monospace", size: '1.08rem' },
      { label: 'FONT: SPACE', css: "'Space Mono', monospace", size: '1.02rem' },
      { label: 'FONT: GARAMOND', css: "'EB Garamond', serif", size: '1.22rem' }
    ];
    let fontIdx = 0;
    document.getElementById('btn-font').onclick = function () {
      fontIdx = (fontIdx + 1) % FONTS.length;
      editor.style.fontFamily = FONTS[fontIdx].css;
      editor.style.fontSize = FONTS[fontIdx].size;
      this.textContent = FONTS[fontIdx].label;
      playSolenoid(180, 0.02);
    };

    const THEMES = ['crimson', 'stark', 'bone'];
    const THEME_NAMES = ['THEME: CRIMSON', 'THEME: STARK', 'THEME: BONE'];
    let themeIdx = 0;
    const btnTheme = document.getElementById('btn-theme');
    btnTheme.onclick = function () {
      themeIdx = (themeIdx + 1) % THEMES.length;
      document.body.setAttribute('data-theme', THEMES[themeIdx]);
      localStorage.setItem('MONA_THEME', THEMES[themeIdx]);
      this.textContent = THEME_NAMES[themeIdx];
      playSolenoid(160, 0.03);
    };
    const savedTheme = localStorage.getItem('MONA_THEME');
    if (savedTheme && THEMES.includes(savedTheme)) {
      themeIdx = THEMES.indexOf(savedTheme);
      document.body.setAttribute('data-theme', savedTheme);
    }
    btnTheme.textContent = THEME_NAMES[themeIdx];

    const HILITES = [
      { name: 'CRIMSON', bg: 'rgba(230, 28, 28, 0.86)', fg: '#ffffff' },
      { name: 'AMBER', bg: 'rgba(255, 210, 74, 0.90)', fg: '#000000' },
      { name: 'NOIR', bg: 'rgba(240, 230, 230, 0.92)', fg: '#090506' },
      { name: 'EMERALD', bg: 'rgba(34, 197, 94, 0.86)', fg: '#000000' }
    ];
    let hiliteIdx = parseInt(localStorage.getItem('MONA_HILITE_IDX') || '0', 10) % HILITES.length;
    function applyHilite(idx) {
      const h = HILITES[idx];
      document.documentElement.style.setProperty('--sel-bg', h.bg);
      document.documentElement.style.setProperty('--sel-fg', h.fg);
      document.getElementById('btn-hilite').innerHTML = `<span class="hilite-swatch"></span>SEL: ${h.name}`;
      localStorage.setItem('MONA_HILITE_IDX', idx);
    }
    applyHilite(hiliteIdx);
    document.getElementById('btn-hilite').onclick = () => {
      hiliteIdx = (hiliteIdx + 1) % HILITES.length;
      applyHilite(hiliteIdx);
      playSolenoid(210, 0.03);
    };

    document.getElementById('btn-bold').onclick = () => { editor.focus(); document.execCommand('bold'); scheduleSync(); };
    document.getElementById('btn-italic').onclick = () => { editor.focus(); document.execCommand('italic'); scheduleSync(); };

    // ================= 5. NOTES, VOICE, WEB, .BAK SNAPS =================
    notesPad.value = localStorage.getItem('MONA_NOTES') || '';
    notesPad.oninput = () => localStorage.setItem('MONA_NOTES', notesPad.value);
    document.getElementById('btn-insert-notes').onclick = () => {
      if (!notesPad.value.trim()) return;
      editor.focus();
      document.execCommand('insertText', false, '\n' + notesPad.value.trim() + '\n');
      updateMetrics(); scheduleSync();
    };

    document.getElementById('btn-web-go').onclick = () => {
      let u = document.getElementById('web-url').value.trim();
      if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
      document.getElementById('research-frame').src = u;
    };

    let rec = null, listening = false;
    document.getElementById('btn-mic').onclick = function () {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('Web Speech API unavailable in this browser.');
      if (!rec) {
        rec = new SR(); rec.continuous = true; rec.interimResults = false;
        rec.onresult = e => {
          const r = e.results[e.results.length - 1];
          if (r.isFinal) {
            editor.focus();
            document.execCommand('insertText', false, r[0].transcript.trim() + ' ');
            updateMetrics(); scheduleSync();
          }
        };
        rec.onend = () => { listening = false; this.textContent = '[MIC: OFF]'; this.classList.remove('rec'); };
      }
      if (listening) rec.stop();
      else { rec.start(); listening = true; this.textContent = '[MIC: REC]'; this.classList.add('rec'); }
    };

    document.getElementById('btn-speak').onclick = () => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(editor.innerText.trim() || 'Buffer is empty.');
      u.rate = 1.0; u.pitch = 0.92;
      window.speechSynthesis.speak(u);
    };
    document.getElementById('btn-stop-speak').onclick = () => window.speechSynthesis?.cancel();

    function loadSnaps() {
      try { return JSON.parse(localStorage.getItem('MONA_SNAPS') || '[]'); } catch { return []; }
    }
    function renderSnaps() {
      const list = document.getElementById('snaps-list');
      const snaps = loadSnaps();
      list.innerHTML = snaps.length ? '' : '<span style="font-size:10px; color:var(--mut);">No .BAK checkpoints yet. Press CHK or Ctrl+K S.</span>';
      snaps.forEach(s => {
        const div = document.createElement('div');
        div.className = 'snap-item';
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; color:var(--accent-glow);">
            <b>${s.time}</b><span>${s.words} W</span>
          </div>
          <div style="color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.preview}</div>
          <button class="sp-btn">RESTORE</button>
        `;
        div.querySelector('button').onclick = () => {
          if (confirm('REVERT ACTIVE BUFFER TO THIS .BAK SNAPSHOT?')) {
            editor.innerHTML = s.html;
            updateMetrics(); scheduleSync(); playSolenoid(200, 0.08);
          }
        };
        list.appendChild(div);
      });
    }
    function createBakCheckpoint() {
      playSolenoid(420, 0.08);
      const snaps = loadSnaps();
      const txt = editor.innerText.trim();
      snaps.unshift({
        time: new Date().toLocaleTimeString(),
        words: txt ? txt.split(/\s+/).length : 0,
        preview: txt.slice(0, 60) || '(empty)',
        html: editor.innerHTML
      });
      localStorage.setItem('MONA_SNAPS', JSON.stringify(snaps.slice(0, 15)));
      localStorage.setItem('PWP_DOCUMENT_BAK', txt);
      renderSnaps();
      saveStatus.textContent = 'CHECKPOINT -> .BAK CREATED';
      setTimeout(() => saveStatus.textContent = 'URL MEMORY: SYNCED', 1800);
    }
    function restoreLatestBak() {
      const snaps = loadSnaps();
      if (!snaps.length) return alert('NO .BAK FILE FOUND ON DATADISK');
      if (confirm('REVERT ACTIVE BUFFER TO PREVIOUS .BAK SNAPSHOT?')) {
        editor.innerHTML = snaps[0].html;
        updateMetrics(); scheduleSync(); playSolenoid(200, 0.1);
      }
    }
    document.getElementById('btn-chk').onclick = createBakCheckpoint;
    document.getElementById('btn-new-snap').onclick = createBakCheckpoint;
    renderSnaps();

    // ================= 6. EXPORTS (INKREALM STAMP + TRIPTYCH STILL), IMPORT, PURGE =================
    const expPop = document.getElementById('export-pop');
    document.getElementById('btn-exp').onclick = (e) => { e.stopPropagation(); expPop.classList.toggle('open'); };
    document.addEventListener('click', (e) => { if (!expPop.contains(e.target) && e.target.id !== 'btn-exp') expPop.classList.remove('open'); });

    async function captureTriptychStill() {
      const srcImg = document.querySelector('.triptych-bay img');
      const toJpeg = (imgEl) => {
        const w = imgEl.naturalWidth || 224;
        const h = imgEl.naturalHeight || 100;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(imgEl, 0, 0, w, h);
        return { dataUrl: c.toDataURL('image/jpeg', 0.88), w, h };
      };
      try {
        if (srcImg && srcImg.complete && srcImg.naturalWidth) return toJpeg(srcImg);
      } catch (_) {}
      try {
        const res = await fetch(TRIPTYCH_GIF, { mode: 'cors' });
        if (!res.ok) return null;
        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);
        return await new Promise(resolve => {
          const im = new Image();
          im.onload = () => {
            try { resolve(toJpeg(im)); } catch (_) { resolve(null); }
            finally { URL.revokeObjectURL(objUrl); }
          };
          im.onerror = () => { URL.revokeObjectURL(objUrl); resolve(null); };
          im.src = objUrl;
        });
      } catch (_) { return null; }
    }

    document.querySelectorAll('#export-pop button').forEach(btn => {
      btn.onclick = async () => {
        expPop.classList.remove('open');
        const ext = btn.dataset.exp;
        const txt = editor.innerText;
        const dateStamp = new Date().toISOString().slice(0, 10);

        if (ext === 'pdf') {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'pt', format: 'letter' });
          const still = await captureTriptychStill();

          doc.setFont('times', 'bold');
          doc.setFontSize(16);
          doc.setTextColor(166, 20, 20);
          doc.text('INKREALM', 54, 52);

          doc.setFont('courier', 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(95, 90, 90);
          doc.text('TALAMASCA DOLL-PROCESSOR // https://inkrealm.info', 54, 66);
          doc.text(`MAYFAIR ARCHIVE · ${dateStamp}`, 54, 78);

          if (still) {
            const imgH = 40;
            const imgW = Math.min(118, imgH * (still.w / still.h));
            const imgX = 558 - imgW;
            doc.addImage(still.dataUrl, 'JPEG', imgX, 38, imgW, imgH);
            doc.setDrawColor(166, 20, 20);
            doc.setLineWidth(0.9);
            doc.rect(imgX, 38, imgW, imgH);
          }

          doc.setDrawColor(166, 20, 20);
          doc.setLineWidth(0.8);
          doc.line(54, 88, 558, 88);

          doc.setTextColor(22, 20, 20);
          doc.setFont('courier', 'normal');
          doc.setFontSize(11);
          let y = 110;
          doc.splitTextToSize(txt, 504).forEach(line => {
            if (y > 740) { doc.addPage(); y = 54; }
            doc.text(line, 54, y);
            y += 16;
          });
          doc.save(`INKREALM_MAYFAIR_${dateStamp}.pdf`);
          playSolenoid(320, 0.05);
          saveStatus.textContent = 'EXPORTED: .PDF (STAMPED)';
          setTimeout(() => saveStatus.textContent = 'URL MEMORY: SYNCED', 2200);
          return;
        }

        let stamped = txt;
        if (ext === 'wsd') {
          stamped = `.HE INKREALM // https://inkrealm.info\r\n.FO MAYFAIR DOSSIER · ${dateStamp}\r\n\r\n` + txt;
        } else if (ext === 'md') {
          stamped = `# INKREALM — TALAMASCA DOLL-PROCESSOR\n> https://inkrealm.info · ${dateStamp}\n\n![Mayfair Triptych](${TRIPTYCH_GIF})\n\n---\n\n` + txt;
        } else {
          stamped = `INKREALM // https://inkrealm.info\nTALAMASCA DOLL-PROCESSOR · ${dateStamp}\n----------------------------------------------------------------\n\n` + txt;
        }

        const blob = new Blob([stamped], { type: ext === 'txt' ? 'text/plain;charset=utf-8' : 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `INKREALM_MAYFAIR_${dateStamp}.${ext}`;
        a.click();
        URL.revokeObjectURL(a.href);
        playSolenoid(320, 0.05);
        saveStatus.textContent = `EXPORTED: .${ext.toUpperCase()}`;
        setTimeout(() => saveStatus.textContent = 'URL MEMORY: SYNCED', 2200);
      };
    });

    document.getElementById('btn-imp').onclick = () => document.getElementById('file-imp').click();
    document.getElementById('file-imp').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { editor.innerText = r.result; updateMetrics(); syncImmortalMemory(); playSolenoid(400, 0.08); };
      r.readAsText(f); e.target.value = '';
    };
    document.getElementById('btn-purge').onclick = () => {
      if (confirm('PURGE ACTIVE DOSSIER BUFFER?')) {
        editor.innerHTML = ''; updateMetrics();
        localStorage.removeItem('PWP_FITTED_TEXT_V7'); localStorage.removeItem('MONA_HTML');
        idbSet('active_html', '');
        history.replaceState(null, '', ' ');
        saveStatus.textContent = 'BUFFER PURGED';
      }
    };

    // ================= 7. INPUT EVENTS & CTRL+K CHORDS =================
    let ctrlKArmed = false;
    editor.addEventListener('input', () => { updateMetrics(); scheduleSync(); playSolenoid(); });
    editor.addEventListener('keyup', updateMetrics);
    editor.addEventListener('click', updateMetrics);
    editor.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key.toLowerCase() === 'k') {
        e.preventDefault(); ctrlKArmed = true;
        saveStatus.textContent = 'WAITING: [S=SAVE/BAK, R=RESTORE, D=DONE]';
        return;
      }
      if (ctrlKArmed) {
        ctrlKArmed = false;
        const k = e.key.toLowerCase();
        if (k === 's' || k === 'd') { e.preventDefault(); createBakCheckpoint(); }
        else if (k === 'r') { e.preventDefault(); restoreLatestBak(); }
      }
    });
    editor.addEventListener('paste', e => {
      e.preventDefault();
      document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
    });

    // ================= 8. CONNECTED RED CRT LASER POINTER TRAIL =================
    (function initPointerTrail() {
      const canvas = document.getElementById('trailCanvas');
      const ctx = canvas.getContext('2d');
      let W, H, dpr;
      const pts = [];
      const LIFE = 380;
      function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', e => pts.push({ x: e.clientX, y: e.clientY, t: performance.now() }));
      (function render() {
        requestAnimationFrame(render);
        const now = performance.now();
        while (pts.length && now - pts[0].t > LIFE) pts.shift();
        ctx.clearRect(0, 0, W, H);
        if (pts.length < 2) return;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (let i = 1; i < pts.length; i++) {
          const alpha = Math.max(0, Math.min(1, (1 - (now - pts[i].t) / LIFE) * 1.3));
          ctx.strokeStyle = `rgba(230, 28, 28, ${alpha.toFixed(3)})`;
          ctx.shadowColor = 'rgba(255, 51, 51, 0.8)';
          ctx.shadowBlur = 4;
          ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
        }
      })();
    })();

    // ================= 9. INIT =================
    loadInitialDossier();
    const savedMedia = localStorage.getItem('MONA_MEDIA');
    if (savedMedia) {
      if ([...videoSelect.options].some(o => o.value === savedMedia)) videoSelect.value = savedMedia;
      else { videoSelect.value = 'custom'; customVideo.style.display = 'block'; customVideo.value = savedMedia; }
    }
  </script>
