<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>'Trix Writing App</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora&family=Roboto&family=Open+Sans&family=Merriweather&family=OpenDyslexic:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js"></script>
    <style>
        :root {
            --red: #ff0033;
            --black: #0a0a0a;
            --sidebar-width: 280px;
        }

        ::selection {
            background: var(--red);
            color: var(--black);
            text-shadow: none;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            overflow: hidden;
            background: #1a1a1a;
            color: #e0e0e0;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background-color: rgba(0, 0, 0, 0.92);
            color: #ff0000;
            padding: 20px 16px;
            overflow-y: auto;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .sidebar .menu-item {
            margin-bottom: 14px;
            cursor: pointer;
            font-size: 15px;
        }

        .sidebar .menu-item:hover {
            color: #ff3333;
            text-decoration: underline;
        }

        .sidebar label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            opacity: 0.9;
        }

        .sidebar input[type="color"],
        .sidebar select,
        .sidebar input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }

        .sidebar button,
        #addCharacter,
        #voiceButton,
        #resetButton {
            background: #ff0000;
            color: white;
            border: none;
            padding: 10px 14px;
            margin-top: 8px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            min-height: 44px;
        }

        .sidebar button:hover,
        #addCharacter:hover {
            background: #ff3333;
        }

        #characterList {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }

        #characterList li {
            color: #ff0000;
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 4px;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        #characterList li:hover {
            background: rgba(255, 0, 0, 0.2);
            color: #ff3333;
        }

        /* Range sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #555;
            outline: none;
            margin: 12px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ff0000;
            cursor: pointer;
            border: 2px solid #fff;
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ff0000;
            cursor: pointer;
            border: 2px solid #fff;
        }

        /* ===== CONTENT AREA ===== */
        .content {
            flex-grow: 1;
            padding: 16px;
            background-color: rgba(50, 50, 50, 0.65);
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .top-bar .menu-item {
            display: inline-block;
            cursor: pointer;
            color: #ff0000;
            font-size: 15px;
            padding: 6px 4px;
        }

        .top-bar .menu-item:hover {
            color: #ff3333;
            text-decoration: underline;
        }

        #editor {
            width: 100%;
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 17px;
            line-height: 1.6;
            resize: none;
            background-color: rgba(26, 26, 26, 0.7);
            color: #e0e0e0;
            padding: 14px;
            border-radius: 6px;
            font-family: inherit;
        }

        #word-counter {
            background-color: rgba(0, 0, 0, 0.85);
            color: #ff0000;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 14px;
            margin-left: auto;
        }

        /* Mobile menu button */
        .menu-toggle {
            display: none;
            background: #ff0000;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            font-size: 22px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Backdrop for mobile drawer */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 40;
        }

        .sidebar-backdrop.visible {
            display: block;
        }

        /* Popup toolbar */
        .popup-toolbar {
            display: none;
            position: absolute;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 6px;
            border-radius: 6px;
            z-index: 60;
        }

        .popup-toolbar button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 2px;
            cursor: pointer;
            border-radius: 4px;
            min-width: 40px;
            min-height: 40px;
        }

        .popup-toolbar button:hover {
            background-color: #ff3333;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .content {
                padding: 12px;
                width: 100%;
            }

            #editor {
                font-size: 16px; /* prevents iOS zoom */
                height: calc(100vh - 140px);
            }

            .top-bar {
                gap: 10px;
            }

            .top-bar .menu-item {
                font-size: 14px;
            }
        }

        /* Light mode overrides when toggled */
        body.light-mode {
            background: #f5f5f5;
            color: #111;
        }

        body.light-mode .content {
            background-color: rgba(255, 255, 255, 0.85);
        }

        body.light-mode #editor {
            background-color: rgba(255, 255, 255, 0.9);
            color: #222;
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="menu-item" onclick="toggleMatrixAnimation()">Start / Stop 'Trix</div>

            <img width="88" height="88" src="https://raw.githubusercontent.com/ghostm68/pantheon/main/trixinkrealm.gif" alt="Trix" style="display:block;margin:10px 0;">

            <div class="menu-item">
                <label for="colorPicker">select shade:</label>
                <input type="color" id="colorPicker" value="#666666">
                <button onclick="randomizeColor()" style="margin-top:8px;">random</button>
            </div>

            <div class="menu-item">
                <label for="speedSlider">trix speed: <span id="speedValue">50</span></label>
                <input type="range" id="speedSlider" min="10" max="200" value="50">
            </div>

            <div class="menu-item">
                <label for="fontSizeSlider">trix size: <span id="fontSizeValue">16</span></label>
                <input type="range" id="fontSizeSlider" min="8" max="32" value="16">
            </div>

            <div class="menu-item">
                <label for="charSetSelect">trix set:</label>
                <select id="charSetSelect">
                    <option value="matrix">Matrix (Katakana + Latin + Nums)</option>
                    <option value="binary">Binary</option>
                    <option value="ascii">ASCII</option>
                    <option value="hiragana">Hiragana</option>
                    <option value="greek">Greek</option>
                    <option value="cyrillic">Cyrillic</option>
                    <option value="math">Math</option>
                    <option value="special">Special</option>
                    <option value="devanagari">Devanagari</option>
                    <option value="arabic">Arabic</option>
                    <option value="hebrew">Hebrew</option>
                    <option value="thai">Thai</option>
                    <option value="bengali">Bengali</option>
                    <option value="korean">Korean</option>
                </select>
            </div>

            <button id="voiceButton" onclick="toggleVoiceInput()">Voice Input</button>
            <button id="resetButton" onclick="resetToDefaults()">Reset Trix</button>

            <div class="menu-item" onclick="toggleDarkMode()">Switch Screen</div>
            <div class="menu-item" onclick="changeFont()">Text Font</div>
            <div class="menu-item" onclick="toggleTypewriterSound()">"Type" Sound</div>
            <div class="menu-item" onclick="toggleOpenDyslexic()">OpenDyslexic</div>

            <h2 style="font-size:16px;margin:20px 0 8px;">character list</h2>
            <div id="character-management">
                <input type="text" id="characterNameInput" placeholder="Enter character name">
                <button id="addCharacter">+</button>
                <ul id="characterList"></ul>
            </div>

            <div id="screenplay-format" style="margin-top:20px;">
                <label for="screenplay-elements">Screenplay Element:</label>
                <select id="screenplay-elements">
                    <option value="">Select format</option>
                    <option value="scene">Scene Heading</option>
                    <option value="action">Action</option>
                    <option value="character">Character</option>
                    <option value="dialogue">Dialogue</option>
                    <option value="parenthetical">Parenthetical</option>
                    <option value="transition">Transition</option>
                </select>
            </div>
        </div>

        <div class="content">
            <div class="top-bar">
                <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
                <div class="menu-item" onclick="saveDocument()">Save</div>
                <div class="menu-item" onclick="loadDocument()">Open</div>
                <div class="menu-item" onclick="printDocument()">Print</div>
                <div id="word-counter">Words: 0</div>
            </div>

            <textarea id="editor" placeholder="Start writing… (some features still in development)"></textarea>
        </div>
    </div>

    <div class="popup-toolbar" id="popupToolbar">
        <button onclick="applyFormatting('bold')"><strong>B</strong></button>
        <button onclick="applyFormatting('italic')"><em>I</em></button>
        <button onclick="applyFormatting('underline')"><u>U</u></button>
    </div>

<script>
/* ========== MATRIX RAIN ========== */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let paused = false;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.ceil(canvas.width / fontSize);
    rainDrops = Array(columns).fill(1);
}
window.addEventListener('resize', resizeCanvas);

const katakana = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヰヱヲン';
const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const nums = '0123456789';
const hiragana = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん';
const greek = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
const cyrillic = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
const math = '∀∂∃∅∇∈∉∋∏∑−∕∗∘√∝∞∟∠∡∢∧∨∩∪∫∬∭∮∯∰∴∵∶∷∼∽∾∿≀≁≈≉≠≡≢≤≥≦≧≨≩≪≫≬≭≮≯≰≱≲≳≴≵≶≷≸≹≺≻≼≽≾≿⊀⊁⊂⊃⊄⊅⊆⊇⊈⊉⊊⊋⊌⊍⊎⊏⊐⊑⊒⊓⊔⊕⊖⊗⊘⊙⊚⊛⊜⊝⊞⊟⊠⊡⊢⊣⊤⊥⊦⊧⊨⊩⊪⊫⊬⊭⊮⊯⊰⊱⊲⊳⊴⊵⊶⊷⊸⊹⊺⊻⊼⊽⊾⊿⋀⋁⋂⋃⋄⋅⋆⋇⋈⋉⋊⋋⋌⋍⋎⋏⋐⋑⋒⋓⋔⋕⋖⋗⋘⋙⋚⋛⋜⋝⋞⋟⋠⋡⋢⋣⋤⋥⋦⋧⋨⋩⋪⋫⋬⋭⋮⋯⋰⋱⋲⋳⋴⋵⋶⋷⋸⋹⋺⋻⋼⋽⋾⋿';
const special = '!@#$%^&*()_+-=[]{}|;:,.<>?`~';
const devanagariNums = '०१२३४५६७८९';
const devanagariAlphabets = 'अआइईउऊऋऌऍएऐऑओऔकखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसह';
const arabic = 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي';
const hebrew = 'אבגדהוזחטיכלמנסעפצקרשת';
const thai = 'กขฃคฅฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ';
const bengali = 'অআইঈউঊঋঌএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহড়ঢ়য়';
const korean = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ';

let alphabet = katakana + latin + nums;
let fontSize = 16;
let columns = 0;
let rainDrops = [];
let color = '#666666';
let speed = 50;
let interval = null;

function draw() {
    if (paused) return;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = color;
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            rainDrops[i] = 0;
        }
        rainDrops[i]++;
    }
}

function startMatrix() {
    clearInterval(interval);
    interval = setInterval(draw, speed);
}

function toggleMatrixAnimation() {
    paused = !paused;
}

function randomizeColor() {
    color = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
    document.getElementById('colorPicker').value = color;
    saveSettings();
}

function updateColor(newColor) {
    color = newColor;
    saveSettings();
}

function updateSpeed(newSpeed) {
    speed = parseInt(newSpeed, 10);
    document.getElementById('speedValue').textContent = speed;
    startMatrix();
    saveSettings();
}

function updateFontSize(newSize) {
    fontSize = parseInt(newSize, 10);
    document.getElementById('fontSizeValue').textContent = fontSize;
    resizeCanvas();
    saveSettings();
}

function updateCharacterSet(set) {
    switch (set) {
        case 'matrix': alphabet = katakana + latin + nums; break;
        case 'binary': alphabet = '01'; break;
        case 'ascii': alphabet = Array.from({length: 95}, (_, i) => String.fromCharCode(i + 32)).join(''); break;
        case 'hiragana': alphabet = hiragana; break;
        case 'greek': alphabet = greek; break;
        case 'cyrillic': alphabet = cyrillic; break;
        case 'math': alphabet = math; break;
        case 'special': alphabet = special; break;
        case 'devanagari': alphabet = devanagariNums + devanagariAlphabets; break;
        case 'arabic': alphabet = arabic; break;
        case 'hebrew': alphabet = hebrew; break;
        case 'thai': alphabet = thai; break;
        case 'bengali': alphabet = bengali; break;
        case 'korean': alphabet = korean; break;
        default: alphabet = katakana + latin + nums;
    }
    saveSettings();
}

function resetToDefaults() {
    color = '#666666';
    speed = 50;
    fontSize = 16;
    alphabet = katakana + latin + nums;
    document.getElementById('colorPicker').value = color;
    document.getElementById('speedSlider').value = speed;
    document.getElementById('speedValue').textContent = speed;
    document.getElementById('fontSizeSlider').value = fontSize;
    document.getElementById('fontSizeValue').textContent = fontSize;
    document.getElementById('charSetSelect').value = 'matrix';
    updateSpeed(speed);
    updateFontSize(fontSize);
    saveSettings();
}

/* ========== WRITING APP ========== */
let darkMode = true;
let currentFont = 'Lora';
let typewriterSound = false;
let openDyslexicMode = false;
const fonts = ['Lora', 'Roboto', 'Open Sans', 'Merriweather', 'Arial', 'Helvetica', 'Times New Roman', 'Courier New', 'Georgia', 'Palatino', 'Garamond', 'Bookman', 'Comic Sans MS', 'Trebuchet MS', 'Arial Black', 'Impact'];
const typewriterAudio = new Audio('https://github.com/ghostm68/pantheon/raw/f6021c2d479492ddb8b08d2625f57f2ac8e4d026/typewrit.wav');

let recognition = null;
let isListening = false;
let characters = [];

/* ----- Persistence ----- */
function saveSettings() {
    const data = {
        color, speed, fontSize,
        charSet: document.getElementById('charSetSelect').value,
        darkMode, currentFont, typewriterSound, openDyslexicMode,
        characters
    };
    localStorage.setItem('trixSettings', JSON.stringify(data));
}

function saveDocumentContent() {
    localStorage.setItem('trixDocument', document.getElementById('editor').value);
}

function loadSettings() {
    try {
        const raw = localStorage.getItem('trixSettings');
        if (!raw) return;
        const data = JSON.parse(raw);

        if (data.color) {
            color = data.color;
            document.getElementById('colorPicker').value = color;
        }
        if (data.speed) {
            speed = data.speed;
            document.getElementById('speedSlider').value = speed;
            document.getElementById('speedValue').textContent = speed;
        }
        if (data.fontSize) {
            fontSize = data.fontSize;
            document.getElementById('fontSizeSlider').value = fontSize;
            document.getElementById('fontSizeValue').textContent = fontSize;
        }
        if (data.charSet) {
            document.getElementById('charSetSelect').value = data.charSet;
            updateCharacterSet(data.charSet);
        }
        if (typeof data.darkMode === 'boolean') {
            darkMode = data.darkMode;
            applyDarkMode();
        }
        if (data.currentFont) {
            currentFont = data.currentFont;
            document.getElementById('editor').style.fontFamily = currentFont;
        }
        if (typeof data.typewriterSound === 'boolean') {
            typewriterSound = data.typewriterSound;
            if (typewriterSound) {
                document.getElementById('editor').addEventListener('keypress', playTypewriterSound);
            }
        }
        if (typeof data.openDyslexicMode === 'boolean') {
            openDyslexicMode = data.openDyslexicMode;
            applyOpenDyslexic();
        }
        if (Array.isArray(data.characters)) {
            characters = data.characters;
            updateCharacterList();
        }
    } catch (e) {
        console.warn('Could not load settings', e);
    }
}

function loadDocumentContent() {
    const saved = localStorage.getItem('trixDocument');
    if (saved !== null) {
        document.getElementById('editor').value = saved;
        updateWordCount();
    }
}

/* ----- UI helpers ----- */
function applyDarkMode() {
    if (darkMode) {
        document.body.classList.remove('light-mode');
        document.body.style.backgroundColor = '#1a1a1a';
        document.body.style.color = '#e0e0e0';
    } else {
        document.body.classList.add('light-mode');
        document.body.style.backgroundColor = '#f5f5f5';
        document.body.style.color = '#111';
    }
}

function toggleDarkMode() {
    darkMode = !darkMode;
    applyDarkMode();
    saveSettings();
}

function changeFont() {
    const idx = fonts.indexOf(currentFont);
    currentFont = fonts[(idx + 1) % fonts.length];
    if (!openDyslexicMode) {
        document.getElementById('editor').style.fontFamily = currentFont;
    }
    saveSettings();
}

function toggleTypewriterSound() {
    typewriterSound = !typewriterSound;
    const editor = document.getElementById('editor');
    if (typewriterSound) {
        editor.addEventListener('keypress', playTypewriterSound);
    } else {
        editor.removeEventListener('keypress', playTypewriterSound);
    }
    saveSettings();
}

function playTypewriterSound() {
    if (typewriterAudio) {
        typewriterAudio.currentTime = 0;
        typewriterAudio.play().catch(() => {});
    }
}

function applyOpenDyslexic() {
    const editor = document.getElementById('editor');
    if (openDyslexicMode) {
        document.body.style.fontFamily = 'OpenDyslexic, sans-serif';
        editor.style.fontFamily = 'OpenDyslexic, sans-serif';
    } else {
        document.body.style.fontFamily = 'Lora, serif';
        editor.style.fontFamily = currentFont;
    }
}

function toggleOpenDyslexic() {
    openDyslexicMode = !openDyslexicMode;
    applyOpenDyslexic();
    saveSettings();
}

/* ----- Voice ----- */
function setupSpeechRecognition() {
    if (!('webkitSpeechRecognition' in window)) {
        alert('Speech recognition is not supported in this browser.');
        return;
    }
    recognition = new webkitSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = function (event) {
        const result = event.results[event.results.length - 1];
        if (result.isFinal) {
            insertTextAtCursor(result[0].transcript + ' ');
        }
    };
    recognition.onerror = function (event) {
        console.error('Speech recognition error:', event.error);
    };
}

function toggleVoiceInput() {
    if (!recognition) setupSpeechRecognition();
    if (!recognition) return;

    if (isListening) {
        recognition.stop();
        isListening = false;
        document.getElementById('voiceButton').textContent = 'Voice Input';
    } else {
        recognition.start();
        isListening = true;
        document.getElementById('voiceButton').textContent = 'Stop Voice';
    }
}

function insertTextAtCursor(text) {
    const editor = document.getElementById('editor');
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const before = editor.value.substring(0, start);
    const after = editor.value.substring(end);
    editor.value = before + text + after;
    editor.selectionStart = editor.selectionEnd = start + text.length;
    editor.focus();
    updateWordCount();
    saveDocumentContent();
}

/* ----- Document actions ----- */
function saveDocument() {
    const text = document.getElementById('editor').value;
    const fileType = prompt('Enter file type to save (txt or pdf):', 'txt');
    if (fileType === 'txt') {
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'document.txt';
        a.click();
    } else if (fileType === 'pdf') {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text(text, 10, 10);
        doc.save('document.pdf');
    } else if (fileType !== null) {
        alert("Please choose 'txt' or 'pdf'.");
    }
}

function loadDocument() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.txt,.pdf';
    input.onchange = function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();

        if (file.type === 'text/plain') {
            reader.onload = function (ev) {
                document.getElementById('editor').value = ev.target.result;
                updateWordCount();
                saveDocumentContent();
            };
            reader.readAsText(file);
        } else if (file.type === 'application/pdf') {
            reader.onload = function (ev) {
                const typedarray = new Uint8Array(ev.target.result);
                pdfjsLib.getDocument({ data: typedarray }).promise.then(function (pdf) {
                    let text = '';
                    let loaded = 0;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        pdf.getPage(i).then(function (page) {
                            page.getTextContent().then(function (content) {
                                text += content.items.map(item => item.str).join(' ') + '\n\n';
                                loaded++;
                                if (loaded === pdf.numPages) {
                                    document.getElementById('editor').value = text.trim();
                                    updateWordCount();
                                    saveDocumentContent();
                                }
                            });
                        });
                    }
                });
            };
            reader.readAsArrayBuffer(file);
        }
    };
    input.click();
}

function printDocument() {
    window.print();
}

function updateWordCount() {
    const text = document.getElementById('editor').value.trim();
    const count = text ? text.split(/\s+/).length : 0;
    document.getElementById('word-counter').textContent = 'Words: ' + count;
}

/* ----- Screenplay ----- */
function applyScreenplayFormat() {
    const editor = document.getElementById('editor');
    const format = document.getElementById('screenplay-elements').value;
    if (!format) return;

    let formatted = '';
    switch (format) {
        case 'scene': formatted = '\nINT. LOCATION - DAY\n\n'; break;
        case 'action': formatted = '\nAction description goes here.\n\n'; break;
        case 'character': formatted = '\n\nCHARACTER NAME\n'; break;
        case 'dialogue': formatted = '\nDialogue goes here.\n\n'; break;
        case 'parenthetical': formatted = '\n(parenthetical)\n'; break;
        case 'transition': formatted = '\n\nCUT TO:\n\n'; break;
    }

    insertTextAtCursor(formatted);
    document.getElementById('screenplay-elements').value = '';
}

/* ----- Formatting popup ----- */
function showPopupToolbar(event) {
    const toolbar = document.getElementById('popupToolbar');
    toolbar.style.display = 'block';
    toolbar.style.left = Math.min(event.clientX, window.innerWidth - 140) + 'px';
    toolbar.style.top = (event.clientY + 8) + 'px';
}

function applyFormatting(format) {
    const editor = document.getElementById('editor');
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const selection = editor.value.substring(start, end);
    let formatted = selection;

    switch (format) {
        case 'bold': formatted = `**${selection}**`; break;
        case 'italic': formatted = `*${selection}*`; break;
        case 'underline': formatted = `__${selection}__`; break;
    }

    editor.setRangeText(formatted, start, end, 'end');
    editor.focus();
    document.getElementById('popupToolbar').style.display = 'none';
    saveDocumentContent();
}

/* ----- Characters ----- */
function updateCharacterList() {
    const list = document.getElementById('characterList');
    list.innerHTML = '';
    characters.forEach((name, index) => {
        const li = document.createElement('li');
        li.textContent = name;
        li.addEventListener('click', () => insertCharacter(index));
        list.appendChild(li);
    });
}

function insertCharacter(index) {
    insertTextAtCursor(' ' + characters[index] + ' ');
}

/* ----- Mobile sidebar ----- */
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    sidebar.classList.toggle('open');
    backdrop.classList.toggle('visible');
}

/* ----- Init ----- */
document.addEventListener('DOMContentLoaded', () => {
    resizeCanvas();
    startMatrix();

    // Controls
    document.getElementById('colorPicker').addEventListener('input', e => updateColor(e.target.value));
    document.getElementById('speedSlider').addEventListener('input', e => updateSpeed(e.target.value));
    document.getElementById('fontSizeSlider').addEventListener('input', e => updateFontSize(e.target.value));
    document.getElementById('charSetSelect').addEventListener('change', e => updateCharacterSet(e.target.value));
    document.getElementById('screenplay-elements').addEventListener('change', applyScreenplayFormat);

    // Characters
    document.getElementById('addCharacter').addEventListener('click', () => {
        const name = document.getElementById('characterNameInput').value.trim();
        if (name) {
            characters.push(name);
            updateCharacterList();
            document.getElementById('characterNameInput').value = '';
            saveSettings();
        }
    });

    // Editor
    const editor = document.getElementById('editor');
    editor.addEventListener('input', () => {
        updateWordCount();
        saveDocumentContent();
    });
    editor.addEventListener('select', showPopupToolbar);

    // Close popup when clicking outside
    document.addEventListener('click', e => {
        if (!e.target.closest('#popupToolbar') && !e.target.closest('#editor')) {
            document.getElementById('popupToolbar').style.display = 'none';
        }
    });

    // Mobile menu
    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarBackdrop').addEventListener('click', toggleSidebar);

    // Load saved state
    loadSettings();
    loadDocumentContent();
    applyDarkMode();
    applyOpenDyslexic();
    updateWordCount();
});
</script>
